\sin 3t\\,dt", "hint": "Find L{t sin 3t} = 6s/(s²+9)² and set s = 2.", "steps": [{"text": "Evaluate at s = 2:", "math": "\\left.\\frac{6s}{(s^2+9)^2}\\right|_{s=2} = \\frac{12}{169}"}], "answer": "\\frac{12}{169}"}, {"id": "Q165", "tag": "Set 9 · Q.1(g) · 1M", "marks": "1M", "level": "Advanced", "prompt": "Find the Laplace transform:", "promptMath": "\\mathcal{L}\\{\\cosh at\\,\\cos at\\}", "hint": "Write cosh at = ½(e^{at} + e^{−at}) and apply First Shifting.", "steps": [{"text": "Combine the two shifted cosine transforms:", "math": "\\frac{1}{2}\\!\\left[\\frac{s-a}{(s-a)^2+a^2} + \\frac{s+a}{(s+a)^2+a^2}\\right] = \\frac{s^3}{s^4 + 4a^4}"}], "answer": "\\frac{s^3}{s^4 + 4a^4}"}, {"id": "Q166", "tag": "Set 9 · Q.1(h) · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate the inverse Laplace transform:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{(s - 2)^5}\\right\\}", "hint": "First Shifting Theorem + L⁻¹{1/s⁵} = t⁴/4!.", "steps": [{"text": "Pull out e^{2t} and invert 1/s⁵:", "math": "e^{2t}\\,\\frac{t^4}{4!} = \\frac{t^4 e^{2t}}{24}"}], "answer": "\\frac{t^4 e^{2t}}{24}"}, {"id": "Q156", "tag": "Topic 6.1 · 1st Shifting · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the Laplace transform:", "promptMath": "\\mathcal{L}\\{e^{-3t}(2\\cos 5t - 3\\sin 5t)\\}", "hint": "Replace s → s + 3 in 2s/(s²+25) − 15/(s²+25).", "steps": [{"text": "Apply First Shifting Theorem:", "math": "\\frac{2(s+3) - 15}{(s+3)^2 + 25} = \\frac{2s - 9}{s^2 + 6s + 34}"}], "answer": "\\frac{2s - 9}{s^2 + 6s + 34}"}, {"id": "Q162", "tag": "Topic 6.1 · Cover-Up Inverse · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the inverse Laplace transform using Heaviside Cover-Up:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{3s + 7}{s^2 - 2s - 3}\\right\\}", "hint": "Factor denominator (s − 3)(s + 1); plug s = 3 and s = −1.", "steps": [{"text": "Cover-Up: A = (9+7)/4 = 4; B = (−3+7)/(−4) = −1:", "math": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{4}{s-3} - \\frac{1}{s+1}\\right\\} = 4e^{3t} - e^{-t}"}], "answer": "4e^{3t} - e^{-t}"}]}, {"id": "t6_2", "code": "6.2", "title": "Derivatives/Integrals & Mult./Div. by t (Sec. 6.2 & 6.6)", "summary": "L{y′}, L{y″}, division by s (integral), multiplication by t^n (−d/ds), and division by t (∫_s^∞).", "formulas": [{"id": "f6_2_1", "name": "Transforms of Derivatives & Division by s", "math": "\\mathcal{L}\\{y'\\} = sY - y(0),\\quad \\mathcal{L}\\{y''\\} = s^2 Y - sy(0) - y'(0),\\quad \\mathcal{L}^{-1}\\!\\left\\{\\frac{F(s)}{s}\\right\\} = \\int_0^t f(\\tau)\\,d\\tau", "note": "Repeat the 0 → t integral twice for F(s)/s²!", "trick": "Inverts 1/[s(s²+ω²)] without partial fractions!", "trap": false}, {"id": "f6_2_2", "name": "Mult. by t^n & Div. by t", "math": "\\mathcal{L}\\{t^n f(t)\\} = (-1)^n F^{(n)}(s), \\qquad \\mathcal{L}\\!\\left\\{\\frac{f(t)}{t}\\right\\} = \\int_s^\\infty F(u)\\,du", "note": "Inverse of ln(·) or cot⁻¹(·): f(t) = −(1/t) L⁻¹{F′(s)}.", "trick": "EXAM TRAP: L{(cos t)/t} does NOT exist because lim_{t→0⁺} (cos t)/t = ∞!", "trap": true}], "steps": ["For t^n f(t), find F(s) and apply (−d/ds)^n.", "For f(t)/t, check lim_{t→0⁺} f(t)/t exists, then integrate F(u) from s to ∞.", "For inverse of ln(A/B) or cot⁻¹(s/a), compute F′(s), invert, and divide by −t."], "questions": [{"id": "Q169", "tag": "Set 1 · Q.1(i) · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate using differentiation of transforms:", "promptMath": "\\mathcal{L}\\{t\\sin 3t\\}", "hint": "Apply −d/ds to 3/(s² + 9).", "steps": [{"text": "Differentiate:", "math": "-\\frac{d}{ds}\\!\\left(\\frac{3}{s^2+9}\\right) = \\frac{6s}{(s^2+9)^2}"}], "answer": "\\frac{6s}{(s^2 + 9)^2}"}, {"id": "Q179", "tag": "Set 8 · Q.1(j) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the Laplace transform:", "promptMath": "\\mathcal{L}\\{t\\cos\\omega t\\}", "hint": "Apply −d/ds to s/(s² + ω²).", "steps": [{"text": "Differentiate:", "math": "-\\frac{d}{ds}\\!\\left(\\frac{s}{s^2+\\omega^2}\\right) = \\frac{s^2 - \\omega^2}{(s^2+\\omega^2)^2}"}], "answer": "\\frac{s^2 - \\omega^2}{(s^2 + \\omega^2)^2}"}, {"id": "Q173", "tag": "Set 3 · Q.1(i) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Find L{(sin t)/t} and deduce the Dirichlet integral:", "promptMath": "\\mathcal{L}\\!\\left\\{\\frac{\\sin t}{t}\\right\\} \\implies \\int_0^\\infty \\frac{\\sin t}{t}\\,dt", "hint": "Integrate 1/(u²+1) from s to ∞, then let s → 0⁺.", "steps": [{"text": "Integrate and let s → 0⁺:", "math": "\\int_s^\\infty \\frac{du}{u^2+1} = \\cot^{-1}s \\xrightarrow{s\\to 0^+} \\frac{\\pi}{2}"}], "answer": "\\cot^{-1}s,\\qquad \\int_0^\\infty\\frac{\\sin t}{t}\\,dt = \\frac{\\pi}{2}"}, {"id": "Q183", "tag": "Set 1 · Q.5(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Find the inverse Laplace transform:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\ln\\frac{s^2 + 4}{s(s + 2)}\\right\\}", "hint": "Split log, compute F′(s), invert, and divide by −t.", "steps": [{"text": "Differentiate F(s):", "math": "F'(s) = \\frac{2s}{s^2+4} - \\frac{1}{s} - \\frac{1}{s+2} \\implies -t f(t) = 2\\cos 2t - 1 - e^{-2t}"}], "answer": "\\frac{1 + e^{-2t} - 2\\cos 2t}{t}"}, {"id": "Q180", "tag": "Set 9 · Q.1(i) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Find the Laplace transform:", "promptMath": "\\mathcal{L}\\{t e^{3t}\\sin 2t\\}", "hint": "Find L{t sin 2t} = 4s/(s²+4)² then apply First Shifting s → s − 3.", "steps": [{"text": "Shift s → s − 3:", "math": "\\frac{4(s - 3)}{[(s - 3)^2 + 4]^2}"}], "answer": "\\frac{4(s - 3)}{[(s - 3)^2 + 4]^2}"}, {"id": "Q171", "tag": "Set 2 · Q.1(j) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Evaluate the inverse Laplace transform:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\ln\\frac{s + a}{s + b}\\right\\}", "hint": "Differentiate F(s) = ln(s+a) − ln(s+b), invert, and divide by −t.", "steps": [{"text": "−F′(s) = 1/(s+b) − 1/(s+a) ⇒ t f(t) = e^{−bt} − e^{−at}:", "math": "f(t) = \\frac{e^{-bt} - e^{-at}}{t}"}], "answer": "\\frac{e^{-bt} - e^{-at}}{t}"}, {"id": "Q176", "tag": "Topic 6.2 · Division by s · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate without partial fractions using Division by s:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{s(s^2 + a^2)}\\right\\}", "hint": "Integrate (sin aτ)/a from 0 to t.", "steps": [{"text": "Apply L⁻¹{F(s)/s} = ∫₀^t f(τ) dτ:", "math": "\\int_0^t \\frac{\\sin a\\tau}{a}\\,d\\tau = \\frac{1 - \\cos at}{a^2}"}], "answer": "\\frac{1 - \\cos at}{a^2}"}]}, {"id": "t6_3", "code": "6.3", "title": "Unit Step (Heaviside) Function & Second Shifting Theorem (t-Shifting)", "summary": "Boxcar pulse switches g(t)[u(t−a)−u(t−b)], forward/inverse Second Shifting, and the unshifted f(t+a) shortcut.", "formulas": [{"id": "f6_3_1", "name": "Second Shifting Theorem & Unshifted Shortcut", "math": "\\mathcal{L}\\{f(t - a)\\,u(t - a)\\} = e^{-as}F(s), \\qquad \\mathcal{L}\\{g(t)\\,u(t - a)\\} = e^{-as}\\mathcal{L}\\{g(t + a)\\}", "note": "Boxcar pulse on a < t < b: g(t)[u(t − a) − u(t − b)].", "trick": "Inverse: ignore e^{−as}, invert F(s) → f(t), replace EVERY t with (t − a), and attach u(t − a)!", "trap": false}], "steps": ["Rewrite piecewise signals with u(t − a) switches.", "Forward: use e^{−as} L{g(t + a)} whenever g(t) is not already written in terms of (t − a).", "Inverse: invert F(s) first, then shift t → t − a and attach u(t − a)."], "questions": [{"id": "Q187", "tag": "Set 1 · Q.1(h) · 1M", "marks": "1M", "level": "Basic", "prompt": "Express using u(t − π) and find the Laplace transform of f(t) = 0 for 0 ≤ t < π and sin(t − π) for t ≥ π.", "promptMath": "f(t) = \\sin(t - \\pi)\\,u(t - \\pi)", "hint": "Directly in f(t − π)u(t − π) form with f(t) = sin t!", "steps": [{"text": "Apply Second Shifting Theorem:", "math": "\\mathcal{L}\\{f(t)\\} = e^{-\\pi s}\\mathcal{L}\\{\\sin t\\} = \\frac{e^{-\\pi s}}{s^2 + 1}"}], "answer": "\\frac{e^{-\\pi s}}{s^2 + 1}"}, {"id": "Q189", "tag": "Set 5 · Q.1(h) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Find the Laplace transform using the Unshifted Step shortcut:", "promptMath": "\\mathcal{L}\\{t^2\\,u(t - 1)\\}", "hint": "Use e^{−s} L{(t + 1)²}.", "steps": [{"text": "Expand (t + 1)² = t² + 2t + 1:", "math": "e^{-s}\\mathcal{L}\\{t^2 + 2t + 1\\} = e^{-s}\\!\\left(\\frac{2}{s^3} + \\frac{2}{s^2} + \\frac{1}{s}\\right)"}], "answer": "e^{-s}\\!\\left(\\frac{2}{s^3} + \\frac{2}{s^2} + \\frac{1}{s}\\right)"}, {"id": "Q196", "tag": "Set 3 · Q.6(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Express f(t) = 4t on (0, 1) and 0 for t > 1 via u(t − 1) and find L{f(t)}.", "promptMath": "f(t) = 4t\\big[1 - u(t - 1)\\big]", "hint": "Split into 4t − 4t u(t − 1) and use the unshifted shortcut on t u(t − 1).", "steps": [{"text": "Transform term by term:", "math": "\\frac{4}{s^2} - 4e^{-s}\\mathcal{L}\\{t + 1\\} = \\frac{4}{s^2} - \\frac{4e^{-s}}{s^2} - \\frac{4e^{-s}}{s}"}], "answer": "\\frac{4}{s^2} - \\frac{4e^{-s}}{s^2} - \\frac{4e^{-s}}{s}"}, {"id": "Q195", "tag": "Set 1 · Q.6(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Find the inverse Laplace transform:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{e^{-2s}}{(s - 1)^3} + \\frac{s e^{-\\pi s}}{s^2 + 4}\\right\\}", "hint": "Invert 1/(s−1)³ → ½t²e^t and s/(s²+4) → cos 2t, then shift by 2 and π.", "steps": [{"text": "Apply inverse Second Shifting to each term:", "math": "\\frac{1}{2}(t-2)^2 e^{t-2}u(t-2) + \\cos 2t\\,u(t-\\pi)"}], "answer": "\\frac{1}{2}(t-2)^2 e^{t-2}u(t-2) + \\cos 2t\\,u(t-\\pi)"}, {"id": "Q188", "tag": "Set 4 · Q.1(i) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the Laplace transform of the boxcar pulse f(t) = 5 on (1, 4) and 0 elsewhere:", "promptMath": "f(t) = 5\\big[u(t - 1) - u(t - 4)\\big]", "hint": "Use L{u(t − a)} = e^{−as}/s.", "steps": [{"text": "Transform term by term:", "math": "\\frac{5}{s}\\left(e^{-s} - e^{-4s}\\right)"}], "answer": "\\frac{5}{s}\\left(e^{-s} - e^{-4s}\\right)"}, {"id": "Q191", "tag": "Topic 6.3 · Unshifted Step · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Evaluate using the Unshifted Step shortcut:", "promptMath": "\\mathcal{L}\\{e^{2t}\\,u(t - 3)\\}", "hint": "e^{−3s} L{e^{2(t+3)}} = e^{6−3s} L{e^{2t}}.", "steps": [{"text": "Apply L{g(t)u(t−a)} = e^{−as} L{g(t+a)}:", "math": "e^{-3s}\\mathcal{L}\\{e^{2t+6}\\} = \\frac{e^{6 - 3s}}{s - 2}"}], "answer": "\\frac{e^{6 - 3s}}{s - 2}"}, {"id": "Q193", "tag": "Topic 6.3 · Combined Shifting · 4M", "marks": "4M", "level": "Advanced", "prompt": "Find the inverse Laplace transform (combining 1st & 2nd Shifting):", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{e^{-s}}{s^2 + 4s + 13}\\right\\}", "hint": "Complete square (s+2)² + 3² ⇒ invert to (1/3)e^{−2t} sin 3t, then shift t → t − 1.", "steps": [{"text": "Invert without e^{−s}, then apply t-shifting by a = 1:", "math": "\\frac{1}{3}e^{-2(t-1)}\\sin\\big(3(t-1)\\big)\\,u(t-1)"}], "answer": "\\frac{1}{3}e^{-2(t-1)}\\sin(3t - 3)\\,u(t - 1)"}]}, {"id": "t6_4", "code": "6.4", "title": "Convolution Theorem & Volterra Integral Equations (Sec. 6.5)", "summary": "Inverting products F(s)G(s) via f * g and solving Volterra integral & integro-differential equations.", "formulas": [{"id": "f6_4_1", "name": "Convolution Theorem & 3 Classic Squared-Factor Results", "math": "\\mathcal{L}^{-1}\\{F(s)G(s)\\} = \\int_0^t f(\\tau)g(t-\\tau)\\,d\\tau;\\qquad \\frac{s}{(s^2+a^2)^2} \\to \\frac{t\\sin at}{2a}", "note": "Also: 1/(s²+a²)² → (sin at − at cos at)/(2a³) and s²/(s²+a²)² → (sin at + at cos at)/(2a).", "trick": "If e^t ∫₀^t y(τ)e^{−τ} dτ appears in a Volterra equation, pull e^t inside to form e^{t−τ}!", "trap": false}], "steps": ["Split H(s) = F(s)·G(s), invert to f(t) and g(t), and evaluate ∫₀^t f(τ)g(t−τ)dτ w.r.t. τ.", "For Volterra equations, apply L term-by-term, solve algebraically for Y(s), and invert."], "questions": [{"id": "Q199", "tag": "Set 1 · Q.6(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Using the Convolution Theorem, evaluate:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{(s^2 + a^2)^2}\\right\\}", "hint": "Convolve (sin at)/a with (sin at)/a.", "steps": [{"text": "Integrate using 2 sin A sin B = cos(A−B) − cos(A+B):", "math": "\\frac{1}{2a^2}\\int_0^t [\\cos(2a\\tau - at) - \\cos(at)]\\,d\\tau = \\frac{\\sin at - at\\cos at}{2a^3}"}], "answer": "\\frac{\\sin at - at\\cos at}{2a^3}"}, {"id": "Q203", "tag": "Set 4 · Q.6(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Using the Convolution Theorem, evaluate:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{s^2}{(s^2 + a^2)^2}\\right\\}", "hint": "Convolve cos(at) with cos(at).", "steps": [{"text": "Integrate using 2 cos A cos B:", "math": "\\frac{1}{2}\\int_0^t [\\cos(at) + \\cos(2a\\tau - at)]\\,d\\tau = \\frac{\\sin at + at\\cos at}{2a}"}], "answer": "\\frac{\\sin at + at\\cos at}{2a}"}, {"id": "Q201", "tag": "Set 2 · Q.6(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the Volterra integral equation:", "promptMath": "y(t) - \\int_0^t y(\\tau)\\sin(t - \\tau)\\,d\\tau = t", "hint": "Y(s)[1 − 1/(s²+1)] = 1/s² ⇒ Y(s) = (s²+1)/s⁴.", "steps": [{"text": "Solve for Y(s) and invert:", "math": "Y(s) = \\frac{1}{s^2} + \\frac{1}{s^4} \\implies y(t) = t + \\frac{t^3}{6}"}], "answer": "y(t) = t + \\frac{t^3}{6}"}, {"id": "Q207", "tag": "Set 6 · Q.6(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the integro-differential equation with y(0) = 0:", "promptMath": "y'(t) + 5\\int_0^t y(\\tau)\\,d\\tau + 4y(t) = 8e^{-t}", "hint": "(s + 5/s + 4)Y = 8/(s+1) ⇒ Y = 8s / [(s+1)((s+2)² + 1)].", "steps": [{"text": "Decompose and invert:", "math": "Y = -\\frac{4}{s+1} + \\frac{4(s+2) - 4}{(s+2)^2 + 1} \\implies y(t) = -4e^{-t} + 4e^{-2t}(\\cos t - \\sin t)"}], "answer": "y(t) = -4e^{-t} + 4e^{-2t}(\\cos t - \\sin t)"}, {"id": "Q198", "tag": "Topic 6.4 · Convolution · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Use the Convolution Theorem to evaluate:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{s}{(s^2 + a^2)^2}\\right\\}", "hint": "Convolve cos(aτ) with (sin a(t−τ))/a.", "steps": [{"text": "Apply 2 sin A cos B = sin(A+B) + sin(A−B):", "math": "\\frac{1}{2a}\\int_0^t [\\sin(at) + \\sin(at - 2a\\tau)]\\,d\\tau = \\frac{t\\sin at}{2a}"}], "answer": "\\frac{t\\sin at}{2a}"}, {"id": "Q200", "tag": "Topic 6.4 · Convolution · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate via Convolution Theorem:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{s(s + a)}\\right\\}", "hint": "Convolve 1 with e^{−aτ}: ∫₀^t e^{−aτ} dτ.", "steps": [{"text": "Integrate from 0 to t:", "math": "\\int_0^t e^{-a\\tau}\\,d\\tau = \\frac{1 - e^{-at}}{a}"}], "answer": "\\frac{1 - e^{-at}}{a}"}, {"id": "Q205", "tag": "Topic 6.4 · Volterra Pull-In · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the Volterra integral equation:", "promptMath": "y(t) = 1 + e^t\\int_0^t y(\\tau)e^{-\\tau}\\,d\\tau", "hint": "Pull e^t inside to form convolution ∫₀^t y(τ)e^{t−τ} dτ = y * e^t!", "steps": [{"text": "Take L: Y = 1/s + Y/(s−1) ⇒ Y[(s−2)/(s−1)] = 1/s:", "math": "Y(s) = \\frac{s - 1}{s(s - 2)} = \\frac{1/2}{s} + \\frac{1/2}{s - 2} \\implies y(t) = \\frac{1}{2}(1 + e^{2t})"}], "answer": "y(t) = \\frac{1}{2}(1 + e^{2t})"}]}, {"id": "t6_5", "code": "6.5", "title": "ODE IVPs, Step-Forced IVPs, Shifted-Data IVPs & Coupled Systems", "summary": "Subsidiary equation pipeline, discontinuous step forcing, ty″ equations, t₀ ≠ 0 shifted-data IVPs, and 2×2 systems.", "formulas": [{"id": "f6_5_1", "name": "Subsidiary Pipeline, Variable-Coeff & Shifted-Data IVP", "math": "\\mathcal{L}\\{ty'\\} = -sY' - Y,\\qquad \\mathcal{L}\\{ty''\\} = -s^2 Y' - 2sY + y(0)", "note": "If initial data is at t₀ ≠ 0 (e.g. y(2), y′(2)), substitute t = τ + t₀ so data moves to τ = 0, solve, then set τ = t − t₀!", "trick": "Missing y′(0) BVP? Set y′(0) = k, invert in terms of k, then solve for k from the boundary condition!", "trap": false}], "steps": ["Transform the ODE using L{y′} and L{y″} with initial conditions plugged in.", "Solve algebraically for Y(s) (or Y₁, Y₂ in a coupled system).", "Decompose via Cover-Up partial fractions / shifting and invert to y(t)."], "questions": [{"id": "Q212", "tag": "Set 1 · Q.8(a) · 4M", "marks": "4M", "level": "Basic", "prompt": "Solve the IVP using Laplace transforms:", "promptMath": "y'' + 4y' + 3y = e^{-t}, \\qquad y(0) = 1,\\; y'(0) = 1", "hint": "(s+1)(s+3)Y = s + 5 + 1/(s+1).", "steps": [{"text": "Partial fractions:", "math": "Y(s) = \\frac{7/4}{s+1} + \\frac{1/2}{(s+1)^2} - \\frac{3/4}{s+3}"}], "answer": "y(t) = \\frac{7}{4}e^{-t} + \\frac{1}{2}te^{-t} - \\frac{3}{4}e^{-3t}"}, {"id": "Q213", "tag": "Set 1 · Q.8(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the step-forced IVP:", "promptMath": "y'' + y = u(t - \\pi), \\qquad y(0) = 1,\\; y'(0) = 0", "hint": "Y = s/(s²+1) + e^{−πs}[1/s − s/(s²+1)].", "steps": [{"text": "Invert and simplify cos(t − π) = −cos t:", "math": "y(t) = \\cos t + [1 - \\cos(t-\\pi)]u(t-\\pi) = \\cos t + (1 + \\cos t)u(t-\\pi)"}], "answer": "y(t) = \\cos t + (1 + \\cos t)u(t-\\pi)"}, {"id": "Q217", "tag": "Set 3 · Q.8(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the variable-coefficient IVP:", "promptMath": "ty'' + 2y' + ty = 0, \\qquad y(0^+) = 1,\\; y(\\pi) = 0", "hint": "Taking L yields −(s² + 1)Y′(s) = 1 ⇒ −Y′(s) = 1/(s² + 1).", "steps": [{"text": "Invert −Y′(s) = 1/(s²+1) directly to t y(t) = sin t:", "math": "y(t) = \\frac{\\sin t}{t}"}], "answer": "y(t) = \\frac{\\sin t}{t}"}, {"id": "Q221", "tag": "Set 5 · Q.6(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the coupled system with y₁(0) = 0, y₂(0) = 1:", "promptMath": "y_1' = -y_1 + y_2,\\qquad y_2' = y_1 - y_2", "hint": "(s+1)Y₁ − Y₂ = 0 and −Y₁ + (s+1)Y₂ = 1.", "steps": [{"text": "Solve 2×2 algebraic system:", "math": "Y_1 = \\frac{1}{2}\\!\\left(\\frac{1}{s} - \\frac{1}{s+2}\\right),\\qquad Y_2 = \\frac{1}{2}\\!\\left(\\frac{1}{s} + \\frac{1}{s+2}\\right)"}], "answer": "y_1 = \\frac{1}{2}(1 - e^{-2t}),\\quad y_2 = \\frac{1}{2}(1 + e^{-2t})"}, {"id": "Q218", "tag": "Set 4 · Q.8(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the resonant IVP using Laplace transforms:", "promptMath": "y'' + 4y = \\sin 2t, \\qquad y(0) = 0,\\; y'(0) = 0", "hint": "Y(s) = 2/(s² + 4)² — use Convolution Pair 1 with a = 2!", "steps": [{"text": "Invert 2/(s² + 2²)² directly:", "math": "y(t) = 2\\cdot\\frac{\\sin 2t - 2t\\cos 2t}{16} = \\frac{\\sin 2t - 2t\\cos 2t}{8}"}], "answer": "y(t) = \\frac{\\sin 2t - 2t\\cos 2t}{8}"}, {"id": "Q219", "tag": "Topic 6.5 · Shifted-Data IVP · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the shifted-data IVP using Laplace transforms:", "promptMath": "y'' + y = 0, \\qquad y(\\pi) = 1,\\; y'(\\pi) = 0", "hint": "Substitute t = τ + π so initial data moves to τ = 0!", "steps": [{"text": "Let ỹ(τ) = y(τ + π) ⇒ ỹ″ + ỹ = 0, ỹ(0) = 1, ỹ′(0) = 0 ⇒ ỹ(τ) = cos τ."}, {"text": "Replace τ = t − π:", "math": "y(t) = \\cos(t - \\pi) = -\\cos t"}], "answer": "y(t) = -\\cos t"}, {"id": "Q220", "tag": "Topic 6.5 · Missing y'(0) BVP · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the boundary value problem via Laplace transforms:", "promptMath": "y'' + y = 0, \\qquad y(0) = 1,\\; y(\\pi/2) = 2", "hint": "Set y′(0) = k, invert to y(t) = cos t + k sin t, then plug t = π/2!", "steps": [{"text": "Subsidiary eq gives Y = s/(s²+1) + k/(s²+1) ⇒ y(t) = cos t + k sin t."}, {"text": "Apply y(π/2) = 2 ⇒ 0 + k(1) = 2 ⇒ k = 2:"}], "answer": "y(t) = \\cos t + 2\\sin t"}, {"id": "Q222", "tag": "Topic 6.5 · Step RL Circuit · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the switched RL circuit IVP using Laplace transforms:", "promptMath": "2I' + 6I = 12\\,u(t - 1), \\qquad I(0) = 0", "hint": "I′ + 3I = 6u(t−1) ⇒ (s+3)I(s) = 6e^{−s}/s.", "steps": [{"text": "Partial fractions: 6/[s(s+3)] = 2/s − 2/(s+3), then apply 2nd Shifting:", "math": "I(t) = 2\\big(1 - e^{-3(t-1)}\\big)u(t - 1)\\text{ A}"}], "answer": "I(t) = 2\\big(1 - e^{-3(t-1)}\\big)u(t - 1)\\text{ A}"}]}]}], "flashcards": [{"id": "fc001", "co": "ch0", "level": "Basic", "cat": "CH.0 · TRIG RULES", "qText": "Recall the trigonometric power-reduction formulas for sin²θ and cos²θ.", "qMath": "", "aText": "", "aMath": "\\sin^2\\theta = \\frac{1 - \\cos 2\\theta}{2},\\qquad \\cos^2\\theta = \\frac{1 + \\cos 2\\theta}{2}", "tip": "Use before taking Laplace transforms of sin²at or cos²at."}, {"id": "fc002", "co": "ch0", "level": "Basic", "cat": "CH.0 · PRODUCT-TO-SUM", "qText": "State the product-to-sum identity for 2 sin A sin B.", "qMath": "", "aText": "", "aMath": "2\\sin A\\sin B = \\cos(A - B) - \\cos(A + B)", "tip": "Essential for evaluating Convolution integrals of two sines (Q199)!"}, {"id": "fc003", "co": "ch0", "level": "Basic", "cat": "CH.0 · HYPERBOLIC", "qText": "State the hyperbolic definitions and fundamental identity.", "qMath": "", "aText": "", "aMath": "\\sinh x = \\frac{e^x - e^{-x}}{2},\\quad \\cosh x = \\frac{e^x + e^{-x}}{2},\\quad \\cosh^2 x - \\sinh^2 x = 1", "tip": "Both d/dx(sinh ax) = a cosh ax and d/dx(cosh ax) = a sinh ax are positive."}, {"id": "fc004", "co": "ch0", "level": "Basic", "cat": "CH.0 · EXP-TRIG INTEGRAL", "qText": "Recall the standard integral of e^{ax} sin(bx) dx.", "qMath": "", "aText": "", "aMath": "\\int e^{ax}\\sin bx\\,dx = \\frac{e^{ax}}{a^2 + b^2}(a\\sin bx - b\\cos bx) + C", "tip": "For cos bx, swap to (a cos bx + b sin bx)."}, {"id": "fc005", "co": "ch0", "level": "Basic", "cat": "CH.0 · VOP INTEGRALS", "qText": "Recall the integrals of tan(kx) and sec(kx) used in Variation of Parameters.", "qMath": "", "aText": "", "aMath": "\\int \\tan kx\\,dx = -\\frac{1}{k}\\ln|\\cos kx|,\\qquad \\int \\sec kx\\,dx = \\frac{1}{k}\\ln|\\sec kx + \\tan kx|", "tip": "Used in Q113 (sec 3x) and Q115 (tan x)!"}, {"id": "fc006", "co": "ch0", "level": "Intermediate", "cat": "CH.0 · COVER-UP RULE", "qText": "How does the Heaviside Cover-Up Rule split distinct linear or quadratic pairs?", "qMath": "\\frac{P(s)}{(s-a)(s-b)} = \\frac{A}{s-a} + \\frac{B}{s-b}", "aText": "Cover (s−a) and plug s = a into the rest for A = P(a)/(a−b). For quadratic pairs:", "aMath": "\\frac{1}{(s^2+a^2)(s^2+b^2)} = \\frac{1}{b^2 - a^2}\\!\\left(\\frac{1}{s^2+a^2} - \\frac{1}{s^2+b^2}\\right)", "tip": "Saves 3+ minutes per Laplace IVP!"}, {"id": "fc007", "co": "co1", "level": "Basic", "cat": "CO1 · 2D LIMITS", "qText": "How do you prove a 2D limit at (0, 0) does NOT exist?", "qMath": "\\lim_{(x,y)\\to(0,0)} f(x,y)", "aText": "Substitute y = mx (or y = kx²). If the resulting limit depends on m, the 2D limit does not exist.", "aMath": "\\lim_{x\\to 0}\\frac{x^2 - m^2 x^2}{x^2 + m^2 x^2} = \\frac{1-m^2}{1+m^2} \\implies \\text{DNE}", "tip": "Test y = mx whenever numerator and denominator have the same total degree."}, {"id": "fc008", "co": "co1", "level": "Basic", "cat": "CO1 · CONTINUITY", "qText": "When is a two-variable function f(x, y) continuous at (a, b)?", "qMath": "", "aText": "The 2D limit must exist along every path and equal the function value:", "aMath": "\\lim_{(x,y)\\to(a,b)} f(x,y) = f(a,b)", "tip": "Checking only along x- and y-axes is NEVER sufficient to prove continuity."}, {"id": "fc009", "co": "co1", "level": "Basic", "cat": "CO1 · MIXED PARTIALS", "qText": "State Schwarz’s / Clairaut’s Theorem on mixed partial derivatives.", "qMath": "", "aText": "Whenever the mixed second partials are continuous near (a, b):", "aMath": "f_{xy}(a,b) = f_{yx}(a,b)", "tip": "Order of differentiation does not matter for smooth functions."}, {"id": "fc010", "co": "co1", "level": "Intermediate", "cat": "CO1 · IMPLICIT DIFF.", "qText": "Write the implicit differentiation formula for F(x, y) = 0.", "qMath": "", "aText": "", "aMath": "\\frac{dy}{dx} = -\\frac{F_x}{F_y} \\qquad (F_y \\neq 0)", "tip": "Don't forget the minus sign!"}, {"id": "fc011", "co": "co1", "level": "Intermediate", "cat": "CO1 · CHAIN RULE", "qText": "Write the Total Differential dz and Chain Rule du/dt for z = f(x, y).", "qMath": "", "aText": "", "aMath": "dz = \\frac{\\partial f}{\\partial x}\\,dx + \\frac{\\partial f}{\\partial y}\\,dy,\\qquad \\frac{dz}{dt} = \\frac{\\partial f}{\\partial x}\\frac{dx}{dt} + \\frac{\\partial f}{\\partial y}\\frac{dy}{dt}", "tip": "Sketch a quick dependency tree for multi-branch composite functions."}, {"id": "fc012", "co": "co1", "level": "Intermediate", "cat": "CO1 · EULER'S THEOREM", "qText": "State Euler’s Theorem for a homogeneous function f(x, y) of degree n.", "qMath": "f(tx, ty) = t^n f(x, y)", "aText": "", "aMath": "x\\frac{\\partial f}{\\partial x} + y\\frac{\\partial f}{\\partial y} = n\\,f(x,y)", "tip": "Degree n = deg(numerator) − deg(denominator) for rational expressions."}, {"id": "fc013", "co": "co1", "level": "Advanced", "cat": "CO1 · EULER COROLLARY", "qText": "If z = g(u) is homogeneous of degree n, what is x u_x + y u_y?", "qMath": "u = \\sin^{-1}\\!\\left(\\frac{x^2+y^2}{x+y}\\right)", "aText": "Apply Euler’s Corollary directly without differentiating the inverse trig function:", "aMath": "x u_x + y u_y = n\\,\\frac{g(u)}{g'(u)} \\implies 1\\cdot\\frac{\\sin u}{\\cos u} = \\tan u", "tip": "Solves Q3 in 2 lines!"}, {"id": "fc014", "co": "co1", "level": "Advanced", "cat": "CO1 · EULER 2ND-ORDER", "qText": "State the 2nd-order Euler identity for a homogeneous function f(x, y) of degree n.", "qMath": "", "aText": "", "aMath": "x^2 f_{xx} + 2xy f_{xy} + y^2 f_{yy} = n(n - 1)\\,f(x,y)", "tip": "Obtained by differentiating x f_x + y f_y = n f w.r.t. x and y."}, {"id": "fc015", "co": "co1", "level": "Basic", "cat": "CO1 · MACLAURIN", "qText": "Write the Maclaurin series of cosh x and sinh x.", "qMath": "", "aText": "", "aMath": "\\cosh x = 1 + \\frac{x^2}{2!} + \\frac{x^4}{4!} + \\cdots,\\qquad \\sinh x = x + \\frac{x^3}{3!} + \\frac{x^5}{5!} + \\cdots", "tip": "All positive signs! Even powers = cosh, odd powers = sinh."}, {"id": "fc016", "co": "co1", "level": "Basic", "cat": "CO1 · MACLAURIN", "qText": "Write the Maclaurin series of ln(1 + y) for |y| < 1.", "qMath": "", "aText": "", "aMath": "\\ln(1 + y) = y - \\frac{y^2}{2} + \\frac{y^3}{3} - \\frac{y^4}{4} + \\cdots \\quad (|y| < 1)", "tip": "NO factorials in the denominators—just 1, 2, 3, 4!"}, {"id": "fc017", "co": "co1", "level": "Intermediate", "cat": "CO1 · 2D TAYLOR", "qText": "Write the 2nd-degree terms of the 2D Taylor series about (a, b) with h = x−a, k = y−b.", "qMath": "", "aText": "", "aMath": "\\frac{1}{2!}\\left(h^2 f_{xx} + 2hk f_{xy} + k^2 f_{yy}\\right)", "tip": "For separable g(x)h(y) like e^x ln(1+y), multiply 1D series directly!"}, {"id": "fc018", "co": "co1", "level": "Basic", "cat": "CO1 · EXTREMA TEST", "qText": "State the Δ = rt − s² outcomes at a stationary point (f_x = f_y = 0).", "qMath": "", "aText": "Δ > 0, r > 0: Local Min  |  Δ > 0, r < 0: Local Max  |  Δ < 0: Saddle  |  Δ = 0: Inconclusive.", "aMath": "r = f_{xx},\\quad s = f_{xy},\\quad t = f_{yy},\\quad \\Delta = rt - s^2", "tip": "Δ < 0 is ALWAYS a Saddle Point regardless of the sign of r."}, {"id": "fc019", "co": "co1", "level": "Intermediate", "cat": "CO1 · LAGRANGE", "qText": "How do you set up Lagrange Multipliers to optimize f(x, y, z) subject to φ(x, y, z) = 0?", "qMath": "", "aText": "Form the auxiliary function F and solve the 4 equations simultaneously:", "aMath": "F(x,y,z,\\lambda) = f + \\lambda\\phi \\implies F_x = 0,\\; F_y = 0,\\; F_z = 0,\\; \\phi = 0", "tip": "Eliminate λ by equating ratios before plugging back into φ = 0."}, {"id": "fc020", "co": "co1", "level": "Advanced", "cat": "CO1 · SHORTEST DIST.", "qText": "What is the shortest distance from the origin (0, 0, 0) to the plane ax + by + cz = d?", "qMath": "", "aText": "", "aMath": "d_{\\min} = \\frac{|d|}{\\sqrt{a^2 + b^2 + c^2}}", "tip": "Q10: x + 2y + 2z = 9 ⇒ 9 / √9 = 3."}, {"id": "fc021", "co": "co2", "level": "Basic", "cat": "CO2 · ORDER & DEGREE", "qText": "Define the order and degree of an ordinary differential equation.", "qMath": "", "aText": "Order = highest derivative present; Degree = exponent of that highest derivative after clearing fractions and radicals.", "aMath": "(y'')^3 + (y')^5 = 0 \\implies \\text{Order } 2,\\; \\text{Degree } 3", "tip": "If y′ appears inside sin(y′) or e^{y′}, the degree is undefined."}, {"id": "fc022", "co": "co2", "level": "Basic", "cat": "CO2 · FORMATION", "qText": "How do you eliminate n arbitrary constants to form an ODE?", "qMath": "y = cx + c^2", "aText": "Differentiate n times and eliminate the n constants algebraically:", "aMath": "y' = c \\implies y = x y' + (y')^2 \\quad (\\text{Clairaut's ODE})", "tip": "1 constant ⇒ 1st-order ODE; 2 constants ⇒ 2nd-order ODE."}, {"id": "fc023", "co": "co2", "level": "Basic", "cat": "CO2 · SEPARABLE", "qText": "How do you solve a separable 1st-order ODE g(y) y′ = f(x)?", "qMath": "", "aText": "Separate all y-terms to dy and x-terms to dx, then integrate both sides:", "aMath": "\\int g(y)\\,dy = \\int f(x)\\,dx + C", "tip": "Watch for e^{ax+by} = e^{ax}·e^{by}—always separable!"}, {"id": "fc024", "co": "co2", "level": "Basic", "cat": "CO2 · HOMOGENEOUS", "qText": "What substitution reduces homogeneous y′ = f(y/x) to separable form?", "qMath": "", "aText": "Substitute y = ux (so y′ = u + xu′):", "aMath": "\\frac{du}{f(u) - u} = \\frac{dx}{x}", "tip": "Equivalently use x = vy if x/y is cleaner (Q19)."}, {"id": "fc025", "co": "co2", "level": "Intermediate", "cat": "CO2 · REDUCIBLE", "qText": "How do you reduce a linear fractional ODE when a₁b₂ ≠ a₂b₁?", "qMath": "\\frac{dy}{dx} = \\frac{a_1 x + b_1 y + c_1}{a_2 x + b_2 y + c_2}", "aText": "Find the intersection (h, k) of both lines and shift the axes:", "aMath": "x = X + h,\\quad y = Y + k \\implies \\frac{dY}{dX} = \\frac{a_1 X + b_1 Y}{a_2 X + b_2 Y}", "tip": "Constants c₁, c₂ vanish, making the ODE homogeneous in (X, Y)."}, {"id": "fc026", "co": "co2", "level": "Intermediate", "cat": "CO2 · PARALLEL CASE", "qText": "What if a₁/a₂ = b₁/b₂ (parallel lines) in a linear fractional ODE?", "qMath": "", "aText": "No intersection exists—substitute the repeated linear combination directly:", "aMath": "z = a_1 x + b_1 y \\implies \\text{immediately separable in } z \\text{ and } x", "tip": "Always check a₁b₂ − a₂b₁ = 0 first!"}, {"id": "fc027", "co": "co2", "level": "Basic", "cat": "CO2 · EXACT TEST", "qText": "State the exactness condition for M(x, y) dx + N(x, y) dy = 0.", "qMath": "", "aText": "", "aMath": "\\frac{\\partial M}{\\partial y} = \\frac{\\partial N}{\\partial x}", "tip": "Check this first whenever an ODE is given in differential form."}, {"id": "fc028", "co": "co2", "level": "Basic", "cat": "CO2 · EXACT SOLUTION", "qText": "Write the 1-line general solution formula for an exact ODE.", "qMath": "", "aText": "", "aMath": "\\int_{y=\\text{const}} M\\,dx + \\int (\\text{terms of } N \\text{ free of } x)\\,dy = C", "tip": "Drop every term in N that contains x to avoid double-counting!"}, {"id": "fc029", "co": "co2", "level": "Intermediate", "cat": "CO2 · I.F. RULE 1", "qText": "What is the Integrating Factor when (M_y − N_x)/N = f(x) depends only on x?", "qMath": "", "aText": "", "aMath": "\\text{I.F.} = \\exp\\!\\left(\\int f(x)\\,dx\\right)", "tip": "Kreyszig Sec. 1.4 Theorem 1."}, {"id": "fc030", "co": "co2", "level": "Intermediate", "cat": "CO2 · I.F. RULE 2", "qText": "What is the Integrating Factor when (N_x − M_y)/M = g(y) depends only on y?", "qMath": "", "aText": "", "aMath": "\\text{I.F.} = \\exp\\!\\left(\\int g(y)\\,dy\\right)", "tip": "Watch the numerator sign flip: N_x − M_y over M!"}, {"id": "fc031", "co": "co2", "level": "Advanced", "cat": "CO2 · I.F. RULE 3", "qText": "If M dx + N dy = 0 is homogeneous and Mx + Ny ≠ 0, what is its I.F.?", "qMath": "", "aText": "", "aMath": "\\text{I.F.} = \\frac{1}{Mx + Ny}", "tip": "Rule 4 (Exponential Inspection): if e^{x+y} appears, try I.F. = e^{−x} or e^{−y} first!"}, {"id": "fc032", "co": "co2", "level": "Basic", "cat": "CO2 · LINEAR ODE", "qText": "Write the Integrating Factor and solution of y′ + P(x)y = Q(x).", "qMath": "", "aText": "", "aMath": "\\text{I.F.} = e^{\\int P(x)\\,dx},\\qquad y\\cdot(\\text{I.F.}) = \\int Q(x)\\cdot(\\text{I.F.})\\,dx + C", "tip": "Always divide by the coefficient of y′ first!"}, {"id": "fc033", "co": "co2", "level": "Basic", "cat": "CO2 · LINEAR QUICK", "qText": "Find the Integrating Factor of y′ + (2/x)y = x ln x.", "qMath": "", "aText": "", "aMath": "\\text{I.F.} = e^{\\int (2/x)\\,dx} = e^{2\\ln x} = x^2", "tip": "Q30 (1-mark favorite)."}, {"id": "fc034", "co": "co2", "level": "Intermediate", "cat": "CO2 · LINEAR IN x", "qText": "When should you flip a 1st-order ODE to dx/dy + P(y)x = Q(y)?", "qMath": "", "aText": "Whenever the ODE is nonlinear in y (has y², e^y, sin y) but linear in x and dx/dy.", "aMath": "\\frac{dx}{dy} + P(y)x = Q(y) \\implies \\text{I.F.} = e^{\\int P(y)\\,dy}", "tip": "Often turns a messy equation into a 3-line linear ODE!"}, {"id": "fc035", "co": "co2", "level": "Intermediate", "cat": "CO2 · BERNOULLI", "qText": "How do you linearize Bernoulli’s ODE y′ + P(x)y = Q(x)y^n?", "qMath": "", "aText": "Divide by y^n and substitute u = y^{1−n}:", "aMath": "u' + (1 - n)P(x)u = (1 - n)Q(x)", "tip": "Don’t forget (1 − n) on BOTH P(x) and Q(x)!"}, {"id": "fc036", "co": "co2", "level": "Advanced", "cat": "CO2 · BERNOULLI EX.", "qText": "Linearize and solve y′ + xy = x y⁻¹ (Q33).", "qMath": "", "aText": "Here n = −1 ⇒ u = y² ⇒ u′ + 2xu = 2x (I.F. = e^{x²}):", "aMath": "y^2 = 1 + C e^{-x^2}", "tip": "Multiply by 2y directly to spot (y²)′ = 2yy′."}, {"id": "fc037", "co": "co3", "level": "Basic", "cat": "CO3 · MIXING TANK", "qText": "Write the universal mass-balance ODE for any mixing tank.", "qMath": "", "aText": "", "aMath": "\\frac{dy}{dt} = c_{\\text{in}}r_{\\text{in}} - \\frac{r_{\\text{out}}}{V_0 + (r_{\\text{in}} - r_{\\text{out}})t}\\,y(t)", "tip": "y(t) is the mass of salt (lb or kg), NOT concentration."}, {"id": "fc038", "co": "co3", "level": "Basic", "cat": "CO3 · FRESH INFLOW", "qText": "If pure water (c_in = 0) enters at rate r = r_out into volume V₀, what is y(t)?", "qMath": "", "aText": "", "aMath": "y(t) = y_0\\,e^{-(r/V_0)t}", "tip": "Immediately separable exponential washout!"}, {"id": "fc039", "co": "co3", "level": "Intermediate", "cat": "CO3 · OVERFLOW TIME", "qText": "Find V(t) and overflow time when r_in > r_out in a tank of capacity V_max.", "qMath": "", "aText": "", "aMath": "V(t) = V_0 + (r_{\\text{in}} - r_{\\text{out}})t,\\qquad t_{\\text{overflow}} = \\frac{V_{\\max} - V_0}{r_{\\text{in}} - r_{\\text{out}}}", "tip": "Q42: 300 + 2t = 500 ⇒ t = 100 min."}, {"id": "fc040", "co": "co3", "level": "Advanced", "cat": "CO3 · 2-TANK CASCADE", "qText": "In a 2-tank cascade (T₁ → T₂), what is the inflow rate of salt into Tank T₂?", "qMath": "", "aText": "Tank T₂ receives the exact outflow of Tank T₁:", "aMath": "\\text{Rate In}_{T_2} = \\frac{r}{V_1}\\,y_1(t)", "tip": "Solve Tank 1 first, then plug y₁(t) into Tank 2’s linear ODE."}, {"id": "fc041", "co": "co3", "level": "Basic", "cat": "CO3 · COOLING ODE", "qText": "State Newton’s Law of Cooling / Heating ODE and its closed-form solution.", "qMath": "", "aText": "", "aMath": "\\frac{dT}{dt} = k(T - T_s) \\implies T(t) = T_s + (T_0 - T_s)e^{kt} \\quad (k < 0)", "tip": "k < 0 for BOTH cooling and heating toward ambient T_s!"}, {"id": "fc042", "co": "co3", "level": "Intermediate", "cat": "CO3 · RATIO SHORTCUT", "qText": "What is the exact zero-rounding Ratio Shortcut for Newton’s Law of Cooling?", "qMath": "", "aText": "Given T(0) = T₀ and T(t₁) = T₁ in ambient T_s:", "aMath": "T(t) = T_s + (T_0 - T_s)\\left(\\frac{T_1 - T_s}{T_0 - T_s}\\right)^{t/t_1}", "tip": "Gives T(2t₁), T(3t₁) instantly without computing ln(α)!"}, {"id": "fc043", "co": "co3", "level": "Basic", "cat": "CO3 · HALF-LIFE", "qText": "Relate decay constant k to half-life t_{1/2} in N(t) = N₀ e^{−kt}.", "qMath": "", "aText": "", "aMath": "t_{1/2} = \\frac{\\ln 2}{k} \\iff k = \\frac{\\ln 2}{t_{1/2}}", "tip": "Doubling time for growth has the exact same formula: t₂ = ln 2 / k."}, {"id": "fc044", "co": "co3", "level": "Intermediate", "cat": "CO3 · CARBON-14", "qText": "Write the direct radiocarbon age formula for remaining fraction f = N/N₀.", "qMath": "", "aText": "", "aMath": "t = H\\,\\frac{\\ln(1/f)}{\\ln 2} \\qquad (H = 5730\\text{ yr for } ^{14}\\text{C})", "tip": "Q57: f = 0.2 ⇒ t = 5730 ln(5)/ln(2) ≈ 13,305 yr."}, {"id": "fc045", "co": "co3", "level": "Basic", "cat": "CO3 · 1ST-ORDER RL", "qText": "Write the KVL ODE and DC step response for an RL circuit with I(0) = 0.", "qMath": "", "aText": "", "aMath": "L\\frac{dI}{dt} + RI = E_0 \\implies I(t) = \\frac{E_0}{R}\\!\\left(1 - e^{-(R/L)t}\\right)", "tip": "Time constant τ = L/R; limiting current I_∞ = E₀/R."}, {"id": "fc046", "co": "co3", "level": "Basic", "cat": "CO3 · 1ST-ORDER RC", "qText": "Write the discharge ODE and solution for an RC circuit with E = 0, Q(0) = Q₀.", "qMath": "", "aText": "", "aMath": "R\\frac{dQ}{dt} + \\frac{Q}{C} = 0 \\implies Q(t) = Q_0 e^{-t/(RC)}", "tip": "Time constant τ = RC."}, {"id": "fc047", "co": "co3", "level": "Intermediate", "cat": "CO3 · 90% & 99% TIME", "qText": "How long does an RL circuit take to reach 90% steady state (and RC for 99% discharge)?", "qMath": "", "aText": "", "aMath": "t_{90\\%} = \\tau\\ln 10 \\approx 2.303\\,\\tau,\\qquad t_{99\\%} = \\tau\\ln 100 \\approx 4.605\\,\\tau", "tip": "Works for any exponential relaxation with time constant τ!"}, {"id": "fc048", "co": "co3", "level": "Advanced", "cat": "CO3 · LOGISTIC ODE", "qText": "How is the Logistic Growth ODE y′ = Ay − By² solved?", "qMath": "", "aText": "It is a Bernoulli ODE with n = 2 — linearize with u = y⁻¹:", "aMath": "u' + Au = B \\implies y(t) = \\frac{A/B}{1 + C e^{-At}}", "tip": "Carrying capacity as t → ∞ is A/B."}, {"id": "fc049", "co": "co4", "level": "Basic", "cat": "CO4 · SUPERPOSITION", "qText": "State the Superposition Principle for homogeneous linear ODEs.", "qMath": "", "aText": "If y₁ and y₂ solve y″ + p(x)y′ + q(x)y = 0, then any linear combination also solves it:", "aMath": "y(x) = c_1 y_1(x) + c_2 y_2(x)", "tip": "Does NOT apply to nonhomogeneous or nonlinear ODEs!"}, {"id": "fc050", "co": "co4", "level": "Basic", "cat": "CO4 · CASE I ROOTS", "qText": "General solution of y″ + ay′ + by = 0 for distinct real roots λ₁ ≠ λ₂?", "qMath": "", "aText": "", "aMath": "y_h(x) = c_1 e^{\\lambda_1 x} + c_2 e^{\\lambda_2 x}", "tip": "Occurs when discriminant a² − 4b > 0 (overdamped)."}, {"id": "fc051", "co": "co4", "level": "Basic", "cat": "CO4 · CASE II ROOTS", "qText": "General solution when λ₁ = λ₂ = λ is a real double root?", "qMath": "", "aText": "", "aMath": "y_h(x) = (c_1 + c_2 x)e^{\\lambda x}", "tip": "Occurs when a² − 4b = 0 (critically damped)."}, {"id": "fc052", "co": "co4", "level": "Basic", "cat": "CO4 · CASE III ROOTS", "qText": "General solution when roots are complex conjugates α ± iβ?", "qMath": "", "aText": "", "aMath": "y_h(x) = e^{\\alpha x}(A\\cos\\beta x + B\\sin\\beta x)", "tip": "Occurs when a² − 4b < 0 (underdamped oscillations)."}, {"id": "fc053", "co": "co4", "level": "Basic", "cat": "CO4 · WRONSKIAN", "qText": "Define the Wronskian W(y₁, y₂) and its linear independence criterion.", "qMath": "", "aText": "", "aMath": "W(y_1, y_2) = y_1 y_2' - y_2 y_1' \\neq 0 \\iff \\{y_1, y_2\\} \\text{ linearly independent}", "tip": "Two functions are dependent iff one is a constant multiple of the other."}, {"id": "fc054", "co": "co4", "level": "Intermediate", "cat": "CO4 · ABEL'S IDENTITY", "qText": "State Abel’s Formula for the Wronskian of y″ + p(x)y′ + q(x)y = 0.", "qMath": "", "aText": "", "aMath": "W(x) = W(x_0)\\,\\exp\\!\\left(-\\int_{x_0}^x p(t)\\,dt\\right)", "tip": "If p(x) = 0 (like y″ + ω²y = 0), W(x) is strictly constant!"}, {"id": "fc055", "co": "co4", "level": "Intermediate", "cat": "CO4 · BASIS TO ODE", "qText": "Reconstruct the 2nd-order ODE with basis {e^{−2x} cos 3x, e^{−2x} sin 3x}.", "qMath": "", "aText": "Complex roots λ = −2 ± 3i ⇒ (λ + 2)² + 3² = 0:", "aMath": "\\lambda^2 + 4\\lambda + 13 = 0 \\implies y'' + 4y' + 13y = 0", "tip": "Always expand (λ − α)² + β² = 0!"}, {"id": "fc056", "co": "co4", "level": "Basic", "cat": "CO4 · EULER-CAUCHY", "qText": "Write the auxiliary equation of Euler–Cauchy ODE x²y″ + axy′ + by = 0.", "qMath": "", "aText": "Substitute y = x^m ⇒ m(m − 1) + am + b = 0:", "aMath": "m^2 + (a - 1)m + b = 0", "tip": "Watch the (a − 1) coefficient!"}, {"id": "fc057", "co": "co4", "level": "Intermediate", "cat": "CO4 · EC CASE II", "qText": "General solution of Euler–Cauchy for a repeated root m₁ = m₂ = m (x > 0)?", "qMath": "", "aText": "", "aMath": "y(x) = (c_1 + c_2\\ln x)\\,x^m", "tip": "The extra factor x in constant-coeff becomes ln x in Euler–Cauchy!"}, {"id": "fc058", "co": "co4", "level": "Intermediate", "cat": "CO4 · EC CASE III", "qText": "General solution of Euler–Cauchy for complex roots m = α ± iβ?", "qMath": "", "aText": "", "aMath": "y(x) = x^\\alpha\\big[A\\cos(\\beta\\ln x) + B\\sin(\\beta\\ln x)\\big]", "tip": "Q86: x²y″ + xy′ + 9y = 0 ⇒ c₁ cos(3 ln x) + c₂ sin(3 ln x)."}, {"id": "fc059", "co": "co4", "level": "Intermediate", "cat": "CO4 · REDUCTION", "qText": "Write the Reduction of Order formula for y₂(x) given y₁(x).", "qMath": "", "aText": "First normalize to y″ + p(x)y′ + q(x)y = 0 (coeff of y″ = 1!):", "aMath": "y_2(x) = y_1(x)\\int \\frac{e^{-\\int p(x)\\,dx}}{[y_1(x)]^2}\\,dx", "tip": "Drop arbitrary constants in both integrals."}, {"id": "fc060", "co": "co4", "level": "Basic", "cat": "CO4 · NONHOMOG.", "qText": "What is the structure of the general solution of a nonhomogeneous linear ODE?", "qMath": "", "aText": "", "aMath": "y(x) = y_h(x) + y_p(x)", "tip": "y_h has 2 arbitrary constants; y_p has ZERO arbitrary constants."}, {"id": "fc061", "co": "co4", "level": "Basic", "cat": "CO4 · UC TRIG TRIAL", "qText": "Trial y_p for r(x) = k cos ωx or k sin ωx (non-resonant case)?", "qMath": "", "aText": "", "aMath": "y_p(x) = K\\cos\\omega x + M\\sin\\omega x", "tip": "Include BOTH cos and sin even if only one appears in r(x)!"}, {"id": "fc062", "co": "co4", "level": "Intermediate", "cat": "CO4 · MODIFICATION", "qText": "State the Modification Rule of Undetermined Coefficients.", "qMath": "", "aText": "If a trial y_p duplicates a term in y_h, multiply it by x (simple root match) or x² (double root match).", "aMath": "y'' - 4y' + 4y = (3+x)e^{2x} \\implies y_p = x^2(A_0 + A_1 x)e^{2x}", "tip": "Always solve for y_h BEFORE writing y_p!"}, {"id": "fc063", "co": "co4", "level": "Advanced", "cat": "CO4 · EXP SHIFT", "qText": "State the Exponential Shift Rule for inverse differential operators.", "qMath": "", "aText": "", "aMath": "\\frac{1}{P(D)}\\big(e^{ax} V(x)\\big) = e^{ax}\\,\\frac{1}{P(D + a)}V(x)", "tip": "Pull e^{ax} left and replace every D by D + a."}, {"id": "fc064", "co": "co4", "level": "Intermediate", "cat": "CO4 · VAR. PARAMS", "qText": "State the Variation of Parameters formula for y_p(x).", "qMath": "", "aText": "In standard form y″ + p(x)y′ + q(x)y = r(x):", "aMath": "y_p(x) = -y_1\\int\\frac{y_2 r}{W}\\,dx + y_2\\int\\frac{y_1 r}{W}\\,dx", "tip": "EXAM TRAP: Divide Euler–Cauchy RHS by x² before plugging into r(x)!"}, {"id": "fc065", "co": "co4", "level": "Basic", "cat": "CO4 · RLC GOVERNING", "qText": "Write the Charge Q(t) and Current I(t) ODEs for a series RLC circuit.", "qMath": "", "aText": "", "aMath": "LQ'' + RQ' + \\frac{1}{C}Q = E(t),\\qquad LI'' + RI' + \\frac{1}{C}I = E'(t)", "tip": "Initial I′(0) comes from KVL: L I′(0) + R I(0) + Q(0)/C = E(0)."}, {"id": "fc066", "co": "co4", "level": "Basic", "cat": "CO4 · RLC DAMPING", "qText": "Classify RLC damping regimes using Δ = R² − 4L/C.", "qMath": "", "aText": "Δ > 0: Overdamped  |  Δ = 0: Critically Damped  |  Δ < 0: Underdamped (oscillatory).", "aMath": "\\lambda = \\frac{-R \\pm \\sqrt{R^2 - 4L/C}}{2L}", "tip": "For any R > 0, transient I_h(t) → 0 as t → ∞."}, {"id": "fc067", "co": "co4", "level": "Intermediate", "cat": "CO4 · IMPEDANCE", "qText": "Define Reactance S, Impedance Z, and resonance frequency ω₀ for an AC RLC circuit.", "qMath": "", "aText": "", "aMath": "S = \\omega L - \\frac{1}{\\omega C},\\qquad Z = \\sqrt{R^2 + S^2},\\qquad \\omega_0 = \\frac{1}{\\sqrt{LC}}", "tip": "At resonance S = 0, Z = R is minimum and steady-state amplitude E₀/R is maximum!"}, {"id": "fc068", "co": "co4", "level": "Advanced", "cat": "CO4 · ANALOGY", "qText": "Map Mechanical (m, c, k, y, y′, F) to Electrical RLC quantities (Kreyszig Table 2.2).", "qMath": "", "aText": "", "aMath": "m\\leftrightarrow L,\\quad c\\leftrightarrow R,\\quad k\\leftrightarrow \\frac{1}{C},\\quad y\\leftrightarrow Q,\\quad y'\\leftrightarrow I,\\quad F\\leftrightarrow E", "tip": "Charge Q mirrors displacement; Current I mirrors velocity."}, {"id": "fc069", "co": "co5", "level": "Basic", "cat": "CO5 · POWER SERIES", "qText": "Write the general form of a power series centered at x₀ and its convergence region.", "qMath": "", "aText": "Converges absolutely for |x − x₀| < R and diverges for |x − x₀| > R:", "aMath": "\\sum_{m=0}^{\\infty} a_m (x - x_0)^m", "tip": "Always converges at x = x₀ (with sum a₀)."}, {"id": "fc070", "co": "co5", "level": "Basic", "cat": "CO5 · RATIO & ROOT", "qText": "Write the Ratio Test and Cauchy–Hadamard Root Test formulas for Radius R.", "qMath": "", "aText": "", "aMath": "R = \\lim_{m\\to\\infty}\\left|\\frac{a_m}{a_{m+1}}\\right| = \\frac{1}{\\lim_{m\\to\\infty}\\sqrt[m]{|a_m|}}", "tip": "Notice a_m is on TOP and a_{m+1} on BOTTOM for R!"}, {"id": "fc071", "co": "co5", "level": "Intermediate", "cat": "CO5 · EVEN-POWER TRAP", "qText": "How do you find R for an even-power series ∑ a_m (x − x₀)^{2m}?", "qMath": "", "aText": "Apply the Ratio Test to the full term and solve for |x − x₀| < R:", "aMath": "\\lim_{m\\to\\infty}\\left|\\frac{a_{m+1}}{a_m}\\right||x - x_0|^2 < 1 \\implies |x - x_0| < \\sqrt{\\lim|a_m/a_{m+1}|}", "tip": "Q131: |x−2|²/3 < 1 ⇒ R = √3 (NOT 3!)."}, {"id": "fc072", "co": "co5", "level": "Basic", "cat": "CO5 · ORDINARY POINT", "qText": "Define an ordinary point x₀ of y″ + p(x)y′ + q(x)y = 0.", "qMath": "", "aText": "Both p(x) and q(x) are analytic (have convergent Taylor series) at x₀.", "aMath": "P(x)y'' + Q(x)y' + S(x)y = 0 \\implies P(x_0) \\neq 0", "tip": "Points where P(x) = 0 are singular points."}, {"id": "fc073", "co": "co5", "level": "Intermediate", "cat": "CO5 · COMPLEX POLES", "qText": "How do you find the guaranteed minimum R of an ODE series solution about x₀?", "qMath": "(x^2 + 4)y'' + xy' - y = 0 \\quad (x_0 = 0)", "aText": "Distance in the complex plane ℂ from x₀ to the nearest root of P(x) = 0:", "aMath": "x^2 + 4 = 0 \\implies x = \\pm 2i \\implies R_{\\min} = |0 - 2i| = 2", "tip": "Never ignore complex conjugate roots!"}, {"id": "fc074", "co": "co5", "level": "Advanced", "cat": "CO5 · CLASSIC R VALUES", "qText": "Recall the Radius of Convergence R for Q133 and Q138.", "qMath": "\\sum \\frac{(2n)!}{(n!)^2}x^n \\qquad \\text{and} \\qquad \\sum \\frac{n!}{n^n}x^n", "aText": "", "aMath": "R = \\frac{1}{4} \\;\\; (\\text{Q133}),\\qquad R = e \\;\\; (\\text{Q138})", "tip": "Two of the highest-frequency 1-mark CO5 questions!"}, {"id": "fc075", "co": "co5", "level": "Basic", "cat": "CO5 · SERIES ANSATZ", "qText": "Write y, y′, and y″ for the power series method about x₀ = 0.", "qMath": "", "aText": "", "aMath": "y = \\sum_{n=0}^{\\infty} c_n x^n,\\quad y' = \\sum_{n=1}^{\\infty} n c_n x^{n-1},\\quad y'' = \\sum_{n=2}^{\\infty} n(n-1)c_n x^{n-2}", "tip": "Shift indices so every sum displays x^k before combining."}, {"id": "fc076", "co": "co5", "level": "Intermediate", "cat": "CO5 · LEGENDRE ODE", "qText": "Write Legendre’s equation of order n and its recurrence relation.", "qMath": "", "aText": "", "aMath": "(1-x^2)y'' - 2xy' + n(n+1)y = 0,\\qquad c_{k+2} = -\\frac{(n-k)(n+k+1)}{(k+2)(k+1)}c_k", "tip": "Terminates at k = n to produce the polynomial P_n(x)."}, {"id": "fc077", "co": "co5", "level": "Intermediate", "cat": "CO5 · LEGENDRE P0–P3", "qText": "Recall the first four Legendre polynomials P₀, P₁, P₂, P₃.", "qMath": "", "aText": "", "aMath": "P_0 = 1,\\quad P_1 = x,\\quad P_2 = \\frac{1}{2}(3x^2 - 1),\\quad P_3 = \\frac{1}{2}(5x^3 - 3x)", "tip": "Sanity check: P_n(1) = 1 for EVERY n!"}, {"id": "fc078", "co": "co5", "level": "Advanced", "cat": "CO5 · RODRIGUES", "qText": "State Rodrigues’ formula for Legendre polynomials P_n(x).", "qMath": "", "aText": "", "aMath": "P_n(x) = \\frac{1}{2^n n!}\\frac{d^n}{dx^n}\\big[(x^2 - 1)^n\\big]", "tip": "Fast way to double-check P₂, P₃, or P₄!"}, {"id": "fc079", "co": "co5", "level": "Intermediate", "cat": "CO5 · AIRY'S ODE", "qText": "Write Airy’s equation and its recurrence relation about x₀ = 0.", "qMath": "", "aText": "", "aMath": "y'' - xy = 0 \\implies c_2 = 0,\\quad c_{k+2} = \\frac{c_{k-1}}{(k+1)(k+2)} \\;\\; (k \\ge 1)", "tip": "Jumps by 3: c₂ = c₅ = c₈ = ⋯ = 0!"}, {"id": "fc080", "co": "co5", "level": "Advanced", "cat": "CO5 · IDENTITY THM", "qText": "What theorem lets you set every coefficient of x^k to zero in ∑ b_k x^k = 0?", "qMath": "", "aText": "Identity Theorem for Power Series: if ∑ b_k x^k = 0 on an open interval (−r, r), then:", "aMath": "b_k = 0 \\quad \\text{for all } k = 0, 1, 2, \\dots", "tip": "This generates the recurrence relation for c_{k+2}."}, {"id": "fc081", "co": "co6", "level": "Basic", "cat": "CO6 · DEFINITION", "qText": "Define the Laplace transform L{f(t)} and its existence conditions.", "qMath": "", "aText": "Exists for s > k when f(t) is piecewise continuous and of exponential order |f(t)| ≤ M e^{kt}:", "aMath": "\\mathcal{L}\\{f(t)\\} = F(s) = \\int_0^\\infty e^{-st}f(t)\\,dt", "tip": "Linear operator: L{af + bg} = aF(s) + bG(s)."}, {"id": "fc082", "co": "co6", "level": "Basic", "cat": "CO6 · BASE PAIRS 1–3", "qText": "Recall the Laplace transforms of 1, t^n, and e^{at}.", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{1\\} = \\frac{1}{s},\\qquad \\mathcal{L}\\{t^n\\} = \\frac{n!}{s^{n+1}},\\qquad \\mathcal{L}\\{e^{at}\\} = \\frac{1}{s - a}", "tip": "For non-integer p > −1: Γ(p+1)/s^{p+1}."}, {"id": "fc083", "co": "co6", "level": "Basic", "cat": "CO6 · BASE PAIRS 4–5", "qText": "Recall the Laplace transforms of sin(at) and cos(at).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{\\sin at\\} = \\frac{a}{s^2 + a^2},\\qquad \\mathcal{L}\\{\\cos at\\} = \\frac{s}{s^2 + a^2}", "tip": "PLUS in denominator; cos has s on top, sin has a on top."}, {"id": "fc084", "co": "co6", "level": "Basic", "cat": "CO6 · BASE PAIRS 6–7", "qText": "Recall the Laplace transforms of sinh(at) and cosh(at).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{\\sinh at\\} = \\frac{a}{s^2 - a^2},\\qquad \\mathcal{L}\\{\\cosh at\\} = \\frac{s}{s^2 - a^2}", "tip": "MINUS in denominator (s > |a|)."}, {"id": "fc085", "co": "co6", "level": "Basic", "cat": "CO6 · GAMMA LAPLACE", "qText": "What is Γ(1/2) and L{t^{−1/2}}?", "qMath": "", "aText": "", "aMath": "\\Gamma\\!\\left(\\frac{1}{2}\\right) = \\sqrt{\\pi} \\implies \\mathcal{L}\\{t^{-1/2}\\} = \\sqrt{\\frac{\\pi}{s}}", "tip": "Q153: ∫₀^∞ x^{−1/2}e^{−2x} dx = √(π/2)."}, {"id": "fc086", "co": "co6", "level": "Basic", "cat": "CO6 · 1ST SHIFTING", "qText": "State the First Shifting Theorem (s-Shifting) and how to invert (As+B)/(s²+bs+c).", "qMath": "", "aText": "Complete denominator to (s−a)² ± ω², rewrite numerator in (s−a), then pull out e^{at}:", "aMath": "\\mathcal{L}\\{e^{at}f(t)\\} = F(s - a) \\iff \\mathcal{L}^{-1}\\{F(s - a)\\} = e^{at}f(t)", "tip": "Never pull out e^{at} before matching (s−a) in the numerator!"}, {"id": "fc087", "co": "co6", "level": "Intermediate", "cat": "CO6 · IMPROPER INT.", "qText": "How do you evaluate ∫₀^∞ e^{−at} f(t) dt using Laplace transforms?", "qMath": "", "aText": "Simply compute F(s) = L{f(t)} and substitute s = a:", "aMath": "\\int_0^\\infty e^{-at}f(t)\\,dt = F(a)", "tip": "Turns tough improper integrals into 2-line evaluations (Q159)!"}, {"id": "fc088", "co": "co6", "level": "Basic", "cat": "CO6 · DERIVATIVES", "qText": "State the Laplace transforms of y′(t) and y″(t).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{y'\\} = sY - y(0),\\qquad \\mathcal{L}\\{y''\\} = s^2 Y - sy(0) - y'(0)", "tip": "Powers of s descend while derivative orders of y(0) ascend."}, {"id": "fc089", "co": "co6", "level": "Basic", "cat": "CO6 · DIVISION BY s", "qText": "How do you invert F(s)/s or F(s)/s² without partial fractions?", "qMath": "", "aText": "Invert F(s) → f(t), then integrate from 0 to t (once for 1/s, twice for 1/s²):", "aMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{F(s)}{s}\\right\\} = \\int_0^t f(\\tau)\\,d\\tau", "tip": "Super fast for 1/[s(s²+ω²)]!"}, {"id": "fc090", "co": "co6", "level": "Intermediate", "cat": "CO6 · MULT. BY t^n", "qText": "State the forward rule for L{t^n f(t)} and the inverse trick for ln(·) / cot⁻¹(·).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{t^n f(t)\\} = (-1)^n F^{(n)}(s),\\qquad f(t) = -\\frac{1}{t}\\mathcal{L}^{-1}\\{F'(s)\\}", "tip": "Whenever you see ln, tan⁻¹, or cot⁻¹ in inverse Laplace, differentiate F(s) first!"}, {"id": "fc091", "co": "co6", "level": "Intermediate", "cat": "CO6 · t sin / t cos", "qText": "Recall the transforms of t sin(ωt) and t cos(ωt).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{t\\sin\\omega t\\} = \\frac{2\\omega s}{(s^2+\\omega^2)^2},\\qquad \\mathcal{L}\\{t\\cos\\omega t\\} = \\frac{s^2 - \\omega^2}{(s^2+\\omega^2)^2}", "tip": "Memorize both—they appear constantly in 1M & 4M problems!"}, {"id": "fc092", "co": "co6", "level": "Intermediate", "cat": "CO6 · DIVISION BY t", "qText": "State the formula for L{f(t)/t} and its classic exam trap.", "qMath": "", "aText": "Integrate F(u) from s to ∞. EXAM TRAP: L{(cos t)/t} does NOT exist (diverges at t → 0⁺)!", "aMath": "\\mathcal{L}\\!\\left\\{\\frac{f(t)}{t}\\right\\} = \\int_s^\\infty F(u)\\,du", "tip": "Always verify lim_{t→0⁺} f(t)/t is finite first."}, {"id": "fc093", "co": "co6", "level": "Basic", "cat": "CO6 · UNIT STEP", "qText": "Define the Heaviside Unit Step function u(t − a) and its Laplace transform.", "qMath": "", "aText": "u(t − a) = 0 for t < a and 1 for t > a (switches ON at t = a):", "aMath": "\\mathcal{L}\\{u(t - a)\\} = \\frac{e^{-as}}{s} \\qquad (a \\ge 0,\\; s > 0)", "tip": "Boxcar pulse on a < t < b is g(t)[u(t − a) − u(t − b)]."}, {"id": "fc094", "co": "co6", "level": "Intermediate", "cat": "CO6 · 2ND SHIFTING", "qText": "State both forms of the Second Shifting Theorem (t-Shifting).", "qMath": "", "aText": "Use the unshifted shortcut for t² u(t−a) or cos ωt · u(t−a):", "aMath": "\\mathcal{L}\\{f(t-a)u(t-a)\\} = e^{-as}F(s),\\qquad \\mathcal{L}\\{g(t)u(t-a)\\} = e^{-as}\\mathcal{L}\\{g(t+a)\\}", "tip": "Inverse: L⁻¹{e^{−as}F(s)} = f(t − a)u(t − a)."}, {"id": "fc095", "co": "co6", "level": "Intermediate", "cat": "CO6 · CONVOLUTION", "qText": "State the Convolution Theorem for L⁻¹{F(s)G(s)}.", "qMath": "", "aText": "", "aMath": "\\mathcal{L}^{-1}\\{F(s)G(s)\\} = (f * g)(t) = \\int_0^t f(\\tau)g(t - \\tau)\\,d\\tau", "tip": "Commutative: f * g = g * f — put the simpler function in g(t − τ)."}, {"id": "fc096", "co": "co6", "level": "Advanced", "cat": "CO6 · SQUARED PAIRS", "qText": "Recall the 3 classic squared-factor Convolution inverse results.", "qMath": "", "aText": "", "aMath": "\\frac{s}{(s^2+a^2)^2}\\to\\frac{t\\sin at}{2a},\\quad \\frac{1}{(s^2+a^2)^2}\\to\\frac{\\sin at - at\\cos at}{2a^3},\\quad \\frac{s^2}{(s^2+a^2)^2}\\to\\frac{\\sin at + at\\cos at}{2a}", "tip": "High-yield 4-mark exam favorites (Q199 & Q203)!"}, {"id": "fc097", "co": "co6", "level": "Advanced", "cat": "CO6 · VOLTERRA EQ.", "qText": "How does Laplace transform solve a Volterra integral equation?", "qMath": "y(t) + c\\int_0^t y(\\tau)k(t - \\tau)\\,d\\tau = g(t)", "aText": "Recognize the convolution y * k, take L, and solve algebraically for Y(s):", "aMath": "Y(s)\\big[1 + cK(s)\\big] = G(s) \\implies Y(s) = \\frac{G(s)}{1 + cK(s)}", "tip": "If e^t ∫₀^t y(τ)e^{−τ} dτ appears, pull e^t inside to form e^{t−τ}!"}, {"id": "fc098", "co": "co6", "level": "Advanced", "cat": "CO6 · VARIABLE-COEFF", "qText": "Write the Laplace transforms of t y′(t) and t y″(t).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{ty'\\} = -sY' - Y,\\qquad \\mathcal{L}\\{ty''\\} = -s^2 Y' - 2sY + y(0)", "tip": "Turns ty″ + 2y′ + ty = 0 into −(s²+1)Y′ = 1 (Q217)!"}, {"id": "fc099", "co": "co6", "level": "Advanced", "cat": "CO6 · SHIFTED-DATA IVP", "qText": "How do you apply Laplace if initial data is at t₀ ≠ 0 (e.g. y(2), y′(2))?", "qMath": "", "aText": "Shift the time origin to τ = 0, solve for ỹ(τ), then shift back:", "aMath": "\\text{Set } t = \\tau + t_0 \\implies \\text{solve at } \\tau = 0 \\implies \\text{replace } \\tau = t - t_0", "tip": "Page 12 Card 24 from your Master Formula Sheet!"}, {"id": "fc100", "co": "co6", "level": "Advanced", "cat": "CO6 · MISSING y'(0)", "qText": "How do you solve a BVP via Laplace when y′(0) is not given (e.g. y(π/2) is given)?", "qMath": "", "aText": "Introduce a temporary parameter k for y′(0), invert to y(t) in terms of k, then apply the boundary condition:", "aMath": "\\text{Set } y'(0) = k \\implies y(t; k) \\xrightarrow{\\text{plug } y(t_1)} \\text{solve for } k", "tip": "Works cleanly for both ODE BVPs and coupled systems!"}, {"id": "fc101", "co": "ch0", "level": "Basic", "cat": "CH.0 · PRODUCT-TO-SUM", "qText": "State the product-to-sum identities for 2 sin A cos B and 2 cos A cos B.", "qMath": "", "aText": "", "aMath": "2\\sin A\\cos B = \\sin(A+B)+\\sin(A-B),\\qquad 2\\cos A\\cos B = \\cos(A+B)+\\cos(A-B)", "tip": "Splits trig products into instant Laplace-ready sums!"}, {"id": "fc102", "co": "ch0", "level": "Basic", "cat": "CH.0 · HYPERBOLIC SQ.", "qText": "Write the power-reduction formulas for cosh²x and sinh²x.", "qMath": "", "aText": "", "aMath": "\\cosh^2 x = \\frac{1 + \\cosh 2x}{2},\\qquad \\sinh^2 x = \\frac{\\cosh 2x - 1}{2}", "tip": "Also remember sinh 2x = 2 sinh x cosh x."}, {"id": "fc103", "co": "ch0", "level": "Intermediate", "cat": "CH.0 · EXP-COS INT.", "qText": "Recall the standard integral of e^{ax} cos(bx) dx.", "qMath": "", "aText": "", "aMath": "\\int e^{ax}\\cos bx\\,dx = \\frac{e^{ax}}{a^2 + b^2}(a\\cos bx + b\\sin bx) + C", "tip": "Plus sign inside parentheses for cos; minus sign for sin!"}, {"id": "fc104", "co": "ch0", "level": "Intermediate", "cat": "CH.0 · GAMMA HALF-INT", "qText": "Recall the exact values of Γ(1/2), Γ(3/2), and Γ(5/2).", "qMath": "", "aText": "", "aMath": "\\Gamma\\!\\left(\\frac{1}{2}\\right)=\\sqrt{\\pi},\\qquad \\Gamma\\!\\left(\\frac{3}{2}\\right)=\\frac{\\sqrt{\\pi}}{2},\\qquad \\Gamma\\!\\left(\\frac{5}{2}\\right)=\\frac{3\\sqrt{\\pi}}{4}", "tip": "Use Γ(n+1) = n Γ(n) recursively for any half-integer!"}, {"id": "fc105", "co": "co1", "level": "Intermediate", "cat": "CO1 · POLAR LIMIT", "qText": "How do polar coordinates prove a 2D limit at (0, 0) EXISTS?", "qMath": "x = r\\cos\\theta,\\qquad y = r\\sin\\theta", "aText": "If |f(r cos θ, r sin θ) − L| ≤ g(r) → 0 independently of θ as r → 0⁺, then the limit equals L.", "aMath": "\\left|\\frac{xy}{\\sqrt{x^2+y^2}}\\right| = r|\\cos\\theta\\sin\\theta| \\le r \\to 0", "tip": "Bounds must be completely independent of θ!"}, {"id": "fc106", "co": "co1", "level": "Advanced", "cat": "CO1 · PARABOLIC PATH", "qText": "Why does lim_{(x,y)→(0,0)} x²y/(x⁴ + y²) NOT exist even though y = mx gives 0?", "qMath": "", "aText": "Testing along the parabolic curve y = kx² gives a slope-dependent limit:", "aMath": "\\lim_{x\\to 0}\\frac{k x^4}{x^4 + k^2 x^4} = \\frac{k}{1 + k^2} \\implies \\text{DNE}", "tip": "Always check y = kx² when degrees of x and y differ (x⁴ vs y²)!"}, {"id": "fc107", "co": "co1", "level": "Basic", "cat": "CO1 · CHAIN RULE 3D", "qText": "Write the Chain Rule for u = f(x, y, z) along a curve (x(t), y(t), z(t)).", "qMath": "", "aText": "", "aMath": "\\frac{du}{dt} = \\frac{\\partial u}{\\partial x}\\frac{dx}{dt} + \\frac{\\partial u}{\\partial y}\\frac{dy}{dt} + \\frac{\\partial u}{\\partial z}\\frac{dz}{dt}", "tip": "For u = x²+y² on x=cos t, y=sin t, du/dt = 0 identically."}, {"id": "fc108", "co": "co1", "level": "Basic", "cat": "CO1 · MACLAURIN CORE", "qText": "Recall the Maclaurin series of e^x, sin x, and cos x.", "qMath": "", "aText": "", "aMath": "e^x = \\sum_{n=0}^{\\infty}\\frac{x^n}{n!},\\quad \\sin x = x - \\frac{x^3}{3!} + \\frac{x^5}{5!} - \\cdots,\\quad \\cos x = 1 - \\frac{x^2}{2!} + \\frac{x^4}{4!} - \\cdots", "tip": "sin is odd alternating; cos is even alternating."}, {"id": "fc109", "co": "co1", "level": "Intermediate", "cat": "CO1 · POLY SHIFT", "qText": "What is the fastest way to expand a polynomial f(x, y) in powers of (x−a) and (y−b)?", "qMath": "", "aText": "Substitute x = a + h and y = b + k directly and expand algebraically:", "aMath": "h = x - a,\\quad k = y - b \\implies \\text{expand } f(a+h, b+k)", "tip": "Exact in 3 lines with zero partial-derivative errors (Q6)!"}, {"id": "fc110", "co": "co1", "level": "Intermediate", "cat": "CO1 · OPEN BOX OPT.", "qText": "What are the optimal proportions of an open-top rectangular box of max volume for fixed surface area S?", "qMath": "", "aText": "Square base with height equal to half the base side:", "aMath": "x = y = 2z = \\sqrt{\\frac{S}{3}}", "tip": "For S = 108 cm² (Q12): x = y = 6 cm, z = 3 cm, V_max = 108 cm³!"}, {"id": "fc111", "co": "co1", "level": "Advanced", "cat": "CO1 · CUBIC EXTREMA", "qText": "Recall the stationary points and classification of f(x, y) = x³ + y³ − 3axy (a > 0).", "qMath": "", "aText": "", "aMath": "(0,0):\\text{ Saddle Point};\\qquad (a,a):\\text{ Local Minimum } f(a,a) = -a^3", "tip": "Classic 4-mark CO1 exam problem (Q13)!"}, {"id": "fc112", "co": "co2", "level": "Basic", "cat": "CO2 · SOLUTIONS", "qText": "Distinguish General, Particular, and Singular solutions of a 1st-order ODE.", "qMath": "", "aText": "General: contains 1 arbitrary constant C. Particular: specific value of C from an IC. Singular: envelope solution NOT obtainable for any C.", "aMath": "y = cx + c^2 \\implies y = -\\frac{x^2}{4} \\text{ (singular envelope)}", "tip": "Clairaut’s ODE is the textbook example with a singular solution."}, {"id": "fc113", "co": "co2", "level": "Basic", "cat": "CO2 · EXP SEPARABLE", "qText": "How do you separate and solve y′ = e^{ax + by}?", "qMath": "", "aText": "Factor e^{ax+by} = e^{ax}·e^{by}, move e^{by} to the left as e^{−by} dy, and integrate:", "aMath": "\\int e^{-by}\\,dy = \\int e^{ax}\\,dx \\implies -\\frac{1}{b}e^{-by} = \\frac{1}{a}e^{ax} + C", "tip": "Q16: y′ = e^{3x+2y} ⇒ 2e^{3x} + 3e^{−2y} = C₁."}, {"id": "fc114", "co": "co2", "level": "Intermediate", "cat": "CO2 · x = vy SWAP", "qText": "When should you use x = vy instead of y = ux for a homogeneous ODE?", "qMath": "", "aText": "Whenever the ODE is simpler in x/y than y/x (e.g. x²y dx − (x³+y³) dy = 0):", "aMath": "x = vy \\implies dx = v\\,dy + y\\,dv", "tip": "Turns Q19 into v²y dv = dy in two lines!"}, {"id": "fc115", "co": "co2", "level": "Basic", "cat": "CO2 · EXACT PARAM", "qText": "Find k so (x³ + 3xy²) dx + (kx²y + y³) dy = 0 is exact (Q21).", "qMath": "", "aText": "Set M_y = N_x:", "aMath": "M_y = 6xy = N_x = 2kxy \\implies k = 3", "tip": "1-mark exam staple—always equate ∂M/∂y = ∂N/∂x."}, {"id": "fc116", "co": "co2", "level": "Intermediate", "cat": "CO2 · I.F. RULE 4", "qText": "State I.F. Rule 4 (Exponential Inspection) when M_y ≠ N_x.", "qMath": "", "aText": "If terms contain e^{x+y} alongside x or y, test multiplying the ODE by e^{−x} or e^{−y}:", "aMath": "(ye^x + 1)\\,dx + (e^{x+y} + xe^x)\\,dy = 0 \\xrightarrow{\\times e^{-x}} (y + e^{-x})\\,dx + (e^y + x)\\,dy = 0", "tip": "Turns Q23 exact immediately!"}, {"id": "fc117", "co": "co2", "level": "Intermediate", "cat": "CO2 · ORTHOGONAL", "qText": "How do you find the orthogonal trajectories of a curve family F(x, y, c) = 0?", "qMath": "", "aText": "Form the family’s ODE y′ = f(x, y), replace y′ by −1/y′, and solve:", "aMath": "\\frac{dy}{dx} = -\\frac{1}{f(x,y)}", "tip": "Orthogonal trajectories of circles x² + y² = c are radial lines y = kx."}, {"id": "fc118", "co": "co2", "level": "Basic", "cat": "CO2 · TRIG I.F.", "qText": "Find the Integrating Factor of (sin x) y′ + (cos x) y = 1 (Q29).", "qMath": "", "aText": "Divide by sin x first so P(x) = cot x:", "aMath": "\\text{I.F.} = e^{\\int \\cot x\\,dx} = e^{\\ln|\\sin x|} = \\sin x", "tip": "Notice the original LHS is already d/dx(y sin x)!"}, {"id": "fc119", "co": "co2", "level": "Advanced", "cat": "CO2 · BERNOULLI n=4", "qText": "Write the linearized ODE for y′ + (y/x) = x² y⁴ (Q37).", "qMath": "", "aText": "Divide by y⁴ and put u = y^{1−4} = y^{−3} (so u′ = −3y^{−4}y′):", "aMath": "u' - \\frac{3}{x}u = -3x^2 \\implies \\text{I.F.} = x^{-3} \\implies y^{-3} = x^3(C - 3\\ln|x|)", "tip": "Check the sign of (1 − n) = −3 on BOTH terms!"}, {"id": "fc120", "co": "co3", "level": "Basic", "cat": "CO3 · EQUILIBRIUM", "qText": "What is the steady-state salt mass in a constant-volume tank V with inflow concentration c_in?", "qMath": "", "aText": "Set dy/dt = 0 (Rate In = Rate Out):", "aMath": "y_{\\infty} = \\lim_{t\\to\\infty} y(t) = c_{\\text{in}}\\,V", "tip": "Independent of the initial salt y₀ and flow rate r!"}, {"id": "fc121", "co": "co3", "level": "Intermediate", "cat": "CO3 · AIRFLOW TIME", "qText": "In a room of volume V with fresh-air flow r, when does fresh air reach fraction p (e.g. 80%)?", "qMath": "", "aText": "From y(t)/V = 1 − e^{−(r/V)t} = p:", "aMath": "t = \\frac{V}{r}\\ln\\!\\left(\\frac{1}{1 - p}\\right)", "tip": "Q40: V/r = 20000/600 = 100/3, p = 0.8 ⇒ (100/3) ln 5 ≈ 53.65 min."}, {"id": "fc122", "co": "co3", "level": "Basic", "cat": "CO3 · HEATING SIGN", "qText": "In Newton’s Law dT/dt = k(T − T_s), what is the sign of k when a cold object HEATS UP?", "qMath": "", "aText": "k is STILL NEGATIVE (k < 0) because T − T_s < 0, so k(T − T_s) > 0 (warming)!", "aMath": "T(t) = T_s - (T_s - T_0)e^{kt} \\qquad (k < 0)", "tip": "Never flip the sign of k between cooling and heating."}, {"id": "fc123", "co": "co3", "level": "Basic", "cat": "CO3 · DOUBLING TIME", "qText": "If a population grows by factor m in time t₁, what is its doubling time t₂?", "qMath": "", "aText": "Since k = (ln m)/t₁:", "aMath": "t_2 = t_1\\,\\frac{\\ln 2}{\\ln m}", "tip": "Example: triples (m=3) in 2 hr ⇒ t₂ = 2 ln 2 / ln 3 ≈ 1.26 hr."}, {"id": "fc124", "co": "co3", "level": "Intermediate", "cat": "CO3 · RC CHARGING", "qText": "Write the charge Q(t) and current I(t) when an uncharged RC circuit connects to DC source E.", "qMath": "", "aText": "", "aMath": "Q(t) = CE\\left(1 - e^{-t/(RC)}\\right),\\qquad I(t) = Q'(t) = \\frac{E}{R}\\,e^{-t/(RC)}", "tip": "Current starts at E/R and decays to 0 as capacitor fills to CE."}, {"id": "fc125", "co": "co3", "level": "Advanced", "cat": "CO3 · CASCADE PEAK", "qText": "In a 2-tank cascade with equal rate constant k = r/V, when does Tank 2 salt y₂(t) = y₁(0)kt e^{−kt} peak?", "qMath": "", "aText": "Set y₂′(t) = y₁(0)k(1 − kt)e^{−kt} = 0:", "aMath": "t_{\\max} = \\frac{1}{k} = \\frac{V}{r}", "tip": "Q46: V = 100 L, r = 5 L/min ⇒ t_max = 20 min!"}, {"id": "fc126", "co": "co4", "level": "Basic", "cat": "CO4 · BASIS TO ODE", "qText": "Write the 2nd-order homogeneous ODE with basis {1, e^{4x}} (Q62).", "qMath": "", "aText": "Roots are λ = 0 and λ = 4 ⇒ λ(λ − 4) = 0:", "aMath": "y'' - 4y' = 0", "tip": "Remember 1 = e^{0x} corresponds to root λ = 0!"}, {"id": "fc127", "co": "co4", "level": "Basic", "cat": "CO4 · WRONSKIAN EX.", "qText": "Compute W(e^{ax}, x e^{ax}) quickly.", "qMath": "", "aText": "", "aMath": "W(e^{ax},\\; x e^{ax}) = e^{2ax}", "tip": "Q79: a = 2 ⇒ W = e^{4x}."}, {"id": "fc128", "co": "co4", "level": "Intermediate", "cat": "CO4 · CONST WRONSK.", "qText": "When is the Wronskian W(y₁, y₂) of y″ + p(x)y′ + q(x)y = 0 strictly constant?", "qMath": "", "aText": "By Abel’s identity W(x) = W(x₀) e^{−∫p dx}, W is constant whenever the y′ term is absent:", "aMath": "p(x) \\equiv 0 \\implies W(x) = \\text{const}", "tip": "Example: y″ + ω²y = 0 has W(cos ωx, sin ωx) = ω (constant)."}, {"id": "fc129", "co": "co4", "level": "Intermediate", "cat": "CO4 · EC SUBSTITUTION", "qText": "What change of variable transforms Euler–Cauchy x²y″ + axy′ + by = 0 into constant coefficients?", "qMath": "", "aText": "Substitute x = e^t (so t = ln x):", "aMath": "\\frac{d^2 y}{dt^2} + (a - 1)\\frac{dy}{dt} + b y = 0", "tip": "Explains why ln x naturally replaces x in repeated & complex cases!"}, {"id": "fc130", "co": "co4", "level": "Intermediate", "cat": "CO4 · RED. OF ORDER", "qText": "Given y₁ = (cos x)/x of xy″ + 2y′ + xy = 0 (Q92), what is p(x) and e^{−∫p dx}?", "qMath": "", "aText": "Divide by x first!", "aMath": "p(x) = \\frac{2}{x} \\implies e^{-\\int p\\,dx} = x^{-2} \\implies y_2 = \\frac{\\sin x}{x}", "tip": "Dividing by x² cancels cleanly with y₁² = (cos²x)/x²!"}, {"id": "fc131", "co": "co4", "level": "Intermediate", "cat": "CO4 · UC EXP-TRIG", "qText": "Write the Undetermined Coefficients trial y_p for r(x) = k e^{αx} cos(ωx) (non-resonant).", "qMath": "", "aText": "", "aMath": "y_p(x) = e^{\\alpha x}(K\\cos\\omega x + M\\sin\\omega x)", "tip": "Multiply by x if α ± iω are roots of the auxiliary equation!"}, {"id": "fc132", "co": "co4", "level": "Intermediate", "cat": "CO4 · PURE RESONANCE", "qText": "State the particular solution of the undamped resonant ODE y″ + ω²y = cos(ωt).", "qMath": "", "aText": "Modified trial t(K cos ωt + M sin ωt) yields:", "aMath": "y_p(t) = \\frac{1}{2\\omega}\\,t\\sin(\\omega t)", "tip": "Q101: ω = 2 ⇒ y_p = (1/4) x sin 2x."}, {"id": "fc133", "co": "co4", "level": "Advanced", "cat": "CO4 · VOP TAN(x)", "qText": "Recall the Variation of Parameters particular solution of y″ + y = tan x (Q115).", "qMath": "", "aText": "", "aMath": "y_p(x) = -\\cos x\\,\\ln|\\sec x + \\tan x|", "tip": "Use sin²x / cos x = sec x − cos x inside the u₁ integral."}, {"id": "fc134", "co": "co4", "level": "Intermediate", "cat": "CO4 · LC CIRCUIT", "qText": "Write the governing current ODE for a resistanceless LC circuit (R = 0).", "qMath": "", "aText": "", "aMath": "L I'' + \\frac{1}{C}I = E'(t) \\qquad \\left(\\omega_0 = \\frac{1}{\\sqrt{LC}}\\right)", "tip": "Undamped sinusoidal oscillations; resonance occurs if E(t) has frequency ω₀."}, {"id": "fc135", "co": "co4", "level": "Intermediate", "cat": "CO4 · PHASE ANGLE", "qText": "How is the steady-state phase lag δ determined in an AC RLC circuit?", "qMath": "", "aText": "From Reactance S = ωL − 1/(ωC) and Resistance R:", "aMath": "\\tan\\delta = \\frac{S}{R} = \\frac{\\omega L - 1/(\\omega C)}{R}", "tip": "At resonance S = 0 ⇒ δ = 0 (current in exact phase with voltage)!"}, {"id": "fc136", "co": "co5", "level": "Basic", "cat": "CO5 · ENDPOINTS", "qText": "Does the Ratio Test tell you whether ∑ a_m (x − x₀)^m converges at the endpoints x = x₀ ± R?", "qMath": "", "aText": "NO! The Ratio Test is inconclusive at |x − x₀| = R—endpoints must be tested separately.", "aMath": "\\ln(1+x) = \\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}x^n}{n} \\implies \\text{converges on } (-1, 1]", "tip": "Open interval (−R, R) is guaranteed; endpoints can be open or closed."}, {"id": "fc137", "co": "co5", "level": "Basic", "cat": "CO5 · SINGULAR PTS", "qText": "Identify the singular points of Legendre’s equation (1 − x²)y″ − 2xy′ + n(n+1)y = 0.", "qMath": "", "aText": "Set the leading coefficient 1 − x² = 0:", "aMath": "x = \\pm 1 \\implies \\text{guaranteed } R_{\\min} = 1 \\text{ about } x_0 = 0", "tip": "Polynomial solutions P_n(x) converge everywhere, while the second series Q_n(x) has R = 1!"}, {"id": "fc138", "co": "co5", "level": "Intermediate", "cat": "CO5 · SHIFTED POLES", "qText": "Find R_min for (x² − 2x + 5)y″ + y = 0 about x₀ = 1.", "qMath": "", "aText": "Complete the square: (x − 1)² + 4 = 0 ⇒ poles at z = 1 ± 2i:", "aMath": "R_{\\min} = |(1 \\pm 2i) - 1| = 2", "tip": "Always measure Euclidean distance in ℂ from x₀ to the nearest pole!"}, {"id": "fc139", "co": "co5", "level": "Intermediate", "cat": "CO5 · CHEBYSHEV", "qText": "Write Chebyshev’s ODE of order n and the polynomial T₂(x) (Q148).", "qMath": "", "aText": "", "aMath": "(1 - x^2)y'' - xy' + n^2 y = 0,\\qquad T_2(x) = 2x^2 - 1", "tip": "Normalized with T_n(1) = 1: T₀ = 1, T₁ = x, T₂ = 2x² − 1."}, {"id": "fc140", "co": "co5", "level": "Advanced", "cat": "CO5 · CLOSED FORM", "qText": "Recognize the closed-form function of ∑_{k=0}^∞ x^{2k}/k! (Q147).", "qMath": "", "aText": "Replace u = x² in the Maclaurin series of e^u:", "aMath": "\\sum_{k=0}^{\\infty}\\frac{x^{2k}}{k!} = e^{x^2}", "tip": "Solves y′ = 2xy and y″ − 4xy′ + (4x²−2)y = 0 cleanly!"}, {"id": "fc141", "co": "co6", "level": "Basic", "cat": "CO6 · LINEARITY", "qText": "State the Linearity Property of both ℒ and ℒ⁻¹.", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{a f(t) + b g(t)\\} = a F(s) + b G(s),\\qquad \\mathcal{L}^{-1}\\{a F + b G\\} = a f + b g", "tip": "Applies to finite sums—NOT to products (products need Convolution!)."}, {"id": "fc142", "co": "co6", "level": "Basic", "cat": "CO6 · SHIFTED POWER", "qText": "Recall ℒ{t^n e^{at}} and its inverse ℒ⁻¹{1/(s − a)^n}.", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\{t^n e^{at}\\} = \\frac{n!}{(s - a)^{n+1}},\\qquad \\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{(s - a)^n}\\right\\} = \\frac{t^{n-1} e^{at}}{(n - 1)!}", "tip": "Q166: ℒ⁻¹{1/(s−2)⁵} = t⁴ e^{2t} / 24."}, {"id": "fc143", "co": "co6", "level": "Intermediate", "cat": "CO6 · COSH·COS", "qText": "Recall the Laplace transform of cosh(at) cos(at) (Q165).", "qMath": "", "aText": "Expand cosh(at) = ½(e^{at} + e^{−at}) and apply First Shifting twice:", "aMath": "\\mathcal{L}\\{\\cosh at\\,\\cos at\\} = \\frac{s^3}{s^4 + 4a^4}", "tip": "Clean algebraic cancellation makes this a favorite 1-mark question!"}, {"id": "fc144", "co": "co6", "level": "Intermediate", "cat": "CO6 · DIV BY s PAIR", "qText": "Evaluate ℒ⁻¹{1 / [s(s² + a²)]} via Division by s (without partial fractions).", "qMath": "", "aText": "Integrate (sin aτ)/a from 0 to t:", "aMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{1}{s(s^2 + a^2)}\\right\\} = \\frac{1 - \\cos at}{a^2}", "tip": "Check at t = 0: (1 − 1)/a² = 0 ✓."}, {"id": "fc145", "co": "co6", "level": "Intermediate", "cat": "CO6 · DIRICHLET INT.", "qText": "Recall ℒ{(sin t)/t} and the exact value of the Dirichlet integral ∫₀^∞ (sin t)/t dt (Q173).", "qMath": "", "aText": "", "aMath": "\\mathcal{L}\\!\\left\\{\\frac{\\sin t}{t}\\right\\} = \\cot^{-1} s \\implies \\int_0^\\infty \\frac{\\sin t}{t}\\,dt = \\cot^{-1}(0) = \\frac{\\pi}{2}", "tip": "Set s → 0⁺ after finding the Laplace transform!"}, {"id": "fc146", "co": "co6", "level": "Intermediate", "cat": "CO6 · COMBO SHIFT", "qText": "How do you compute ℒ{t e^{at} sin(ωt)} (Q180)?", "qMath": "", "aText": "First find ℒ{t sin ωt} = 2ωs/(s²+ω²)², then apply First Shifting s → s − a:", "aMath": "\\mathcal{L}\\{t e^{at}\\sin\\omega t\\} = \\frac{2\\omega(s - a)}{\\big[(s - a)^2 + \\omega^2\\big]^2}", "tip": "Shifting LAST avoids differentiating messy shifted denominators!"}, {"id": "fc147", "co": "co6", "level": "Intermediate", "cat": "CO6 · EXP STEP", "qText": "Evaluate ℒ{e^{bt} u(t − a)} using the Unshifted Step shortcut.", "qMath": "", "aText": "Apply e^{−as} ℒ{e^{b(t+a)}} = e^{ab−as} ℒ{e^{bt}}:", "aMath": "\\mathcal{L}\\{e^{bt} u(t - a)\\} = \\frac{e^{a(b - s)}}{s - b} \\qquad (s > b)", "tip": "Saves factoring e^{bt} = e^{ba} e^{b(t−a)} manually!"}, {"id": "fc148", "co": "co6", "level": "Advanced", "cat": "CO6 · VOLTERRA PULL", "qText": "How do you transform e^t ∫₀^t y(τ) e^{−τ} dτ inside a Volterra integral equation?", "qMath": "", "aText": "Pull e^t inside the τ-integral (since t is constant w.r.t. τ) to expose the convolution kernel e^{t−τ}:", "aMath": "e^t\\int_0^t y(\\tau)e^{-\\tau}\\,d\\tau = \\int_0^t y(\\tau)e^{t-\\tau}\\,d\\tau = (y * e^t) \\xrightarrow{\\mathcal{L}} \\frac{Y(s)}{s - 1}", "tip": "Page 9 Pro Trick #3 from your Master Formula Sheet!"}, {"id": "fc149", "co": "co6", "level": "Intermediate", "cat": "CO6 · STEP IVP", "qText": "What is the Subsidiary Equation of y″ + y = u(t − π) with y(0) = 1, y′(0) = 0 (Q213)?", "qMath": "", "aText": "", "aMath": "(s^2 + 1)Y - s = \\frac{e^{-\\pi s}}{s} \\implies y(t) = \\cos t + (1 + \\cos t)u(t - \\pi)", "tip": "Remember cos(t − π) = −cos t simplifies 1 − cos(t − π) to 1 + cos t!"}, {"id": "fc150", "co": "co6", "level": "Advanced", "cat": "CO6 · COUPLED SYS.", "qText": "Write the Laplace algebraic system for y₁′ = −y₁ + y₂, y₂′ = y₁ − y₂ with y₁(0)=0, y₂(0)=1 (Q221).", "qMath": "", "aText": "", "aMath": "(s+1)Y_1 - Y_2 = 0,\\quad -Y_1 + (s+1)Y_2 = 1 \\implies y_1 = \\frac{1-e^{-2t}}{2},\\; y_2 = \\frac{1+e^{-2t}}{2}", "tip": "Notice y₁(t) + y₂(t) ≡ 1 at all times (conservation of total mass)!"}], "laplaceTable": [{"f": "1", "F": "\\frac{1}{s}", "inv": "\\mathcal{L}^{-1}\\{1/s\\} = 1", "cond": "s > 0", "cat": "Basic"}, {"f": "t^n \\;\\; (n\\in\\mathbb{N}_0)", "F": "\\frac{n!}{s^{n+1}}", "inv": "\\mathcal{L}^{-1}\\{1/s^n\\} = \\frac{t^{n-1}}{(n-1)!}", "cond": "s > 0", "cat": "Basic"}, {"f": "t^a \\;\\; (a > -1)", "F": "\\frac{\\Gamma(a+1)}{s^{a+1}}", "inv": "\\Gamma(1/2) = \\sqrt{\\pi}", "cond": "s > 0", "cat": "Basic"}, {"f": "e^{at}", "F": "\\frac{1}{s - a}", "inv": "\\mathcal{L}^{-1}\\{1/(s-a)\\} = e^{at}", "cond": "s > a", "cat": "Exponential"}, {"f": "\\sin at", "F": "\\frac{a}{s^2 + a^2}", "inv": "\\mathcal{L}^{-1}\\{1/(s^2+a^2)\\} = \\frac{\\sin at}{a}", "cond": "s > 0", "cat": "Trig"}, {"f": "\\cos at", "F": "\\frac{s}{s^2 + a^2}", "inv": "\\mathcal{L}^{-1}\\{s/(s^2+a^2)\\} = \\cos at", "cond": "s > 0", "cat": "Trig"}, {"f": "\\sinh at", "F": "\\frac{a}{s^2 - a^2}", "inv": "\\mathcal{L}^{-1}\\{1/(s^2-a^2)\\} = \\frac{\\sinh at}{a}", "cond": "s > |a|", "cat": "Hyperbolic"}, {"f": "\\cosh at", "F": "\\frac{s}{s^2 - a^2}", "inv": "\\mathcal{L}^{-1}\\{s/(s^2-a^2)\\} = \\cosh at", "cond": "s > |a|", "cat": "Hyperbolic"}, {"f": "e^{at}\\cos \\omega t", "F": "\\frac{s - a}{(s - a)^2 + \\omega^2}", "inv": "\\text{1st Shifting (}s\\to s-a\\text{)}", "cond": "s > a", "cat": "Shifted"}, {"f": "e^{at}\\sin \\omega t", "F": "\\frac{\\omega}{(s - a)^2 + \\omega^2}", "inv": "\\text{1st Shifting (}s\\to s-a\\text{)}", "cond": "s > a", "cat": "Shifted"}, {"f": "t\\sin \\omega t", "F": "\\frac{2\\omega s}{(s^2 + \\omega^2)^2}", "inv": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{s}{(s^2+\\omega^2)^2}\\right\\} = \\frac{t\\sin\\omega t}{2\\omega}", "cond": "s > 0", "cat": "s-Diff"}, {"f": "t\\cos \\omega t", "F": "\\frac{s^2 - \\omega^2}{(s^2 + \\omega^2)^2}", "inv": "-\\frac{d}{ds}\\!\\left(\\frac{s}{s^2+\\omega^2}\\right)", "cond": "s > 0", "cat": "s-Diff"}, {"f": "\\frac{\\sin at - at\\cos at}{2a^3}", "F": "\\frac{1}{(s^2 + a^2)^2}", "inv": "\\text{Convolution Pair 1}", "cond": "s > 0", "cat": "Convolution"}, {"f": "\\frac{\\sin at + at\\cos at}{2a}", "F": "\\frac{s^2}{(s^2 + a^2)^2}", "inv": "\\text{Convolution Pair 2}", "cond": "s > 0", "cat": "Convolution"}, {"f": "u(t - a)", "F": "\\frac{e^{-as}}{s}", "inv": "\\mathcal{L}^{-1}\\{e^{-as}/s\\} = u(t-a)", "cond": "a \\ge 0", "cat": "Step"}, {"f": "f(t - a)\\,u(t - a)", "F": "e^{-as} F(s)", "inv": "\\mathcal{L}^{-1}\\{e^{-as}F(s)\\} = f(t-a)u(t-a)", "cond": "a > 0", "cat": "Step"}, {"f": "g(t)\\,u(t - a)", "F": "e^{-as}\\mathcal{L}\\{g(t+a)\\}", "inv": "\\text{Unshifted Step Shortcut}", "cond": "a > 0", "cat": "Step"}, {"f": "(f * g)(t)", "F": "F(s)\\,G(s)", "inv": "\\int_0^t f(u)g(t-u)\\,du", "cond": "Convolution", "cat": "Convolution"}], "ucTable": [{"term": "k e^{\\gamma x}", "choice": "C e^{\\gamma x}", "mod": "Multiply by x (or x²) if γ is a simple (or double) root."}, {"term": "k x^n", "choice": "K_n x^n + \\cdots + K_1 x + K_0", "mod": "Multiply by x (or x²) if λ = 0 is a simple (or double) root."}, {"term": "k\\cos\\omega x \\text{ or } k\\sin\\omega x", "choice": "K\\cos\\omega x + M\\sin\\omega x", "mod": "Multiply by x if ±iω are roots of aux eq."}, {"term": "k e^{\\alpha x}\\cos\\omega x", "choice": "e^{\\alpha x}(K\\cos\\omega x + M\\sin\\omega x)", "mod": "Multiply by x if α ± iω are roots of aux eq."}], "analogyTable": [{"mech": "Mass m", "elec": "Inductance L", "eq": "m y'' \\leftrightarrow L I''"}, {"mech": "Damping c", "elec": "Resistance R",
