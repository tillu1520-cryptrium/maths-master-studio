          const ref = document.getElementById('labSearchInput');
          if (ref) { ref.focus(); ref.setSelectionRange(ref.value.length, ref.value.length); }
          refreshIcons();
        };
      }

      const stepConcept = delta => {
        const cur = getFilteredLabs();
        if (!cur.length) return;
        const idx = cur.findIndex(x => x.id === state.activeLabId);
        const next = cur[(idx + delta + cur.length) % cur.length];
        state.activeLabId = next.id;
        mountActiveLabConcept();
      };
      document.getElementById('labPrevConceptBtn').onclick = () => stepConcept(-1);
      document.getElementById('labNextConceptBtn').onclick = () => stepConcept(1);
      document.getElementById('labRandConceptBtn').onclick = () => {
        const cur = getFilteredLabs();
        if (!cur.length) return;
        state.activeLabId = cur[Math.floor(Math.random() * cur.length)].id;
        mountActiveLabConcept();
        showToast('Loaded random interactive concept!');
      };

      refreshIcons();
      mountActiveLabConcept();
    }

    function mountActiveLabConcept() {
      const concept = LAB_CONCEPTS.find(x => x.id === state.activeLabId) || LAB_CONCEPTS[0];
      const ch = getChapterForCo(concept.co);

      // Highlight active button in rail without rebuilding whole view
      document.querySelectorAll('.lab-item-btn').forEach(btn => {
        const act = btn.dataset.selectLabId === concept.id;
        btn.className = `lab-item-btn w-full text-left px-2.5 py-2 rounded-xl border transition-all flex items-start gap-2 ${act ? 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-400/70 shadow-sm' : 'border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'}`;
      });

      const coBadge = document.getElementById('labCoBadge');
      const numBadge = document.getElementById('labNumBadge');
      const titleEl = document.getElementById('labTitleEl');
      const fBox = document.getElementById('labFormulaBox');
      const dEl = document.getElementById('labDescEl');
      if (coBadge) { coBadge.textContent = `${ch.co} · ${concept.engine.toUpperCase()}`; coBadge.style.background = ch.gradCss; }
      if (numBadge) numBadge.textContent = `Concept ${concept.id.replace('L', '#')} of 100`;
      if (titleEl) titleEl.innerHTML = fmtMathProse(concept.title);
      if (fBox) { fBox.innerHTML = texNode(concept.formula, true); renderAllTex(fBox); }
      if (dEl) dEl.innerHTML = fmtMathProse(concept.desc);

      runLabEngine(concept);
    }

    // Mathematical Helpers (100% finite-safe)
    function factN(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
    function legendreP(n, x) { if (n <= 0) return 1; if (n === 1) return x; let a = 1, b = x; for (let k = 2; k <= n; k++) { const c = ((2 * k - 1) * x * b - (k - 1) * a) / k; a = b; b = c; } return b; }
    function chebT(n, x) { const cx = Math.max(-1, Math.min(1, x)); return Math.cos(n * Math.acos(cx)); }
    function gammaApprox(z) {
      if (z < 0.05) return 20;
      const g = 7, p = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
      z -= 1; let x = p[0]; for (let i = 1; i < g + 2; i++) x += p[i] / (z + i);
      const t = z + g + 0.5; return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
    }

    // =========================================================================
    // 9-ENGINE PARAMETERIZED 60-FPS MATHEMATICAL CANVAS KERNEL
    // =========================================================================
    function runLabEngine(concept) {
      if (activeLabRaf !== null) { cancelAnimationFrame(activeLabRaf); activeLabRaf = null; }
      if (activeRO) { activeRO.disconnect(); activeRO = null; }

      const canvas = document.getElementById('labCanvas'), wrap = document.getElementById('labCanvasWrap');
      const controls = document.getElementById('labControls'), telemetry = document.getElementById('labTelemetry');
      const badge = document.getElementById('labLiveBadge'), playBtn = document.getElementById('labPlayPauseBtn'), resetBtn = document.getElementById('labResetBtn');
      if (!canvas || !wrap || !controls || !telemetry) return;

      const ctx = canvas.getContext('2d');
      let running = true, simTime = 0, dims = { w: 460, h: 320 };
      const ch = getChapterForCo(concept.co);
      const accent = ch.accentHex;
      const st = { v1: concept.p1.val, v2: concept.p2.val, sx: 0.0, sy: concept.engine === 'slopefield' ? concept.p2.val : 1.0 };

      const syncSize = () => {
        const rect = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
        dims = { w: Math.max(260, rect.width || 460), h: Math.max(240, rect.height || 320) };
        canvas.width = Math.floor(dims.w * dpr); canvas.height = Math.floor(dims.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      syncSize();
      if (typeof ResizeObserver !== 'undefined') { activeRO = new ResizeObserver(syncSize); activeRO.observe(wrap); }

      const buildSliders = () => {
        controls.innerHTML = `
          <div>
            <div class="flex justify-between mb-1"><span class="font-semibold">${fmtMathProse(concept.p1.label)}</span><span id="labV1" class="font-mono font-bold" style="color:${accent}">${st.v1.toFixed(2)}</span></div>
            <input id="labS1" type="range" min="${concept.p1.min}" max="${concept.p1.max}" step="${concept.p1.step}" value="${st.v1}" class="w-full" />
          </div>
          <div>
            <div class="flex justify-between mb-1"><span class="font-semibold">${fmtMathProse(concept.p2.label)}</span><span id="labV2" class="font-mono font-bold text-cyan-600 dark:text-cyan-400">${st.v2.toFixed(2)}</span></div>
            <input id="labS2" type="range" min="${concept.p2.min}" max="${concept.p2.max}" step="${concept.p2.step}" value="${st.v2}" class="w-full" />
          </div>
          ${concept.engine === 'slopefield' ? '<div class="callout-shortcut rounded-xl p-2 text-[11px]">Tap/click anywhere on the slope field to drop a new IVP seed (x₀, y₀)!</div>' : ''}`;
        document.getElementById('labS1').oninput = e => { st.v1 = +e.target.value; document.getElementById('labV1').textContent = st.v1.toFixed(2); };
        document.getElementById('labS2').oninput = e => { st.v2 = +e.target.value; if (concept.engine === 'slopefield') st.sy = st.v2; document.getElementById('labV2').textContent = st.v2.toFixed(2); };
      };
      buildSliders();

      if (playBtn) {
        playBtn.innerHTML = '<i data-lucide="pause" class="w-3.5 h-3.5"></i><span>Pause</span>';
        playBtn.onclick = () => {
          running = !running;
          playBtn.innerHTML = running ? '<i data-lucide="pause" class="w-3.5 h-3.5"></i><span>Pause</span>' : '<i data-lucide="play" class="w-3.5 h-3.5"></i><span>Resume</span>';
          refreshIcons();
        };
      }
      if (resetBtn) resetBtn.onclick = () => { st.v1 = concept.p1.val; st.v2 = concept.p2.val; st.sx = 0; st.sy = concept.p2.val; simTime = 0; buildSliders(); };
      canvas.onclick = concept.engine === 'slopefield' ? e => {
        const r = canvas.getBoundingClientRect();
        st.sx = ((e.clientX - r.left) / Math.max(1, r.width) - 0.5) * 6.4;
        st.sy = (0.5 - (e.clientY - r.top) / Math.max(1, r.height)) * 4.8;
      } : null;

      // Particles for slopefield & tank
      const particles = Array.from({ length: 34 }, (_, idx) => ({
        x: ((idx * 37) % 100) / 100 * 6 - 3, y: ((idx * 53) % 100) / 100 * 4 - 2,
        bx: ((idx * 29) % 100) / 100, by: ((idx * 61) % 100) / 100,
        vx: ((idx % 7) - 3) * 0.0025, vy: (((idx * 3) % 7) - 3) * 0.0025, life: idx * 3
      }));

      // Single frame renderer (exposed for automated testing too!)
      function renderFrame() {
        const { w, h } = dims;
        const v1 = st.v1, v2 = st.v2, m = concept.mode;
        if (running) simTime += 0.028;
        ctx.fillStyle = '#070b1a';
        ctx.fillRect(0, 0, w, h);

        // ----- ENGINE 1: wave2d -----
        if (concept.engine === 'wave2d') {
          let xMin = -4, xMax = 4, yMax = 3.2;
          if (['gamma','ec1','ec2','ec3','frob','lap_kernel','exp_order','lap_tn','imp_int','log_inv','impedance','phase','abel'].includes(m)) { xMin = 0.05; xMax = 5.5; }
          if (m === 'leg_ortho') { xMin = -1.1; xMax = 1.1; yMax = 1.4; }
          if (m === 'lagrange') { xMin = -3.5; xMax = 3.5; yMax = 3.5; }
          const toX = x => ((x - xMin) / (xMax - xMin)) * w;
          const toY = y => h * 0.5 - (Math.max(-yMax * 1.6, Math.min(yMax * 1.6, y)) / yMax) * (h * 0.42);
          ctx.strokeStyle = 'rgba(148,163,184,0.22)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); if (xMin <= 0 && xMax >= 0) { ctx.moveTo(toX(0), 0); ctx.lineTo(toX(0), h); } ctx.stroke();

          if (m === 'lagrange') {
            const Rmin = v1 / Math.sqrt(1 + v2 * v2);
            const rAnim = Rmin * (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(simTime * 1.3)));
            const ox = Rmin / Math.sqrt(1 + v2 * v2), oy = ox * v2;
            const sc = Math.min(w, h) / 7.2;
            // Circles
            [rAnim, Rmin].forEach((rad, i) => {
              ctx.beginPath(); ctx.arc(w / 2, h / 2, rad * sc, 0, Math.PI * 2);
              ctx.strokeStyle = i === 1 ? '#10b981' : 'rgba(99,102,241,0.55)'; ctx.lineWidth = i === 1 ? 2.6 : 1.5; ctx.stroke();
            });
            // Constraint line x + v2*y = v1
            ctx.beginPath();
            ctx.moveTo(w / 2 + (-3.5) * sc, h / 2 - ((v1 - (-3.5)) / v2) * sc);
            ctx.lineTo(w / 2 + (3.5) * sc, h / 2 - ((v1 - 3.5) / v2) * sc);
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.4; ctx.stroke();
            ctx.beginPath(); ctx.arc(w / 2 + ox * sc, h / 2 - oy * sc, 6, 0, Math.PI * 2); ctx.fillStyle = '#f43f5e'; ctx.fill();
            if (badge) badge.textContent = `R_min = ${Rmin.toFixed(2)}`;
            telemetry.innerHTML = `<div class="flex justify-between"><span>Optimum (x*,y*)</span><span class="text-emerald-500">(${ox.toFixed(2)}, ${oy.toFixed(2)})</span></div><div class="flex justify-between"><span>Min Distance</span><span class="text-amber-500">${Rmin.toFixed(3)}</span></div>`;
          } else {
            const evalPair = x => {
              const ph = simTime * 1.1;
              switch (m) {
                case 'sin2': return [v2 * Math.pow(Math.sin(v1 * x + ph * 0.4), 2), v2 * 0.5];
                case 'cos2': return [v2 * Math.pow(Math.cos(v1 * x + ph * 0.4), 2), v2 * 0.5];
                case 'beat': return [2 * Math.sin(v1 * x - ph) * Math.sin(v2 * x - ph), Math.cos((v1 - v2) * x)];
                case 'cosh': return [Math.cosh(v1 * x) + v2, 0.5 * Math.exp(v1 * x)];
                case 'sinh': return [Math.sinh(v1 * x) + v2, 0.5 * Math.exp(v1 * x)];
                case 'hyp_id': return [v2 * (Math.cosh(v1 * x) ** 2 - Math.sinh(v1 * x) ** 2), v2 * Math.min(4, Math.cosh(v1 * x) ** 2)];
                case 'expsin': return [Math.exp(v1 * x) * Math.sin(v2 * x + ph * 0.6), Math.exp(v1 * x)];
                case 'tansec': { const t = Math.tan(v1 * x), s = 1 / Math.cos(v1 * x); return [Math.abs(t) > v2 ? NaN : t * 0.6, Math.abs(s) > v2 ? NaN : s * 0.6]; }
                case 'gamma': return [gammaApprox(x) * 0.35 * v2, x];
                case 'coverup': { const d1 = x - v1, d2 = x - v2; const val = (Math.abs(d1) < 0.08 || Math.abs(d2) < 0.08) ? NaN : 1 / (d1 * d2); return [val, Math.abs(d1) < 0.08 ? NaN : (1 / (v1 - v2)) / d1]; }
                case 'abel': return [v2 * Math.exp(-v1 * x), v2];
                case 'ec1': return [Math.pow(x, v1) * 0.5, Math.pow(x, v2) * 0.5];
                case 'ec2': return [Math.pow(x, v1) * (1 + v2 * Math.log(x)) * 0.5, Math.pow(x, v1) * 0.5];
                case 'ec3': return [Math.pow(x, v2) * Math.cos(v1 * Math.log(x)) * 1.4, Math.pow(x, v2) * 1.4];
                case 'red_order': return [Math.cos(v1 * x) / x * (1 - v2) + Math.sin(v1 * x) / x * v2, Math.sin(v1 * x) / x];
                case 'vop_sec': { const c = Math.cos(v1 * x); const val = Math.abs(c) < 0.08 ? NaN : (1 / (v1 * v1)) * c * Math.log(Math.abs(c)) + (x / v1) * Math.sin(v1 * x); return [val * v2, Math.sin(v1 * x)]; }
                case 'vop_tan': { const u = Math.max(-1.48, Math.min(1.48, x * 0.38)); const yp = -Math.cos(u) * Math.log(Math.abs(1 / Math.cos(u) + Math.tan(u))); return [yp + v1 * Math.cos(u) + v2 * Math.sin(u), yp]; }
                case 'impedance': { const S = x - (v2 * v2) / x; const Z = Math.sqrt(v1 * v1 + S * S); return [2.5 / Z, Z * 0.35]; }
                case 'phase': { const S = x - (v2 * v2) / x; return [Math.atan2(S, v1) * 1.6, 0]; }
                case 'leg_ortho': return [legendreP(Math.round(v1), x) * legendreP(Math.round(v2), x), legendreP(Math.round(v1), x)];
                case 'frob': return [Math.pow(x, v1) * Math.exp(-v2 * x) * 1.8, Math.pow(x, v1) * 0.8];
                case 'lap_kernel': return [Math.exp(-v1 * x) * Math.sin(v2 * x + ph * 0.4) * 2.2, Math.exp(-v1 * x) * 2.2];
                case 'exp_order': return [Math.min(4, v2 * Math.exp(v1 * x) * 0.45), Math.sin(2.5 * x) * x * 0.45];
                case 'lap_tn': return [Math.min(4.5, factN(Math.round(v1)) / Math.pow(x + 0.35, Math.round(v1) + 1) * v2 * 0.6), Math.pow(x * 0.35, Math.round(v1))];
                case 'lap_eat': { const d = x - v1; return [Math.abs(d) < 0.08 ? NaN : (1 / d) * 0.7 * v2, 0]; }
                case 'shift1': return [Math.exp(v1 * (x + 2)) * Math.cos(v2 * x + ph * 0.4) * 1.6, Math.exp(v1 * (x + 2)) * 1.6];
                case 'imp_int': return [x * Math.exp(-v1 * x) * Math.sin(v2 * x) * 4.2, x * Math.exp(-v1 * x) * 4.2];
                case 'tsin': return [x * Math.exp(-v2 * Math.abs(x)) * Math.sin(v1 * x + ph * 0.5) * 0.75, Math.abs(x) * Math.exp(-v2 * Math.abs(x)) * 0.75];
                case 'tcos': return [x * Math.exp(-v2 * Math.abs(x)) * Math.cos(v1 * x + ph * 0.5) * 0.75, Math.abs(x) * Math.exp(-v2 * Math.abs(x)) * 0.75];
                case 'sinc': { const val = Math.abs(x) < 0.02 ? v1 : Math.sin(v1 * x) / x; return [val * 0.85 * v2, 0]; }
                case 'log_inv': { const val = (Math.exp(-v2 * x) - Math.exp(-v1 * x)) / Math.max(0.02, x); return [val * 1.2, 0]; }
                default: return [Math.sin(v1 * x + ph), Math.cos(v1 * x)];
              }
            };

            // Comparison curve (dashed)
            ctx.beginPath(); let f1 = true;
            for (let px = 0; px <= w; px += 3) {
              const x = xMin + (px / w) * (xMax - xMin), [, g] = evalPair(x);
              if (!isFinite(g)) { f1 = true; continue; }
              f1 ? (ctx.moveTo(px, toY(g)), f1 = false) : ctx.lineTo(px, toY(g));
            }
            ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(56,189,248,0.48)'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);

            // Primary glowing curve
            ctx.beginPath(); let f2 = true;
            for (let px = 0; px <= w; px += 2) {
              const x = xMin + (px / w) * (xMax - xMin), [y] = evalPair(x);
              if (!isFinite(y)) { f2 = true; continue; }
              f2 ? (ctx.moveTo(px, toY(y)), f2 = false) : ctx.lineTo(px, toY(y));
            }
            ctx.strokeStyle = accent; ctx.lineWidth = 2.6; ctx.stroke();

            // Animated tracer bead
            const probeX = m === 'gamma' ? v1 : xMin + ((simTime * 0.35) % 1) * (xMax - xMin);
            const [probeY] = evalPair(probeX);
            if (isFinite(probeY)) {
              ctx.beginPath(); ctx.arc(toX(probeX), toY(probeY), 5.5, 0, Math.PI * 2);
              ctx.fillStyle = '#34d399'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
            }
            const extra = m === 'gamma' ? `Γ(${v1.toFixed(1)}) = ${gammaApprox(v1).toFixed(3)}` : m === 'imp_int' ? `Exact Integral = ${(2 * v2 * v1 / Math.pow(v1 * v1 + v2 * v2, 2)).toFixed(4)}` : `f(${probeX.toFixed(2)}) = ${isFinite(probeY) ? probeY.toFixed(3) : '∞'}`;
            if (badge) badge.textContent = extra;
            telemetry.innerHTML = `<div class="flex justify-between"><span>Probe x</span><span class="text-cyan-500">${probeX.toFixed(2)}</span></div><div class="flex justify-between"><span>Live Value</span><span class="text-emerald-500">${extra}</span></div>`;
          }
        }

        // ----- ENGINE 2: surface3d -----
        else if (concept.engine === 'surface3d') {
          const ang = simTime * 0.45 + 0.6, pitch = v2;
          const N = 18, range = 1.6, scale = Math.min(w, h) * 0.24, cx = w * 0.5, cy = h * 0.54;
          const cosA = Math.cos(ang), sinA = Math.sin(ang), cosP = Math.cos(pitch), sinP = Math.sin(pitch);
          const fz = (x, y) => {
            if (m === 'lim_path') { const d = x * x + y * y; return d < 0.02 ? 0 : 0.85 * (x * x - y * y) / d; }
            if (m === 'lim_para') { const d = Math.pow(x, 4) + y * y; return d < 0.01 ? 0 : 1.1 * (x * x * y) / d; }
            if (m === 'lim_cont') return v1 * (x * y) / Math.sqrt(x * x + y * y + 0.03);
            if (m === 'dome') return -0.45 * (x * x + v1 * y * y);
            if (m === 'cubic') return 0.25 * (x * x * x + y * y * y - 3 * v1 * x * y);
            if (m === 'taylor2d') return 0.5 * Math.exp(0.5 * v1 * x) * Math.sin(y);
            if (m === 'euler_hom') return 0.35 * Math.pow(Math.sqrt(x * x + y * y + 0.05), v1);
            return 0.45 * (x * x + v1 * y * y);
          };
          const proj = (x, y, z) => [cx + (x * cosA - y * sinA) * scale, cy + ((x * sinA + y * cosA) * sinP - z * cosP) * scale];
          for (let i = 0; i <= N; i++) {
            const u = -range + (2 * range * i) / N;
            ctx.beginPath(); for (let j = 0; j <= N; j++) { const v = -range + (2 * range * j) / N; const [px, py] = proj(u, v, Math.max(-2, Math.min(2, fz(u, v)))); j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
            ctx.strokeStyle = `hsla(${255 + i * 3},85%,65%,0.45)`; ctx.lineWidth = 1.1; ctx.stroke();
            ctx.beginPath(); for (let j = 0; j <= N; j++) { const v = -range + (2 * range * j) / N; const [px, py] = proj(v, u, Math.max(-2, Math.min(2, fz(v, u)))); j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
            ctx.strokeStyle = `hsla(${190 + i * 2},85%,60%,0.42)`; ctx.lineWidth = 1.1; ctx.stroke();
          }
          // Highlight approach path y = mx or slice curve
          if (m === 'lim_path' || m === 'partial_slice' || m === 'lim_para') {
            ctx.beginPath();
            for (let i = 0; i <= 36; i++) {
              const x = -1.4 + (2.8 * i) / 36;
              const y = m === 'lim_path' ? Math.max(-1.5, Math.min(1.5, v1 * x)) : m === 'lim_para' ? Math.max(-1.5, Math.min(1.5, v1 * x * x)) : v1;
              const [px, py] = proj(x, y, Math.max(-2, Math.min(2, fz(x, y))));
              i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3; ctx.stroke();
          }
          const [ox, oy] = proj(0, 0, fz(0, 0));
          ctx.beginPath(); ctx.arc(ox, oy, 5.5, 0, Math.PI * 2); ctx.fillStyle = '#f43f5e'; ctx.fill();
          const info = m === 'lim_path' ? `Limit along y=${v1.toFixed(1)}x: ${((1 - v1 * v1) / (1 + v1 * v1)).toFixed(2)}`
            : m === 'quad' ? `Δ = ${(4 * v1).toFixed(2)} (${v1 > 0.05 ? 'MIN' : v1 < -0.05 ? 'SADDLE' : 'Δ=0'})`
            : m === 'dome' ? `Δ = ${(4 * v1).toFixed(2)} (LOCAL MAX)` : m === 'cubic' ? `Saddle (0,0) · Min (${v1.toFixed(1)},${v1.toFixed(1)})` : `3D Surface Active`;
          if (badge) badge.textContent = info;
          telemetry.innerHTML = `<div class="flex justify-between"><span>Param 1</span><span class="text-violet-500">${v1.toFixed(2)}</span></div><div class="flex justify-between"><span>Classification</span><span class="text-emerald-500">${info}</span></div>`;
        }

        // ----- ENGINE 3: slopefield -----
        else if (concept.engine === 'slopefield') {
          const toX = x => w * (0.5 + x / 6.4), toY = y => h * (0.5 - y / 4.8);
          const slope = (x, y) => {
            const sy = Math.abs(y) < 0.1 ? (y >= 0 ? 0.1 : -0.1) : y;
            const sx = Math.abs(x) < 0.1 ? (x >= 0 ? 0.1 : -0.1) : x;
            switch (m) {
              case 'sep': return v1 * y;
              case 'exact_circ': return -v1 * x / sy;
              case 'rays': return v1 * y / sx;
              case 'exp_sep': return Math.min(8, Math.exp(Math.max(-3, Math.min(2.2, v1 * x + 0.5 * y))));
              case 'homog': return (v1 * x + y) / sx;
              case 'reducible': { const X = x - v1, Y = y; const d = 2 * X + Y; return Math.abs(d) < 0.12 ? 8 : (X + 2 * Y) / d; }
              case 'exact_hyp': return v1 * x / sy;
              case 'if_x': return -(x * x + y * y + x) / (sx * sy) * 0.45 * v1;
              case 'if_ex': return -(y + Math.exp(-x)) / (Math.exp(Math.min(2.5, y)) + x + 0.05) * v1;
              case 'linear': return v1 * x - y;
              case 'lin_sin': return v1 * Math.sin(2 * x) - y;
              case 'bernoulli': return v1 * x * (1 / sy - y);
              case 'logistic': return 1.1 * y * (1 - y / Math.max(0.3, v1));
              case 'ortho': return y / (v1 * sx);
              default: return -x / sy;
            }
          };
          ctx.strokeStyle = 'rgba(148,163,184,0.22)'; ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
          for (let gx = -3; gx <= 3.01; gx += 0.4) for (let gy = -2; gy <= 2.01; gy += 0.4) {

    function openSearchModal() {
      const m = document.getElementById('searchModal'), i = document.getElementById('globalSearchInput');
      if (!m || !i) return;
      m.classList.remove('hidden'); m.classList.add('flex');
      i.value = ''; renderSearchResults(''); setTimeout(() => i.focus(), 40);
    }
    function closeSearchModal() {
      const m = document.getElementById('searchModal');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    }
    function renderSearchResults(query) {
      const box = document.getElementById('searchResults');
      if (!box) return;
      const q = query.trim().toLowerCase(), hits = [];
      CHAPTERS.forEach(ch => ch.topics.forEach(t => {
        t.formulas.forEach(f => {
          if (!q || `${ch.co} ${t.title} ${f.name} ${f.math} ${f.trick}`.toLowerCase().includes(q))
            hits.push({ kind: 'studio', type: 'Formula', co: ch.co, target: `${ch.id}|${t.id}`, title: f.name, sub: f.trick });
        });
        t.questions.forEach(qs => {
          if (!q || `${ch.co} ${qs.id} ${qs.tag} ${qs.prompt} ${qs.promptMath} ${qs.hint}`.toLowerCase().includes(q))
            hits.push({ kind: 'studio', type: 'Practice Q', co: ch.co, target: `${ch.id}|${t.id}`, title: `${qs.id} · ${qs.tag}`, sub: qs.prompt });
        });
      }));
      FLASHCARDS.forEach(fc => {
        if (!q || `${fc.co} ${fc.cat} ${fc.level} ${fc.qText} ${fc.aMath} ${fc.tip}`.toLowerCase().includes(q))
          hits.push({ kind: 'fc', type: 'Flashcard', co: fc.co.toUpperCase(), target: fc.id, title: `${fc.cat} (${fc.level})`, sub: fc.qText });
      });

      const shown = hits.slice(0, 16);
      if (!shown.length) { box.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">No matches for "${escHtml(query)}".</div>`; return; }
      box.innerHTML = shown.map(h => `
        <button data-search-jump="${h.kind}|${h.target}" class="w-full text-left p-2.5 rounded-xl hover:bg-indigo-500/10 border border-transparent hover:border-indigo-500/30 transition-all flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold ${h.type==='Formula'?'bg-indigo-500/15 text-indigo-600 dark:text-indigo-400':h.type==='Practice Q'?'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400':'bg-fuchsia-500/15 text-fuchsia-600 dark:text-fuchsia-400'}">${h.co} · ${h.type}</span>
              <span class="font-bold text-xs truncate">${escHtml(h.title)}</span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1">${escHtml(h.sub)}</p>
          </div>
          <span class="text-[11px] font-mono font-bold text-indigo-600 dark:text-indigo-400 shrink-0">Go →</span>
        </button>`).join('');
    }

    document.addEventListener('click', e => {
      const nav = e.target.closest('[data-view]');
      if (nav) { state.view = nav.dataset.view; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

      const selCh = e.target.closest('[data-select-chapter]');
      if (selCh) { state.chapterId = selCh.dataset.selectChapter; state.topicFilter = 'all'; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

      const jumpCh = e.target.closest('[data-jump-chapter]');

      const tf = e.target.closest('[data-topic-filter]');
      if (tf) { state.topicFilter = tf.dataset.topicFilter; renderApp(); return; }

      const qm = e.target.closest('[data-q-marks]');
      if (qm) { state.qMarksFilter = qm.dataset.qMarks; renderApp(); return; }

        const co = lLab.dataset.launchLab;

        state.activeLabId = first.id;

        return;

      const lFc = e.target.closest('[data-launch-fc]');

        state.activeLabId = sLabId.dataset.selectLabId;

      }

      const tm = e.target.closest('[data-toggle-master]');

      }

      const tb = e.target.closest('[data-toggle-bookmark]');
      if (tb) {
        const id = tb.dataset.toggleBookmark;
        state.bookmarks[id] = !state.bookmarks[id];
        saveState();
        const isB = !!state.bookmarks[id];
        tb.className = `p-1.5 rounded-lg border transition-colors ${isB ? 'bg-amber-500/15 border-amber-500/40 text-amber-500' : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-amber-500'}`;
        showToast(isB ? 'Bookmarked!' : 'Bookmark removed');

      }

      const acc = e.target.closest('[data-acc-toggle]');
      if (acc) { const t = document.getElementById(acc.dataset.accToggle); if (t) t.classList.toggle('open'); return; }

      const rq = e.target.closest('[data-rate-q]');
      if (rq) {
        const qid = rq.dataset.rateQ, rating = rq.dataset.rating;
        state.solvedQs[qid] = rating;
        saveState(); updateMasteryUI();
        const badgeBox = document.getElementById('qBadge_' + qid);
        if (badgeBox) {
          badgeBox.innerHTML = rating === 'got'
            ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">Recalled ✓</span>'
            : '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/30">Reviewing</span>';
        }
        const gBtn = document.getElementById('qGot_' + qid), rBtn = document.getElementById('qRev_' + qid);
        if (gBtn) gBtn.className = `px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${rating === 'got' ? 'bg-emerald-600 text-white' : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'}`;
        if (rBtn) rBtn.className = `px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${rating === 'review' ? 'bg-rose-600 text-white' : 'bg-rose-500/15 text-rose-600 dark:text-rose-400'}`;
        showToast(rating === 'got' ? `${qid} marked Recalled!` : `${qid} flagged for Review`, rating === 'got' ? 'success' : 'info');
        return;
      }

      const fcCo = e.target.closest('[data-fc-co]');
      if (fcCo) { state.fcCoFilter = fcCo.dataset.fcCo; state.fcIndex = 0; renderApp(); return; }

      const fcLv = e.target.closest('[data-fc-lvl]');
      if (fcLv) { state.fcLevelFilter = fcLv.dataset.fcLvl; state.fcIndex = 0; renderApp(); return; }

      const tPill = e.target.closest('[data-table-id]');
      if (tPill) { state.activeTableId = tPill.dataset.tableId; renderApp(); return; }

      const sj = e.target.closest('[data-search-jump]');
      if (sj) {
        const parts = sj.dataset.searchJump.split('|');
        closeSearchModal();
        if (parts[0] === 'studio') {
          state.chapterId = parts[1]; state.topicFilter = parts[2]; state.view = 'studio';
          renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          state.fcCoFilter = 'all'; state.fcLevelFilter = 'all'; state.view = 'flashcards';
          const deck = getFilteredDeck(), idx = deck.findIndex(c => c.id === parts[1]);
          state.fcIndex = idx >= 0 ? idx : 0;
          renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        return;
      }
    });

    document.getElementById('brandHomeBtn').onclick = () => {
      state.view = 'syllabus';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    document.getElementById('themeToggleBtn').onclick = () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      saveState();
    };
    document.getElementById('openSearchBtn').onclick = openSearchModal;
    document.getElementById('closeSearchBtn').onclick = closeSearchModal;
    document.getElementById('searchModal').onclick = e => { if (e.target.id === 'searchModal') closeSearchModal(); };
    document.getElementById('globalSearchInput').oninput = e => renderSearchResults(e.target.value);

    document.addEventListener('keydown', e => {
      const modalOpen = !document.getElementById('searchModal').classList.contains('hidden');
      if (e.key === 'Escape' && modalOpen) { closeSearchModal(); return; }
      if ((e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); openSearchModal(); return;
      }
      if (state.view === 'flashcards' && !modalOpen && document.activeElement.tagName !== 'INPUT') {
        if (e.code === 'Space') { e.preventDefault(); const el = document.getElementById('flashcardEl'); if (el) el.click(); }
        else if (e.key === 'ArrowRight') { const b = document.getElementById('fcNextBtn'); if (b) b.click(); }
        else if (e.key === 'ArrowLeft') { const b = document.getElementById('fcPrevBtn'); if (b) b.click(); }
        else if (e.key.toLowerCase() === 's') { const b = document.getElementById('fcShuffleBtn'); if (b) b.click(); }
      }
    });

    loadState();
    renderApp();
    window.addEventListener('load', () => { renderAllTex(document.getElementById('appMain')); refreshIcons(); });
  })();
  </script>
</body>
</html>
