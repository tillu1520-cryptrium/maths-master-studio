<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maths Master Studio — Interactive Calculus &amp; Differential Equations</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* =====================================================================
       EDITORIAL DAYLIGHT THEME (MATCHING UI/UX MASTER EDITION PDF)
       + OPTIONAL MIDNIGHT DARK MODE TOGGLE
    ===================================================================== */
    :root {
      --bg-canvas: #f3f6fc;
      --bg-header: rgba(255, 255, 255, 0.88);
      --bg-card: #ffffff;
      --bg-card-tint: #f8fafd;
      --bg-math: #f4f7fc;
      --border-card: rgba(15, 23, 42, 0.09);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --shadow-card: 0 8px 28px -10px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    html.dark {
      --bg-canvas: #070b18;
      --bg-header: rgba(11, 16, 33, 0.86);
      --bg-card: rgba(17, 24, 46, 0.92);
      --bg-card-tint: rgba(23, 33, 62, 0.72);
      --bg-math: rgba(8, 12, 26, 0.85);
      --border-card: rgba(148, 163, 184, 0.16);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --shadow-card: 0 12px 32px -12px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Elevated Editorial Cards */
    /* Enhanced Animated Logo Emblem */
    .logo-badge {
      padding: 2px;
      box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.55), 0 0 0 1px rgba(99, 102, 241, 0.25);
    }
    .logo-ring {
      background: conic-gradient(from 0deg, #6366f1, #06b6d4, #a855f7, #ec4899, #6366f1);
      animation: spinLogoRing 6s linear infinite;
      opacity: 0.9;
    }
    @keyframes spinLogoRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .ed-header {
      background: var(--bg-header);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-card);
    }
    .ed-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease, border-color 0.24s ease;
    }
    .ed-card:hover {
      border-color: rgba(79, 70, 229, 0.32);
      box-shadow: 0 14px 34px -12px rgba(79, 70, 229, 0.16);
    }
    .math-well {
      background: var(--bg-math);
      border: 1px solid var(--border-card);
      border-radius: 0.9rem;
      padding: 0.75rem 0.95rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    /* PDF-Style Shortcut & Exam Trap Callouts */
    .callout-shortcut {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.10), rgba(6, 182, 212, 0.05));
      border: 1px solid rgba(13, 148, 136, 0.26);
      border-left: 4px solid #0d9488;
    }
    .callout-trap {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.05));
      border: 1px solid rgba(234, 88, 12, 0.28);
      border-left: 4px solid #ea580c;
    }

    /* Midnight Navy Hero Banner (Matching Page 1 of UI/UX PDF) */
    .midnight-hero {
      background: radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.22), transparent 46%),
                  radial-gradient(circle at 84% 25%, rgba(16, 185, 129, 0.20), transparent 42%),
                  linear-gradient(135deg, #070b1a 0%, #0f172e 55%, #161b3a 100%);
      color: #f8fafc;
      position: relative;
      overflow: hidden;
    }

    /* Staggered Entrance */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-in { animation: cardIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Accordion */
    .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
    .accordion-body.open { grid-template-rows: 1fr; }
    .accordion-inner { overflow: hidden; }

    /* =====================================================================
       ZERO-FLICKER 3D FLASHCARD + RIFFLE SHUFFLE MOTION GRAPHICS
       Color-coded gradient top header matching Pages 10-12 of the PDF!
    ===================================================================== */
    .fc-stage {
      position: relative;
      perspective: 1500px;
      padding: 8px 6px 22px;
      touch-action: pan-y;
    }
    .fc-ghost {
      position: absolute;
      inset: 14px 16px 14px;
      border-radius: 1.5rem;
      pointer-events: none;
      transition: transform 0.46s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.34s ease;
      will-change: transform;
    }
    .fc-ghost-1 {
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.26);
      transform: translateY(10px) scale(0.96) rotate(-1.1deg);
      z-index: 1;
    }
    .fc-ghost-2 {
      background: rgba(14, 165, 233, 0.10);
      border: 1px solid rgba(14, 165, 233, 0.22);
      transform: translateY(19px) scale(0.92) rotate(1.3deg);
      z-index: 0;
    }
    .fc-stage.shuffling .fc-ghost-1 { transform: translate3d(-28px, 4px, 0) scale(0.97) rotate(-6deg); opacity: 0.95; }
    .fc-stage.shuffling .fc-ghost-2 { transform: translate3d(28px, 8px, 0) scale(0.95) rotate(6deg); opacity: 0.90; }

    .fc-card-shell {
      position: relative;
      z-index: 10;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.20s ease;
      will-change: transform, opacity;
    }
    .fc-card-shell.exit-left  { transform: translate3d(-44px, 0, 0) rotate(-2.5deg) scale(0.96); opacity: 0; }
    .fc-card-shell.exit-right { transform: translate3d(44px, 0, 0) rotate(2.5deg) scale(0.96); opacity: 0; }
    .fc-card-shell.exit-shuf  { transform: translate3d(0, -14px, 0) scale(0.93) rotate(-2deg); opacity: 0; }

    .flip-card {
      display: grid;
      width: 100%;
      min-height: 310px;
      transform-style: preserve-3d;
      transition: transform 0.56s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      will-change: transform;
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 1.5rem;
      overflow: hidden;
      min-width: 0;
    }
    .flip-back { transform: rotateY(180deg); }

    /* KaTeX Sizing & Mobile Scroll — Larger, Crystal-Clear Formula Typography */
    .katex-display { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding: 0.4rem 0.1rem; margin: 0.3rem 0 !important; max-width: 100%; }
    .katex { font-size: 1.18em !important; line-height: 1.45; }
    .math-well .katex { font-size: 1.24em !important; }
    table .katex { font-size: 1.22em !important; }
    @media (min-width: 640px) {
      .katex { font-size: 1.30em !important; }
      .math-well .katex { font-size: 1.36em !important; }
      table .katex { font-size: 1.32em !important; }
    }

    input[type="range"] { accent-color: #4f46e5; cursor: pointer; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .toast-anim { animation: toastIn 0.22s ease-out both; }
  </style>
</head>

Basics · 1M", "marks": "1M", "level": "Basic", "prompt": "Rewrite the product in sum form for convolution integration:", "promptMath": "2\\sin(a\\tau)\\sin(at - a\\tau)", "hint": "Use 2 sin A sin B = cos(A − B) − cos(A + B) with A = aτ and B = at − aτ.", "steps": [{"text": "Compute A − B and A + B:", "math": "A - B = 2a\\tau - at,\\qquad A + B = at"}, {"text": "Substitute into 2 sin A sin B = cos(A−B) − cos(A+B):", "math": "2\\sin(a\\tau)\\sin(at - a\\tau) = \\cos(2a\\tau - at) - \\cos(at)"}], "answer": "\\cos(2a\\tau - at) - \\cos(at)"}, {"id": "B2", "tag": "Ch. 0 · Basics · 1M", "marks": "1M", "level": "Basic", "prompt": "Express the hyperbolic square in linear form for Laplace transform:", "promptMath": "\\sinh^2(3t)", "hint": "Use sinh²x = (cosh 2x − 1)/2.", "steps": [{"text": "Apply the hyperbolic power-reduction identity:", "math": "\\sinh^2(3t) = \\frac{\\cosh(6t) - 1}{2}"}, {"text": "Ready for instant Laplace transform:", "math": "\\mathcal{L}\\{\\sinh^2 3t\\} = \\frac{1}{2}\\!\\left(\\frac{s}{s^2 - 36} - \\frac{1}{s}\\right) = \\frac{18}{s(s^2 - 36)}"}], "answer": "\\frac{\\cosh 6t - 1}{2}"}, {"id": "B5", "tag": "Ch. 0 · Product-to-Sum · 1M", "marks": "1M", "level": "Basic", "prompt": "Convert the product of cosines into a sum for fast Laplace transformation:", "promptMath": "2\\cos(5t)\\cos(2t)", "hint": "Use 2 cos A cos B = cos(A + B) + cos(A − B).", "steps": [{"text": "Apply product-to-sum with A = 5t, B = 2t:", "math": "2\\cos(5t)\\cos(2t) = \\cos(7t) + \\cos(3t)"}, {"text": "Laplace transform follows immediately:", "math": "\\mathcal{L}\\{\\cos 7t + \\cos 3t\\} = \\frac{s}{s^2+49} + \\frac{s}{s^2+9}"}], "answer": "\\cos(7t) + \\cos(3t)"}, {"id": "B6", "tag": "Ch. 0 · Hyperbolic · 1M", "marks": "1M", "level": "Basic", "prompt": "Linearize cosh²(2x) using the hyperbolic power-reduction identity:", "promptMath": "\\cosh^2(2x)", "hint": "Use cosh²θ = (1 + cosh 2θ)/2.", "steps": [{"text": "Substitute θ = 2x:", "math": "\\cosh^2(2x) = \\frac{1 + \\cosh(4x)}{  + 2} = \\frac{6}{3} = 2"}, {"text": "Cover (s + 2) and set s = −2:", "math": "B = \\frac{5(-2) + 1}{-2 - 1} = \\frac{-9}{-3} = 3"}], "answer": "\\frac{2}{s - 1} + \\frac{3}{s + 2}"}, {"id": "B4", "tag": "Ch. 0 · Gamma · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate the Laplace transform using the Gamma function:", "promptMath": "\\mathcal{L}\\{t^{3/2}\\}", "hint": "Γ(5/2) = (3/2)·(1/2)·Γ(1/2) = (3/4)√π.", "steps": [{"text": "Use L{t^p} = Γ(p + 1) / s^{p+1} with p = 3/2:", "math": "\\mathcal{L}\\{t^{3/2}\\} = \\frac{\\Gamma(5/2)}{s^{5/2}} = \\frac{\\frac{3}{2}\\cdot\\frac{1}{2}\\sqrt{\\pi}}{s^{5/2}}"}], "answer": "\\frac{3\\sqrt{\\pi}}{4 s^{5/2}}"}, {"id": "B7", "tag": "Ch. 0 · Exp-Trig Integral · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Evaluate directly using the standard exponential-trig integral formula:", "promptMath": "\\int e^{2x}\\sin(3x)\\,dx", "hint": "Use [e^{ax}/(a²+b²)](a sin bx − b cos bx) with a = 2, b = 3.", "steps": [{"text": "Compute a² + b² = 4 + 9 = 13 and substitute:", "math": "\\frac{e^{2x}}{13}(2\\sin 3x - 3\\cos 3x) + C"}], "answer": "\\frac{e^{2x}}{13}(2\\sin 3x - 3\\cos 3x) + C"}, {"id": "B8", "tag": "Ch. 0 · Quadratic Cover-Up · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Split into partial fractions in one line using the quadratic Cover-Up shortcut:", "promptMath": "\\frac{1}{(s^2 + 1)(s^2 + 4)}", "hint": "Use 1/[(s²+a²)(s²+b²)] = [1/(b²−a²)][1/(s²+a²) − 1/(s²+b²)].", "steps": [{"text": "Here a² = 1, b² = 4 ⇒ b² − a² = 3:", "math": "\\frac{1}{3}\\!\\left(\\frac{1}{s^2+1} - \\frac{1}{s^2+4}\\right)"}], "answer": "\\frac{1}{3}\\!\\left(\\frac{1}{s^2+1} - \\frac{1}{s^2+4}\\right)"}]}]}, {"id": "co1", "co": "CO1", "number": 1, "weightage": "4–6 Marks", "weightPct": 24, "title": "Multivariable Calculus & Series Expansions", "shortTitle": "Multivariable Calculus", "lectures": "Lectures 1–12", "refs": "T2 (Narayan & Mittal): 4.7, 6.1–6.2, 9.1–9.7, 11.3–11.6, 11.11", "accent": "violet", "accentHex": "#7c3aed", "gradCss": "linear-gradient(135deg, #5b21b6 0%, #7c3aed 55%, #9333ea 100%)", "labTitle": "3D Extrema & Saddle Surface Explorer", "labDesc": "Rotate z = x² + ky² and cubic saddles in real time while tracking r, s, t and rt − s².", "topics": [{"id": "t1_1", "code": "1.1", "title": "2D Limits, Continuity, Partial Derivatives, Chain Rule & Euler’s Theorem", "summary": "Path-dependence tests for 2D limits, higher-order mixed partials, total differentials, and Euler’s theorem for homogeneous functions.", "formulas": [{"id": "f1_1_1", "name": "2D Limit Path Test (Non-Existence)", "math": "\\lim_{(x,y)\\to(0,0)} f(x,y) \\text{ DNE if } \\lim_{x\\to 0} f(x,mx) \\text{ depends on } m", "note": "Test y = mx first; if independent of m, test y = kx² or polar coordinates (x = r cos θ, y = r sin θ).", "trick": "Same total degree in numerator & denominator ⇒ y = mx almost always exposes slope dependence.", "trap": false}, {"id": "f1_1_2", "name": "Total Derivative & Chain Rule", "math": "\\frac{du}{dt} = \\frac{\\partial u}{\\partial x}\\frac{dx}{dt} + \\frac{\\partial u}{\\partial y}\\frac{dy}{dt}, \\qquad dz = f_x\\,dx + f_y\\,dy", "note": "For implicit F(x,y)=0: dy/dx = −F_x/F_y (F_y ≠ 0). Schwarz’s theorem: f_xy = f_yx when continuous.", "trick": "Sketch a 2-second dependency tree before differentiating composite functions.", "trap": false}, {"id": "f1_1_3", "name": "Euler’s Theorem for Homogeneous Functions", "math": "f(tx,ty)=t^n f(x,y) \\implies x\\frac{\\partial f}{\\partial x} + y\\frac{\\partial f}{\\partial y} = n\\,f(x,y)", "note": "Composite corollary: if z = g(u) is homogeneous of degree n, then x u_x + y u_y = n g(u)/g′(u).", "trick": "For u = sin⁻¹((x²+y²)/(x+y)), z = sin u has degree n = 2 − 1 = 1 ⇒ xu_x + yu_y = tan u instantly!", "trap": false}], "steps": ["For 2D limits, substitute y = mx (and y = kx² if needed) to test path independence.", "For cyclic/symmetric functions u(x,y,z), compute u_x first and obtain u_y, u_z by cyclic permutation.", "For Euler’s theorem, isolate the homogeneous part z = g(u), find degree n = deg(num) − deg(den), and apply n·g(u)/g′(u)."], "questions": [{"id": "Q1", "tag": "Set 1 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate the 2D limit and justify whether it exists:", "promptMath": "\\lim_{(x,y)\\to(0,0)} \\frac{x^2 - y^2}{x^2 + y^2}", "hint": "Approach (0,0) along the family of lines y = mx.", "steps": [{"text": "Substitute y = mx as x → 0:", "math": "\\lim_{x\\to 0}\\frac{x^2 - m^2 x^2}{x^2 + m^2 x^2} = \\frac{1 - m^2}{1 + m^2}"}, {"text": "For m = 0 the limit is 1; for m = 1 it is 0. Since the result depends on m, the 2D limit does not exist (DNE)."}], "answer": "\\text{Does Not Exist (path-dependent: } \\frac{1-m^2}{1+m^2}\\text{)}"}, {"id": "Q2", "tag": "Set 3 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the sum of first-order partial derivatives at (1, 1, 1):", "promptMath": "u = x^2 y + y^2 z + z^2 x \\implies \\left.\\left(\\frac{\\partial u}{\\partial x} + \\frac{\\partial u}{\\partial y} + \\frac{\\partial u}{\\partial z}\\right)\\right|_{(1,1,1)}", "hint": "Compute u_x, u_y, u_z cyclically and sum them to form (x + y + z)².", "steps": [{"text": "Compute partial derivatives:", "math": "u_x = 2xy + z^2,\\qquad u_y = x^2 + 2yz,\\qquad u_z = y^2 + 2zx"}, {"text": "Add all three:", "math": "u_x + u_y + u_z = (x + y + z)^2 \\xrightarrow{(1,1,1)} 3^2 = 9"}], "answer": "9"}, {"id": "Q3", "tag": "Set 6 · Q.1(d) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Using Euler’s Theorem, evaluate x u_x + y u_y for:", "promptMath": "u = \\sin^{-1}\\!\\left(\\frac{x^2 + y^2}{x + y}\\right)", "hint": "Set z = sin u (homogeneous of degree n = 1) and apply Euler’s corollary.", "steps": [{"text": "Isolate the homogeneous part:", "math": "z = \\sin u = \\frac{x^2+y^2}{x+y} \\implies n = 2 - 1 = 1"}, {"text": "Apply Euler’s corollary:", "math": "x u_x + y u_y = n\\,\\frac{\\sin u}{\\cos u} = \\tan u"}], "answer": "x u_x + y u_y = \\tan u"}, {"id": "K1_1", "tag": "T2 · Euler Corollary · 4M", "marks": "4M", "level": "Advanced", "prompt": "Show that x u_x + y u_y = sin 2u for:", "promptMath": "u = \\tan^{-1}\\!\\left(\\frac{x^3 + y^3}{x - y}\\right)", "hint": "Take z = tan u (degree n = 3 − 1 = 2) and simplify 2 tan u / sec²u.", "steps": [{"text": "Check homogeneity of z = tan u:", "math": "z(tx,ty) = \\frac{t^3(x^3+y^3)}{t(x-y)} = t^2 z(x,y) \\implies n = 2"}, {"text": "Apply Euler’s corollary:", "math": "x u_x + y u_y = 2\\,\\frac{\\tan u}{\\sec^2 u} = 2\\sin u\\cos u = \\sin 2u"}], "answer": "x u_x + y u_y = \\sin 2u"}, {"id": "Q1b", "tag": "Topic 1.1 · Parabolic Path · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Show that the 2D limit does not exist even though every straight-line path y = mx gives 0:", "promptMath": "\\lim_{(x,y)\\to(0,0)} \\frac{x^2 y}{x^4 + y^2}", "hint": "Test along the parabolic path y = k x².", "steps": [{"text": "Along y = mx: lim_{x→0} (mx³)/(x⁴+m²x²) = lim_{x→0} (mx)/(x²+m²) = 0."}, {"text": "Along y = k x²:", "math": "\\lim_{x\\to 0}\\frac{k x^4}{x^4 + k^2 x^4} = \\frac{k}{1 + k^2} \\quad (\\text{depends on } k \\implies \\text{DNE})"}], "answer": "\\text{Limit does not exist (equals } \\frac{k}{1+k^2} \\text{ along } y = kx^2\\text{)}"}, {"id": "Q2b", "tag": "Topic 1.1 · Chain Rule · 1M", "marks": "1M", "level": "Basic", "prompt": "Find du/dt using the multivariable Chain Rule for:", "promptMath": "u = x^2 + y^2,\\qquad x = \\cos t,\\quad y = \\sin t", "hint": "du/dt = u_x x′ + u_y y′.", "steps": [{"text": "Differentiate and substitute:", "math": "\\frac{du}{dt} = (2x)(-\\sin t) + (2y)(\\cos t) = -2\\cos t\\sin t + 2\\sin t\\cos t = 0"}], "answer": "\\frac{du}{dt} = 0 \\quad (\\text{since } u = \\cos^2 t + \\sin^2 t \\equiv 1)"}]}, {"id": "t1_2", "code": "1.2", "title": "Taylor’s & Maclaurin’s Series (1D & 2D Expansions)", "summary": "1D Maclaurin building blocks, shifted polynomial expansions in (x−a), (y−b), and 2D Taylor expansions.", "formulas": [{"id": "f1_2_1", "name": "2D Taylor’s Series about (a, b)", "math": "f(a+h,b+k) = f(a,b) + (h f_x + k f_y) + \\frac{1}{2!}(h^2 f_{xx} + 2hk f_{xy} + k^2 f_{yy}) + \\frac{1}{3!}(h\\partial_x + k\\partial_y)^3 f + \\cdots", "note": "Set h = x − a, k = y − b. For Maclaurin series, expand about (0, 0).", "trick": "If f(x,y) = g(x)·h(y), multiply the 1D Maclaurin series directly—3× faster than 10 partial derivatives!", "trap": false}, {"id": "f1_2_2", "name": "Essential 1D Maclaurin Series", "math": "e^x = \\sum_{n=0}^{\\infty}\\frac{x^n}{n!},\\quad \\sin x = x - \\frac{x^3}{3!} + \\frac{x^5}{5!} - \\cdots,\\quad \\ln(1+y) = y - \\frac{y^2}{2} + \\frac{y^3}{3} - \\cdots", "note": "Also: cosh x = 1 + x²/2! + x⁴/4! + ⋯ and sinh x = x + x³/3! + x⁵/5! + ⋯.", "trick": "For polynomials about (a, b), substitute x = a + h, y = b + k and expand algebraically!", "trap": false}], "steps": ["If f(x,y) is a polynomial, substitute x = a + h, y = b + k and expand algebraically.", "If f(x,y) = g(x)·h(y), multiply their 1D Maclaurin series and retain terms up to the required total degree.", "Otherwise evaluate partial derivatives at (a, b) and plug into the 2D Taylor operator formula."], "questions": [{"id": "Q4", "tag": "Set 2 · Q.1(g) · 1M", "marks": "1M", "level": "Basic", "prompt": "Write the first three non-zero terms of the Maclaurin series of:", "promptMath": "f(x) = \\cosh x", "hint": "Average e^x and e^{−x} so all odd powers cancel.", "steps": [{"text": "Use cosh x = (e^x + e^{−x})/2:", "math": "\\cosh x = 1 + \\frac{x^2}{2!} + \\frac{x^4}{4!} + \\cdots"}], "answer": "1 + \\frac{x^2}{2!} + \\frac{x^4}{4!} + \\cdots"}, {"id": "Q5", "tag": "Set 8 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "Expand in powers of x and y up to third-degree terms:", "promptMath": "f(x,y) = e^x \\sin y", "hint": "Multiply 1D Maclaurin series of e^x and sin y.", "steps": [{"text": "Multiply 1D expansions keeping total degree ≤ 3:", "math": "\\left(1 + x + \\frac{x^2}{2}\\right)\\left(y - \\frac{y^3}{6}\\right) \\approx y + xy + \\frac{1}{2}x^2 y - \\frac{1}{6}y^3"}], "answer": "y + xy + \\frac{1}{2}x^2 y - \\frac{1}{6}y^3"}, {"id": "Q6", "tag": "Set 9 · Q.1(d) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Expand the polynomial in powers of (x − 1) and (y + 2):", "promptMath": "f(x,y) = x^2 y + 3y - 2", "hint": "Put x = 1 + h and y = −2 + k where h = x − 1, k = y + 2.", "steps": [{"text": "Substitute x = 1 + h, y = −2 + k:", "math": "f = (1 + 2h + h^2)(-2 + k) + 3(-2 + k) - 2 = -10 - 4h + 4k - 2h^2 + 2hk + h^2 k"}], "answer": "-10 - 4(x-1) + 4(y+2) - 2(x-1)^2 + 2(x-1)(y+2) + (x-1)^2(y+2)"}, {"id": "Q7", "tag": "Set 7 · Q.3(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Obtain the 2D Taylor series about (0, 0) up to degree 3:", "promptMath": "f(x,y) = e^x \\ln(1 + y)", "hint": "Multiply e^x = 1 + x + x²/2 + ⋯ with ln(1+y) = y − y²/2 + y³/3 − ⋯.", "steps": [{"text": "Expand each 1D factor up to degree 3:", "math": "\\left(1 + x + \\frac{x^2}{2}\\right)\\left(y - \\frac{y^2}{2} + \\frac{y^3}{3}\\right)"}, {"text": "Collect terms with total degree ≤ 3:", "math": "y + xy - \\frac{1}{2}y^2 + \\frac{1}{2}x^2 y - \\frac{1}{2}xy^2 + \\frac{1}{3}y^3"}], "answer": "y + xy - \\frac{1}{2}y^2 + \\frac{1}{2}x^2 y - \\frac{1}{2}xy^2 + \\frac{1}{3}y^3"}, {"id": "Q4b", "tag": "Topic 1.2 · Maclaurin · 1M", "marks": "1M", "level": "Basic", "prompt": "Write the first three non-zero terms of the Maclaurin series of:", "promptMath": "f(x) = \\sinh x", "hint": "Subtract e^{−x} from e^x and divide by 2.", "steps": [{"text": "Only odd powers survive with positive signs:", "math": "\\sinh x = x + \\frac{x^3}{3!} + \\frac{x^5}{5!} + \\cdots"}], "answer": "x + \\frac{x^3}{3!} + \\frac{x^5}{5!} + \\cdots"}, {"id": "Q6b", "tag": "Topic 1.2 · 2D Taylor · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Expand in powers of (x − 1) and (y − 1):", "promptMath": "f(x,y) = x^2 + xy + y^2", "hint": "Substitute x = 1 + h and y = 1 + k where h = x − 1, k = y − 1.", "steps": [{"text": "Expand algebraically:", "math": "(1+h)^2 + (1+h)(1+k) + (1+k)^2 = 3 + 3h + 3k + h^2 + hk + k^2"}], "answer": "3 + 3(x-1) + 3(y-1) + (x-1)^2 + (x-1)(y-1) + (y-1)^2"}]}, {"id": "t1_3", "code": "1.3", "title": "Maxima, Minima, Saddle Points & Lagrange Multipliers", "summary": "Unconstrained extrema via the Δ = rt − s² test and constrained optimization using Lagrange’s multiplier λ.", "formulas": [{"id": "f1_3_1", "name": "2D Second Derivative Test (Δ = rt − s²)", "math": "r = f_{xx},\\; s = f_{xy},\\; t = f_{yy},\\; \\Delta = rt - s^2 \\quad \\text{at } (f_x=0,\\,f_y=0)", "note": "Δ > 0 & r > 0 ⇒ Local Min; Δ > 0 & r < 0 ⇒ Local Max; Δ < 0 ⇒ Saddle; Δ = 0 ⇒ Inconclusive.", "trick": "Δ < 0 is ALWAYS a Saddle Point regardless of the sign of r!", "trap": false}, {"id": "f1_3_2", "name": "Lagrange’s Method of Undetermined Multipliers", "math": "F(x,y,z,\\lambda) = f(x,y,z) + \\lambda\\,\\phi(x,y,z) \\implies F_x = F_y = F_z = 0,\\; \\phi(x,y,z) = 0", "note": "Ideal for box volume optimization and shortest distance from a point to a plane/surface.", "trick": "Shortest distance from (0,0,0) to ax + by + cz = d is |d|/√(a²+b²+c²) — instant check!", "trap": false}], "steps": ["Solve f_x = 0 and f_y = 0 simultaneously to list all stationary points.", "Compute r, s, t and Δ = rt − s² at each stationary point to classify Min / Max / Saddle.", "For constrained extrema, form F = f + λφ, set ∇F = 0, eliminate λ, and substitute back into φ = 0."], "questions": [{"id": "Q8", "tag": "Set 4 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "State the necessary and sufficient conditions (rt − s² test) for f(x,y) to have a saddle point at (a, b).", "promptMath": "", "hint": "Stationary point + negative Hessian determinant.", "steps": [{"text": "Necessary condition (stationary point):", "math": "f_x(a,b) = 0 \\quad \\text{and} \\quad f_y(a,b) = 0"}, {"text": "Sufficient condition for a saddle point:", "math": "\\Delta = rt - s^2 = f_{xx}f_{yy} - (f_{xy})^2 < 0"}], "answer": "f_x(a,b)=f_y(a,b)=0 \\text{ and } rt - s^2 < 0"}, {"id": "Q10", "tag": "Set 7 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the shortest distance from the origin (0, 0, 0) to the plane:", "promptMath": "x + 2y + 2z = 9", "hint": "Minimize d² = x² + y² + z² subject to x + 2y + 2z = 9.", "steps": [{"text": "Lagrange multipliers give 2x = −λ, 2y = −2λ, 2z = −2λ ⇒ y = 2x, z = 2x.", "math": "x + 4x + 4x = 9 \\implies (x,y,z) = (1, 2, 2)"}, {"text": "Compute Euclidean distance:", "math": "d = \\sqrt{1^2 + 2^2 + 2^2} = 3"}], "answer": "d_{\\min} = 3"}, {"id": "Q12", "tag": "Set 6 · Q.3(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the dimensions of an open-top rectangular box of maximum volume with surface area 108 cm².", "promptMath": "\\max V = xyz \\quad \\text{subject to} \\quad xy + 2yz + 2zx = 108", "hint": "Form F = xyz + λ(xy + 2yz + 2zx − 108) and compare xF_x = yF_y = zF_z.", "steps": [{"text": "Set F_x = F_y = F_z = 0 and compare xF_x = yF_y = zF_z:", "math": "x = y = 2z"}, {"text": "Substitute into surface area constraint:", "math": "4z^2 + 4z^2 + 4z^2 = 108 \\implies z = 3,\\; x = 6,\\; y = 6"}], "answer": "x = 6\\text{ cm},\\; y = 6\\text{ cm},\\; z = 3\\text{ cm},\\; V_{\\max} = 108\\text{ cm}^3"}, {"id": "Q13", "tag": "Set 8 · Q.3(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Find and classify all extreme values and saddle points (for a > 0):", "promptMath": "f(x,y) = x^3 + y^3 - 3axy", "hint": "Stationary points are (0, 0) and (a, a).", "steps": [{"text": "Solve f_x = 3x² − 3ay = 0 and f_y = 3y² − 3ax = 0:", "math": "(x,y) = (0,0) \\text{ and } (a,a);\\qquad r = 6x,\\; s = -3a,\\; t = 6y"}, {"text": "At (0,0): Δ = −9a² < 0 ⇒ Saddle. At (a,a): r = 6a > 0, Δ = 27a² > 0 ⇒ Local Min.", "math": "f(a,a) = a^3 + a^3 - 3a^3 = -a^3"}], "answer": "(0,0)\\text{ Saddle; }(a,a)\\text{ Local Min } f_{\\min} = -a^3"}, {"id": "Q9", "tag": "Set 5 · Q.1(d) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find and classify the stationary point of:", "promptMath": "f(x,y) = x^2 + y^2 - 4x + 6y + 13", "hint": "Set f_x = 2x − 4 = 0 and f_y = 2y + 6 = 0.", "steps": [{"text": "Stationary point (2, −3); r = 2 > 0, s = 0, t = 2 ⇒ Δ = 4 > 0:", "math": "f(2,-3) = 4 + 9 - 8 - 18 + 13 = 0 \\quad (\\text{Local Min})"}], "answer": "(2, -3)\\text{ is a Local Minimum with } f_{\\min} = 0"}, {"id": "Q14", "tag": "Topic 1.3 · Lagrange · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the maximum value of f(x, y) = xy subject to the constraint x + y = 10 using Lagrange multipliers.", "promptMath": "\\max f(x,y) = xy \\quad \\text{subject to} \\quad x + y - 10 = 0", "hint": "F = xy + λ(x + y − 10) ⇒ y + λ = 0 and x + λ = 0 ⇒ x = y.", "steps": [{"text": "Equate F_x = F_y = 0 ⇒ x = y = −λ:", "math": "x + x = 10 \\implies x = 5,\\; y = 5 \\implies f_{\\max} = 25"}], "answer": "x = 5,\\; y = 5,\\quad f_{\\max} = 25"}]}]}, {"id": "co2", "co": "CO2", "number": 2, "weightage": "5–9 Marks", "weightPct": 38, "title": "First-Order Ordinary Differential Equations", "shortTitle": "1st-Order ODEs", "lectures": "Lectures 13–22", "refs": "T1 (Kreyszig): Sec. 1.1, 1.3, 1.4, 1.5", "accent": "teal", "accentHex": "#0d9488", "gradCss": "linear-gradient(135deg, #115e59 0%, #0d9488 55%, #0891b2 100%)", "labTitle": "Direction Field & Integral Curve Flow Lab", "labDesc": "Watch RK4 flow particles trace separable, exact, linear, and Bernoulli ODEs—tap anywhere to seed an IVP.", "topics": [{"id": "t2_1", "code": "2.1", "title": "Formation, Separable, Homogeneous & Reducible-to-Homogeneous ODEs", "summary": "Eliminating arbitrary constants, separating variables, y = ux substitution, and shifting linear fractional ODEs.", "formulas": [{"id": "f2_1_1", "name": "Separable & Homogeneous ODEs", "math": "g(y)\\,dy = f(x)\\,dx; \\qquad y' = f\\!\\left(\\frac{y}{x}\\right) \\xrightarrow{y=ux} x\\frac{du}{dx} = f(u) - u", "note": "Check total degree of every term in M(x,y) and N(x,y). Equal degree ⇒ homogeneous.", "trick": "Use x = vy instead of y = ux whenever x/y is simpler than y/x!", "trap": false}, {"id": "f2_1_2", "name": "Reducible-to-Homogeneous (Axis Shift)", "math": "\\frac{dy}{dx} = \\frac{a_1 x + b_1 y + c_1}{a_2 x + b_2 y + c_2} \\implies x = X + h,\\; y = Y + k", "note": "If a₁b₂ = a₂b₁ (parallel lines), substitute z = a₁x + b₁y directly to make it separable.", "trick": "Always check a₁b₂ − a₂b₁ first to decide between axis shift and parallel substitution!", "trap": false}], "steps": ["Test separability first: group all y-terms with dy and x-terms with dx.", "Check homogeneity: replace (x,y) → (tx,ty). If t cancels, put y = ux (or x = vy).", "For non-homogeneous linear fractions, shift origin to the intersection (h, k)."], "questions": [{"id": "Q16", "tag": "Set 4 · Q.1(b) · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve the separable ODE:", "promptMath": "\\frac{dy}{dx} = e^{3x + 2y}", "hint": "Split e^{3x+2y} = e^{3x}·e^{2y}.", "steps": [{"text": "Separate variables and integrate:", "math": "e^{-2y}\\,dy = e^{3x}\\,dx \\implies -\\frac{1}{2}e^{-2y} = \\frac{1}{3}e^{3x} + C"}], "answer": "2e^{3x} + 3e^{-2y} = C_1"}, {"id": "Q17", "tag": "Set 5 · Q.1(e) · 1M", "marks": "1M", "level": "Basic", "prompt": "Formulate the ODE by eliminating the arbitrary constant c from:", "promptMath": "y = cx + c^2", "hint": "Differentiate once to get y′ = c and substitute back.", "steps": [{"text": "Differentiate w.r.t. x to get y′ = c, then replace c by y′:", "math": "y = x y' + (y')^2"}], "answer": "y = x y' + (y')^2"}, {"id": "Q19", "tag": "Set 5 · Q.2(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the general solution of the homogeneous ODE:", "promptMath": "x^2 y\\,dx - (x^3 + y^3)\\,dy = 0", "hint": "Substitute x = vy (degree 3 homogeneous).", "steps": [{"text": "Put x = vy, dx = v dy + y dv:", "math": "v^2 y\\,dv = dy \\implies \\frac{v^3}{3} = \\ln|y| + C_0"}, {"text": "Back-substitute v = x/y:", "math": "\\frac{x^3}{3y^3} = \\ln|y| + C_0 \\implies y e^{-x^3/(3y^3)} = C"}], "answer": "y\\,e^{-x^3/(3y^3)} = C"}, {"id": "Q20", "tag": "Set 10 · Q.2(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Reduce to homogeneous form and solve:", "promptMath": "(x + 2y - 3)\\,dx - (2x + y - 3)\\,dy = 0", "hint": "Both lines intersect at (1, 1) ⇒ put x = X + 1, y = Y + 1.", "steps": [{"text": "Shift to (1,1) and put Y = vX:", "math": "\\frac{dY}{dX} = \\frac{X+2Y}{2X+Y} \\implies \\int\\frac{2+v}{1-v^2}\\,dv = \\int\\frac{dX}{X}"}, {"text": "Integrate via partial fractions:", "math": "\\frac{1}{2}\\ln|1+v| - \\frac{3}{2}\\ln|1-v| = \\ln|X| + c \\implies (X - Y)^3 = C(X + Y)"}], "answer": "(x - y)^3 = C(x + y - 2)"}, {"id": "Q18", "tag": "Set 10 · Q.1(e) · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve by separating variables:", "promptMath": "y' - 2xy = 0", "hint": "dy/y = 2x dx ⇒ ln|y| = x² + c.", "steps": [{"text": "Separate and integrate:", "math": "\\int\\frac{dy}{y} = \\int 2x\\,dx \\implies \\ln|y| = x^2 + c \\implies y = C e^{x^2}"}], "answer": "y(x) = C e^{x^2}"}, {"id": "Q19b", "tag": "Topic 2.1 · Homogeneous · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the homogeneous ODE:", "promptMath": "(x + y)\\,dx - x\\,dy = 0", "hint": "Rewrite as y′ = 1 + y/x and substitute y = ux.", "steps": [{"text": "Put y = ux ⇒ u + xu′ = 1 + u ⇒ xu′ = 1:", "math": "du = \\frac{dx}{x} \\implies u = \\ln|x| + C \\implies y = x(\\ln|x| + C)"}], "answer": "y = x(\\ln|x| + C)"}, {"id": "Q20b", "tag": "Topic 2.1 · Parallel Reducible · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the parallel-line reducible ODE:", "promptMath": "\\frac{dy}{dx} = \\frac{x + y + 1}{x + y - 1}", "hint": "Lines are parallel (a₁/a₂ = b₁/b₂ = 1) ⇒ put z = x + y.", "steps": [{"text": "Set z = x + y ⇒ z′ = 1 + y′ = 1 + (z+1)/(z−1) = 2z/(z−1):", "math": "\\int\\frac{z-1}{2z}\\,dz = \\int dx \\implies \\frac{z}{2} - \\frac{1}{2}\\ln|z| = x + C"}], "answer": "y - x - \\ln|x + y| = C_1"}]}, {"id": "t2_2", "code": "2.2", "title": "Exact ODEs & All 4 Integrating Factor Rules (Sec. 1.4)", "summary": "Exactness test M_y = N_x, direct integration, and all 4 I.F. rules from the Master Formula Sheet.", "formulas": [{"id": "f2_2_1", "name": "Exactness Test & Solution Formula", "math": "M_y = N_x \\implies \\int_{y=\\text{const}} M\\,dx + \\int (\\text{terms in } N \\text{ free of } x)\\,dy = C", "note": "Drop every term in N containing x in the second integral to avoid double-counting.", "trick": "Verify your final u(x,y) = C by checking u_x = M and u_y = N!", "trap": false}, {"id": "f2_2_2", "name": "All 4 Non-Exact Integrating Factor Rules", "math": "\\frac{M_y - N_x}{N} = f(x) \\implies e^{\\int f\\,dx};\\qquad \\frac{N_x - M_y}{M} = g(y) \\implies e^{\\int g\\,dy};\\qquad \\text{Homog. } \\implies \\frac{1}{Mx+Ny}", "note": "Rule 4 (Exponential Inspection): if terms contain e^{x+y} alongside x or y, try multiplying by e^{−x} or e^{−y} first!", "trick": "Divide by whichever of M or N has fewer terms first to spot the I.F. in 5 seconds.", "trap": false}], "steps": ["Compute M_y and N_x from M dx + N dy = 0.", "If M_y = N_x, integrate M w.r.t. x + x-free terms of N w.r.t. y.", "If not exact, test Rules 1–4, multiply through by the I.F., and integrate as exact."], "questions": [{"id": "Q21", "tag": "Set 1 · Q.1(e) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find k so that the differential equation is exact:", "promptMath": "(x^3 + 3xy^2)\\,dx + (kx^2y + y^3)\\,dy = 0", "hint": "Set M_y = N_x.", "steps": [{"text": "Equate partial derivatives:", "math": "M_y = 6xy,\\quad N_x = 2kxy \\implies 6xy = 2kxy \\implies k = 3"}], "answer": "k = 3"}, {"id": "Q28", "tag": "Set 9 · Q.2(b) · 4M", "marks": "4M", "level": "Basic", "prompt": "Verify exactness and solve:", "promptMath": "(y\\cos x + 2xe^y)\\,dx + (\\sin x + x^2e^y - 1)\\,dy = 0", "hint": "Check M_y = N_x = cos x + 2xe^y, then drop x-terms in N.", "steps": [{"text": "Exactness holds since M_y = cos x + 2xe^y = N_x.", "math": "\\int (y\\cos x + 2xe^y)\\,dx + \\int (-1)\\,dy = C"}], "answer": "y\\sin x + x^2 e^y - y = C"}, {"id": "Q25", "tag": "Set 5 · Q.3(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find an integrating factor and solve:", "promptMath": "(x^2 + y^2 + x)\\,dx + xy\\,dy = 0", "hint": "Rule 1: (M_y − N_x)/N = (2y − y)/(xy) = 1/x ⇒ I.F. = x.", "steps": [{"text": "Compute I.F. = e^{∫(1/x)dx} = x and multiply:", "math": "(x^3 + xy^2 + x^2)\\,dx + x^2y\\,dy = 0"}, {"text": "Integrate the exact ODE:", "math": "\\frac{x^4}{4} + \\frac{x^2 y^2}{2} + \\frac{x^3}{3} = C"}], "answer": "\\frac{x^4}{4} + \\frac{x^3}{3} + \\frac{x^2 y^2}{2} = C"}, {"id": "Q23", "tag": "Set 1 · Q.3(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Test for exactness, find an I.F., and solve:", "promptMath": "(ye^x + 1)\\,dx + (e^{x+y} + xe^x)\\,dy = 0", "hint": "Rule 4 (Exponential Inspection) or Rule 1 gives I.F. = e^{−x}.", "steps": [{"text": "Multiply by I.F. = e^{−x}:", "math": "(y + e^{-x})\\,dx + (e^y + x)\\,dy = 0 \\quad (\\text{Exact!})"}, {"text": "Integrate:", "math": "xy - e^{-x} + e^y = C"}], "answer": "xy - e^{-x} + e^y = C"}, {"id": "Q22", "tag": "Topic 2.2 · Exact · 1M", "marks": "1M", "level": "Basic", "prompt": "Verify exactness and solve:", "promptMath": "(2xy + 3)\\,dx + (x^2 - 1)\\,dy = 0", "hint": "M_y = 2x = N_x (exact!).", "steps": [{"text": "Integrate M w.r.t. x and x-free terms of N (−1) w.r.t. y:", "math": "x^2 y + 3x - y = C"}], "answer": "x^2 y + 3x - y = C"}, {"id": "Q26", "tag": "Topic 2.2 · I.F. Rule 2 (in y) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find an integrating factor depending on y and solve:", "promptMath": "y\\,dx + (2x - y e^y)\\,dy = 0", "hint": "R*(y) = (N_x − M_y)/M = (2 − 1)/y = 1/y ⇒ I.F. = y.", "steps": [{"text": "Multiply by I.F. = y to get y² dx + (2xy − y² e^y) dy = 0 (exact!)."}, {"text": "Integrate (using parts on ∫ y² e^y dy):", "math": "x y^2 - (y^2 - 2y + 2)e^y = C"}], "answer": "x y^2 - (y^2 - 2y + 2)e^y = C"}, {"id": "Q27", "tag": "Topic 2.2 · I.F. Rule 1 · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find an integrating factor and solve:", "promptMath": "(x^2 + y^2)\\,dx - 2xy\\,dy = 0", "hint": "R(x) = (M_y − N_x)/N = (2y − (−2y))/(−2xy) = −2/x ⇒ I.F. = x^{−2}.", "steps": [{"text": "Multiply by x^{−2} ⇒ (1 + y²/x²)dx − (2y/x)dy = 0 (exact!):", "math": "x - \\frac{y^2}{x} = C \\implies x^2 - y^2 = Cx"}], "answer": "x^2 - y^2 = Cx"}]}, {"id": "t2_3", "code": "2.3", "title": "First-Order Linear ODEs & Bernoulli’s Equation (Sec. 1.5)", "summary": "Standard linear ODEs with I.F. = e^{∫p dx} and Bernoulli’s nonlinear reduction u = y^{1−n}.", "formulas": [{"id": "f2_3_1", "name": "First-Order Linear ODE (Kreyszig Formula 4)", "math": "y' + P(x)y = Q(x) \\implies \\text{I.F.} = e^{\\int P(x)\\,dx},\\qquad y\\cdot(\\text{I.F.}) = \\int Q(x)\\cdot(\\text{I.F.})\\,dx + C", "note": "Always divide by the coefficient of y′ first to reach standard form!", "trick": "If nonlinear in y, check if dx/dy + P(y)x = Q(y) is linear in x!", "trap": false}, {"id": "f2_3_2", "name": "Bernoulli’s Equation Linearization", "math": "y' + P(x)y = Q(x)y^n \\xrightarrow{u = y^{1-n}} u' + (1-n)P(x)u = (1-n)Q(x)", "note": "Divide by y^n first, then substitute u = y^{1−n}.", "trick": "Remember the (1 − n) factor multiplies BOTH P(x) and Q(x)!", "trap": true}], "steps": ["Normalize coefficient of y′ to 1.", "If RHS has y^n, divide by y^n and set u = y^{1−n}.", "Compute I.F. = e^{∫P dx}, integrate d/dx(u·I.F.) = Q·I.F., and apply any IC."], "questions": [{"id": "Q29", "tag": "Set 2 · Q.1(f) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the integrating factor of the linear ODE:", "promptMath": "\\sin x\\,\\frac{dy}{dx} + y\\cos x = 1", "hint": "Divide by sin x first so P(x) = cot x.", "steps": [{"text": "Normalize and compute I.F.:", "math": "y' + (\\cot x)y = \\csc x \\implies \\text{I.F.} = e^{\\int \\cot x\\,dx} = \\sin x"}], "answer": "\\text{I.F.} = \\sin x"}, {"id": "Q33", "tag": "Set 3 · Q.3(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the Bernoulli equation:", "promptMath": "y' + xy = x y^{-1}", "hint": "n = −1 ⇒ u = y² ⇒ u′ + 2xu = 2x.", "steps": [{"text": "Multiply by 2y and set u = y²:", "math": "u' + 2xu = 2x \\implies \\text{I.F.} = e^{x^2}"}, {"text": "Integrate:", "math": "u e^{x^2} = e^{x^2} + C \\implies y^2 = 1 + C e^{-x^2}"}], "answer": "y^2 = 1 + C e^{-x^2}"}, {"id": "Q31", "tag": "Set 1 · Q.2(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the initial value problem:", "promptMath": "2xyy' + (x - 1)y^2 = x^2 e^x, \\qquad y(1) = 0", "hint": "Set u = y² so u′ = 2yy′ ⇒ u′ + (1 − 1/x)u = x e^x.", "steps": [{"text": "Divide by x and put u = y²:", "math": "u' + \\left(1 - \\frac{1}{x}\\right)u = x e^x \\implies \\text{I.F.} = \\frac{e^x}{x}"}, {"text": "Integrate and apply y(1) = 0:", "math": "u\\frac{e^x}{x} = \\frac{1}{2}e^{2x} - \\frac{1}{2}e^2 \\implies y^2 = \\frac{1}{2}x(e^x - e^{2-x})"}], "answer": "y^2 = \\frac{1}{2}x(e^x - e^{2-x})"}, {"id": "Q37", "tag": "Set 10 · Q.3(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the Bernoulli equation:", "promptMath": "y' + \\frac{y}{x} = x^2 y^4", "hint": "n = 4 ⇒ u = y^{−3}.", "steps": [{"text": "Set u = y^{−3} ⇒ u′ − (3/x)u = −3x² with I.F. = x^{−3}:", "math": "u x^{-3} = -3\\ln|x| + C"}], "answer": "y^{-3} = x^3(C - 3\\ln|x|)"}, {"id": "Q30", "tag": "Set 8 · Q.1(e) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the integrating factor of the linear ODE:", "promptMath": "\\frac{dy}{dx} + \\frac{2}{x}y = x\\ln x", "hint": "P(x) = 2/x ⇒ e^{∫(2/x)dx}.", "steps": [{"text": "Compute I.F.:", "math": "\\text{I.F.} = e^{2\\ln x} = x^2"}], "answer": "\\text{I.F.} = x^2"}, {"id": "Q30b", "tag": "Topic 2.3 · Linear IVP · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve the linear initial value problem:", "promptMath": "y' + 2y = 4, \\qquad y(0) = 1", "hint": "I.F. = e^{2x} ⇒ y = 2 + C e^{−2x}.", "steps": [{"text": "Integrate and apply y(0) = 1:", "math": "y e^{2x} = 2e^{2x} + C \\implies 1 = 2 + C \\implies C = -1"}], "answer": "y(x) = 2 - e^{-2x}"}, {"id": "Q32", "tag": "Set 2 · Q.2(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the Bernoulli IVP:", "promptMath": "2xyy' - 3y^2 = x^2, \\qquad y(1) = 2", "hint": "Put u = y² ⇒ u′ − (3/x)u = x with I.F. = x^{−3}.", "steps": [{"text": "Linearize with u = y² and I.F. = x^{−3}:", "math": "\\frac{d}{dx}(ux^{-3}) = x^{-2} \\implies ux^{-3} = -x^{-1} + C \\implies y^2 = Cx^3 - x^2"}, {"text": "Apply y(1) = 2 ⇒ 4 = C − 1 ⇒ C = 5:", "math": "y^2 = 5x^3 - x^2"}], "answer": "y^2 = 5x^3 - x^2"}]}]}, {"id": "co3", "co": "CO3", "number": 3, "weightage": "9 Marks", "weightPct": 50, "title": "Mathematical Modeling with First-Order ODEs", "shortTitle": "1st-Order Modeling", "lectures": "Lectures 23–24", "refs": "T1 (Kreyszig): Sec. 1.3 & 1.5", "accent": "amber", "accentHex": "#d97706", "gradCss": "linear-gradient(135deg, #9a3412 0%, #c2410c 50%, #d97706 100%)", "labTitle": "Mixing Tank & Newton’s Cooling Simulator", "labDesc": "Watch brine concentration swirl in real time or monitor a hot bar cooling exponentially toward ambient temperature.", "topics": [{"id": "t3_1", "code": "3.1", "title": "Mixing Tank, Air-Flow & Two-Tank Cascade Models", "summary": "Constant-volume mixing, variable-volume overflow tanks, room air-circulation, and coupled tank cascades.", "formulas": [{"id": "f3_1_1", "name": "General Mixing Tank Balance ODE", "math": "\\frac{dy}{dt} = c_{\\text{in}} r_{\\text{in}} - \\frac{r_{\\text{out}}}{V_0 + (r_{\\text{in}} - r_{\\text{out}})t}\\,y(t)", "note": "V(t) = V₀ + (r_in − r_out)t. Fresh water inflow sets c_in = 0 (immediately separable).", "trick": "In a 2-tank cascade, solve Tank 1 first, then plug its outflow r·y₁(t)/V₁ as Tank 2’s inflow!", "trap": false}], "steps": ["Write V(t) = V₀ + (r_in − r_out)t and check if overflow occurs.", "Set up dy/dt + [r_out/V(t)]y = c_in·r_in with initial solute y(0) = y₀.", "Solve the 1st-order linear ODE and evaluate at target t (or find max via dy/dt = 0)."], "questions": [{"id": "Q38", "tag": "Set 1 · Q.7(a) · 4M", "marks": "4M", "level": "Basic", "prompt": "A tank holds 400 gal brine with 100 lb salt. Fresh water enters at 4 gal/min and exits at 4 gal/min. Find salt at t = 60 min.", "promptMath": "", "hint": "Rate In = 0 ⇒ dy/dt = −(4/400)y = −y/100.", "steps": [{"text": "Solve separable ODE:", "math": "y(t) = 100 e^{-t/100} \\implies y(60) = 100 e^{-0.6} \\approx 54.88\\text{ lb}"}], "answer": "y(t) = 100e^{-t/100},\\quad y(60) \\approx 54.88\\text{ lb}"}, {"id": "Q40", "tag": "Set 3 · Q.7(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "A 20,000 ft³ room gets 600 ft³/min fresh air (same outflow). After how long is the room 80% fresh air?", "promptMath": "", "hint": "dy/dt = 600 − 0.03y, y(0) = 0 ⇒ y(t) = 20,000(1 − e^{−0.03t}).", "steps": [{"text": "Solve linear ODE and set y = 0.80 × 20,000:", "math": "1 - e^{-0.03t} = 0.80 \\implies t = \\frac{\\ln 5}{0.03} \\approx 53.65\\text{ min}"}], "answer": "t = \\frac{\\ln 5}{0.03} \\approx 53.65\\text{ min}"}, {"id": "Q42", "tag": "Set 5 · Q.7(a) · 4M", "marks": "4M", "level": "Advanced", "prompt": "A 500 L tank initially holds 300 L brine with 50 kg salt. Brine (1 kg/L) enters at 5 L/min; mixture exits at 3 L/min. Find salt at overflow.", "promptMath": "", "hint": "V(t) = 300 + 2t hits 500 L at t = 100 min.", "steps": [{"text": "Linear ODE with I.F. = (300 + 2t)^{3/2}:", "math": "y(t) = (300+2t) - 250\\!\\left(\\frac{300}{300+2t}\\right)^{3/2}"}, {"text": "Evaluate at overflow t = 100 min:", "math": "y(100) = 500 - 250(0.6)^{3/2} \\approx 402.8\\text{ kg}"}], "answer": "y(100) \\approx 402.8\\text{ kg}"}, {"id": "Q46", "tag": "Set 10 · Q.7(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Tank T₁ (100 L, 40 kg salt) gets pure water at 5 L/min and drains into T₂ (100 L pure water) at 5 L/min. Find y₁, y₂ and max time for T₂.", "promptMath": "", "hint": "y₁ = 40e^{−0.05t}, then y₂′ + 0.05y₂ = 2e^{−0.05t}.", "steps": [{"text": "Solve T₁ then T₂:", "math": "y_1(t) = 40e^{-0.05t},\\qquad y_2(t) = 2t e^{-0.05t}"}, {"text": "Set y₂′(t) = 2(1 − 0.05t)e^{−0.05t} = 0:", "math": "t_{\\max} = 20\\text{ min}"}], "answer": "y_1 = 40e^{-0.05t},\\; y_2 = 2te^{-0.05t},\\; t_{\\max} = 20\\text{ min}"}, {"id": "Q39", "tag": "Topic 3.1 · Brine Inflow · 4M", "marks": "4M", "level": "Basic", "prompt": "A 100 gal tank initially holds pure water. Brine (2 lb/gal) enters at 3 gal/min and exits at 3 gal/min. Find y(t) and steady-state salt.", "promptMath": "\\frac{dy}{dt} + 0.03y = 6,\\qquad y(0) = 0", "hint": "I.F. = e^{0.03t}; steady-state = c_in · V = 2 × 100 = 200 lb.", "steps": [{"text": "Solve linear ODE with y(0) = 0:", "math": "y(t) = 200(1 - e^{-0.03t})\\text{ lb} \\xrightarrow{t\\to\\infty} 200\\text{ lb}"}], "answer": "y(t) = 200(1 - e^{-0.03t})\\text{ lb},\\quad y_{\\infty} = 200\\text{ lb}"}, {"id": "Q41", "tag": "Topic 3.1 · Steady State · 1M", "marks": "1M", "level": "Basic", "prompt": "A constant-volume 250 L tank receives brine at 0.4 kg/L at 5 L/min (same outflow). What is the limiting salt mass as t → ∞?", "promptMath": "", "hint": "At steady state dy/dt = 0 ⇒ Rate In = Rate Out ⇒ y_∞ = c_in · V.", "steps": [{"text": "Multiply inflow concentration by constant tank volume:", "math": "y_{\\infty} = c_{\\text{in}} V = 0.4 \\times 250 = 100\\text{ kg}"}], "answer": "100\\text{ kg}"}]}, {"id": "t3_2", "code": "3.2", "title": "Newton’s Law of Cooling & Heating", "summary": "Exponential relaxation toward surrounding temperature T_s with the zero-rounding Ratio Shortcut.", "formulas": [{"id": "f3_2_1", "name": "Newton’s Law & Zero-Rounding Ratio Shortcut", "math": "T(t) = T_s + (T_0 - T_s)\\,e^{kt} = T_s + (T_0 - T_s)\\left(\\frac{T_1 - T_s}{T_0 - T_s}\\right)^{t/t_1}", "note": "Write α = (T₁ − T_s)/(T₀ − T_s) = e^{kt₁}. Works for BOTH cooling and heating!", "trick": "Ratio Shortcut avoids intermediate rounding of k and gives T(2t₁), T(3t₁) instantly!", "trap": false}], "steps": ["Identify surrounding T_s and initial T₀ to write T(t) = T_s + (T₀ − T_s)e^{kt}.", "Compute ratio α = (T₁ − T_s)/(T₀ − T_s) directly from the second data point.", "Plug into T(t) = T_s + (T₀ − T_s) α^{t/t₁}."], "questions": [{"id": "Q47", "tag": "Set 1 · Q.7(b) · 4M", "marks": "4M", "level": "Basic", "prompt": "A metal bar at 40°C is placed in 100°C boiling water. After 1 min it is 60°C. When will it reach 99°C?", "promptMath": "", "hint": "α = (60 − 100)/(40 − 100) = 2/3.", "steps": [{"text": "Use T(t) = 100 − 60(2/3)^t and set T = 99:", "math": "60\\left(\\frac{2}{3}\\right)^t = 1 \\implies t = \\frac{\\ln 60}{\\ln(3/2)} \\approx 10.10\\text{ min}"}], "answer": "t \\approx 10.10\\text{ min}"}, {"id": "Q49", "tag": "Set 3 · Q.7(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "A body cools from 80°C to 60°C in 10 min in air at 30°C. Find T(20) and time to reach 40°C.", "promptMath": "", "hint": "α = 30/50 = 0.6 per 10 min.", "steps": [{"text": "At t = 20 (two intervals):", "math": "T(20) = 30 + 50(0.6)^2 = 48^\\circ\\text{C}"}, {"text": "For T = 40 (ΔT = 10):", "math": "50(0.6)^{t/10} = 10 \\implies t = 10\\frac{\\ln 0.2}{\\ln 0.6} \\approx 31.51\\text{ min}"}], "answer": "T(20) = 48^\\circ\\text{C},\\quad t_{40^\\circ\\text{C}} \\approx 31.51\\text{ min}"}, {"id": "Q50", "tag": "Set 6 · Q.7(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "A thermometer at 5°C enters a 22°C room. After 1 min it reads 12°C. When does it read 21.9°C?", "promptMath": "", "hint": "α = 10/17.", "steps": [{"text": "Set 17(10/17)^t = 0.1:", "math": "(1.7)^t = 170 \\implies t = \\frac{\\ln 170}{\\ln 1.7} \\approx 9.68\\text{ min}"}], "answer": "t \\approx 9.68\\text{ min}"}, {"id": "Q52", "tag": "Set 9 · Q.7(a) · 4M", "marks": "4M", "level": "Advanced", "prompt": "A casting at 300°C cools in a 30°C bath to 210°C in 3 min. When does it reach 60°C?", "promptMath": "", "hint": "α = 180/270 = 2/3 per 3 min; target ΔT = 30 (ratio 1/9).", "steps": [{"text": "Solve (2/3)^{t/3} = 1/9:", "math": "t = \\frac{3\\ln 9}{\\ln(3/2)} \\approx 16.25\\text{ min}"}], "answer": "t \\approx 16.25\\text{ min}"}, {"id": "Q51", "tag": "Set 8 · Q.7(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Coffee initially at 95°C cools to 80°C in 5 min in a 20°C room. Find when it reaches 50°C.", "promptMath": "", "hint": "ΔT₀ = 75, ΔT(5) = 60 ⇒ α = 60/75 = 4/5 per 5 min.", "steps": [{"text": "Set 75(4/5)^{t/5} = 30 ⇒ (4/5)^{t/5} = 0.4:", "math": "t = 5\\,\\frac{\\ln(0.4)}{\\ln(0.8)} \\approx 20.53\\text{ min}"}], "answer": "t \\approx 20.53\\text{ min}"}, {"id": "Q53", "tag": "Set 10 · Q.7(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "A thermometer at 75°F is taken outside (20°F). After 3 min it reads 53°F. Find its reading at 6 min.", "promptMath": "", "hint": "Ratio Shortcut! ΔT(0) = 55, ΔT(3) = 33 ⇒ α = 33/55 = 0.6; at 6 min multiply by α²!", "steps": [{"text": "Two 3-minute intervals ⇒ ΔT(6) = 55(0.6)² = 19.8:", "math": "T(6) = 20 + 19.8 = 39.8^\\circ\\text{F}"}], "answer": "39.8^\\circ\\text{F}"}]}, {"id": "t3_3", "code": "3.3", "title": "Exponential Growth, Radioactive Decay & 1st-Order RL/RC Circuits", "summary": "Half-life radiocarbon dating, population growth/decay, and RL/RC circuit transients.", "formulas": [{"id": "f3_3_1", "name": "Radioactive Decay & Half-Life", "math": "N(t) = N_0 e^{-kt} = N_0\\left(\\frac{1}{2}\\right)^{t/H}, \\qquad H = \\frac{\\ln 2}{k}", "note": "Carbon-14 half-life H = 5730 yr. Direct age: t = H·ln(N₀/N)/ln 2.", "trick": "Skip intermediate rounding of k by using t = H·ln(N₀/N)/ln 2!", "trap": false}, {"id": "f3_3_2", "name": "First-Order RL & RC Circuits", "math": "L I' + R I = E \\implies I(t) = \\frac{E}{R}\\!\\left(1 - e^{-(R/L)t}\\right); \\qquad R Q' + \\frac{Q}{C} = 0 \\implies Q(t) = Q_0 e^{-t/(RC)}", "note": "Time constants: τ_RL = L/R and τ_RC = RC.", "trick": "90% of steady state takes τ ln 10 ≈ 2.303 τ; 99% discharge takes τ ln 100 ≈ 4.605 τ.", "trap": false}], "steps": ["Identify growth/decay model N′ = ±kN or KVL circuit equation (RL or RC).", "Apply initial condition N(0)=N₀, I(0)=0, or Q(0)=Q₀.", "Take natural logs to solve for target time or percentage threshold."], "questions": [{"id": "Q54", "tag": "Set 1 · Q.1(a) · 1M", "marks": "1M", "level": "Basic", "prompt": "Bacteria growth rate is proportional to population and becomes 1.5× in 1 week. Write the mathematical model.", "promptMath": "", "hint": "dN/dt = kN with N(0) = N₀ and N(1) = 1.5 N₀.", "steps": [{"text": "Write ODE and conditions:", "math": "\\frac{dN}{dt} = kN,\\quad N(0) = N_0,\\quad N(1) = 1.5 N_0 \\implies N(t) = N_0(1.5)^t"}], "answer": "\\frac{dN}{dt} = kN,\\; N(0)=N_0,\\; N(1)=1.5N_0"}, {"id": "Q57", "tag": "Set 4 · Q.7(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "A fossil contains 20% of its original ¹⁴C (half-life 5730 yr). Estimate its age.", "promptMath": "", "hint": "Use (1/2)^{t/5730} = 1/5.", "steps": [{"text": "Apply direct half-life age formula:", "math": "t = 5730\\,\\frac{\\ln 5}{\\ln 2} \\approx 13{,}305\\text{ years}"}], "answer": "t \\approx 13{,}305\\text{ years}"}, {"id": "Q59", "tag": "Set 7 · Q.7(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "An RL circuit has L = 2 H, R = 10 Ω, E = 100 V, I(0) = 0. Find I(t) and time to reach 90% of steady state.", "promptMath": "", "hint": "I′ + 5I = 50 ⇒ I(t) = 10(1 − e^{−5t}).", "steps": [{"text": "Solve KVL ODE and set 1 − e^{−5t} = 0.9:", "math": "I(t) = 10(1 - e^{-5t})\\text{ A},\\qquad t = \\frac{\\ln 10}{5} \\approx 0.4605\\text{ s}"}], "answer": "I(t) = 10(1 - e^{-5t})\\text{ A},\\quad t_{90\\%} \\approx 0.4605\\text{ s}"}, {"id": "Q60", "tag": "Set 8 · Q.7(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "A capacitor C = 10⁻³ F holding Q₀ = 0.05 C discharges through R = 200 Ω. Find Q(t) and when 99% dissipates.", "promptMath": "", "hint": "RC = 0.2 s ⇒ Q(t) = 0.05 e^{−5t}; 99% dissipated means 0.01 remains.", "steps": [{"text": "Solve discharge ODE and set e^{−5t} = 0.01:", "math": "Q(t) = 0.05e^{-5t}\\text{ C},\\qquad t = \\frac{\\ln 100}{5} \\approx 0.921\\text{ s}"}], "answer": "Q(t) = 0.05e^{-5t}\\text{ C},\\quad t_{99\\%} \\approx 0.921\\text{ s}"}, {"id": "Q55", "tag": "Set 2 · Q.1(c) · 1M", "marks": "1M", "level": "Basic", "prompt": "An insect population decays at a rate proportional to its size and drops to half in 4 days. Write the ODE and solution.", "promptMath": "", "hint": "dN/dt = −kN with k = (ln 2)/4.", "steps": [{"text": "Write model and closed form:", "math": "\\frac{dN}{dt} = -kN,\\quad N(t) = N_0\\left(\\frac{1}{2}\\right)^{t/4}"}], "answer": "\\frac{dN}{dt} = -kN,\\quad N(t) = N_0(1/2)^{t/4}"}, {"id": "Q58", "tag": "Topic 3.3 · Doubling Time · 1M", "marks": "1M", "level": "Basic", "prompt": "If a bacteria culture triples in 2 hours under exponential growth, find its doubling time.", "promptMath": "", "hint": "e^{2k} = 3 ⇒ k = (ln 3)/2 ⇒ t₂ = (ln 2)/k.", "steps": [{"text": "Compute doubling time:", "math": "t_2 = \\frac{\\ln 2}{(\\ln 3)/2} = \\frac{2\\ln 2}{\\ln 3} \\approx 1.262\\text{ hours}"}], "answer": "t_2 = \\frac{2\\ln 2}{\\ln 3} \\approx 1.26\\text{ hours}"}]}]}, {"id": "co4", "co": "CO4", "number": 4, "weightage": "14–18 Marks · High Yield", "weightPct": 88, "title": "Second-Order Linear ODEs & Electric Circuits", "shortTitle": "2nd-Order ODEs & RLC", "lectures": "Lectures 25–36", "refs": "T1 (Kreyszig): Sec. 2.1–2.3, 2.5–2.7, 2.9–2.10", "accent": "cobalt", "accentHex": "#2563eb", "gradCss": "linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 55%, #2563eb 100%)", "labTitle": "RLC Circuit & Damped-Forced Oscillator Lab", "labDesc": "Tune R, L, C, and forcing frequency ω to see underdamped, critical, overdamped, and resonance waves live.", "topics": [{"id": "t4_1", "code": "4.1", "title": "Homogeneous Constant-Coeff ODEs, Wronskian & Abel’s Formula", "summary": "Characteristic roots Cases I/II/III, basis reconstruction, Wronskian W(y₁,y₂), and Abel’s identity.", "formulas": [{"id": "f4_1_1", "name": "Characteristic Equation: y″ + ay′ + by = 0", "math": "\\lambda^2 + a\\lambda + b = 0 \\implies \\text{I: } c_1 e^{\\lambda_1 x}+c_2 e^{\\lambda_2 x}\\;\\mid\\; \\text{II: } (c_1+c_2 x)e^{\\lambda x}\\;\\mid\\; \\text{III: } e^{\\alpha x}(A\\cos\\beta x+B\\sin\\beta x)", "note": "Discriminant Δ = a² − 4b classifies Cases I (>0), II (=0), and III (<0).", "trick": "Reverse problem: basis {e^{4x}, xe^{4x}} ⇒ double root λ=4 ⇒ (λ−4)²=0 ⇒ y″−8y′+16y=0.", "trap": false}, {"id": "f4_1_2", "name": "Wronskian & Abel’s Identity", "math": "W(y_1, y_2) = y_1 y_2' - y_2 y_1', \\qquad W(x) = W(x_0)\\,e^{-\\int_{x_0}^x p(t)\\,dt}", "note": "Solutions of y″ + p(x)y′ + q(x)y = 0 are linearly independent iff W(x) ≠ 0.", "trick": "If p(x) = 0, Abel’s formula proves W(x) is strictly constant!", "trap": false}], "steps": ["Solve λ² + aλ + b = 0 and classify Case I, II, or III.", "Apply y(x₀) and y′(x₀) for IVPs to solve the 2×2 system for constants.", "Use W = y₁y₂′ − y₂y₁′ (or Abel’s formula) to verify linear independence."], "questions": [{"id": "Q61", "tag": "Set 1 · Q.1(c) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find a 2nd-order homogeneous ODE for the basis of solutions:", "promptMath": "\\{e^{4x},\\; x e^{4x}\\}", "hint": "Double root λ = 4 ⇒ (λ − 4)² = 0.", "steps": [{"text": "Expand (λ − 4)² = 0:", "math": "\\lambda^2 - 8\\lambda + 16 = 0 \\implies y'' - 8y' + 16y = 0"}], "answer": "y'' - 8y' + 16y = 0"}, {"id": "Q77", "tag": "Set 9 · Q.1(c) · 1M", "marks": "1M", "level": "Basic", "prompt": "State Abel’s formula for the Wronskian of y″ + p(x)y′ + q(x)y = 0.", "promptMath": "", "hint": "W(x) depends exponentially on −∫p(t) dt.", "steps": [{"text": "Since W′ = −p(x)W, integrating from x₀ to x gives Abel’s identity:", "math": "W(x) = W(x_0)\\,\\exp\\!\\left(-\\int_{x_0}^x p(t)\\,dt\\right)"}], "answer": "W(x) = W(x_0)\\,\\exp\\!\\left(-\\int_{x_0}^x p(t)\\,dt\\right)"}, {"id": "Q63", "tag": "Set 3 · Q.1(c) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Compute the Wronskian:", "promptMath": "W(\\tan x, \\cot x)", "hint": "W = tan x (−csc²x) − cot x (sec²x).", "steps": [{"text": "Simplify to sin x and cos x:", "math": "W = -\\frac{1}{\\sin x\\cos x} - \\frac{1}{\\sin x\\cos x} = -\\frac{4}{\\sin 2x} = -4\\csc 2x"}], "answer": "-4\\csc 2x"}, {"id": "Q81", "tag": "Set 3 · Q.3(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the initial value problem:", "promptMath": "y'' - 3y' - 4y = 0, \\qquad y(0) = 2,\\; y'(0) = 1", "hint": "Roots λ = 4, −1.", "steps": [{"text": "General solution: y = c₁e^{4x} + c₂e^{−x}. Apply ICs:", "math": "c_1 + c_2 = 2,\\; 4c_1 - c_2 = 1 \\implies c_1 = \\frac{3}{5},\\; c_2 = \\frac{7}{5}"}], "answer": "y(x) = \\frac{3}{5}e^{4x} + \\frac{7}{5}e^{-x}"}, {"id": "Q62", "tag": "Set 2 · Q.1(a) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find a 2nd-order homogeneous ODE with basis of solutions:", "promptMath": "\\{1,\\; e^{4x}\\}", "hint": "Roots λ = 0 and λ = 4 ⇒ λ(λ − 4) = 0.", "steps": [{"text": "Form auxiliary equation:", "math": "\\lambda^2 - 4\\lambda = 0 \\implies y'' - 4y' = 0"}], "answer": "y'' - 4y' = 0"}, {"id": "Q78", "tag": "Set 9 · Q.1(e) · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve the harmonic IVP:", "promptMath": "y'' + 9y = 0, \\qquad y(0) = 0.2,\\; y'(0) = -1.5", "hint": "y = A cos 3x + B sin 3x; A = y(0), 3B = y′(0).", "steps": [{"text": "Apply initial conditions:", "math": "A = 0.2,\\quad 3B = -1.5 \\implies B = -0.5"}], "answer": "y(x) = 0.2\\cos 3x - 0.5\\sin 3x"}, {"id": "Q79", "tag": "Set 10 · Q.1(a) · 1M", "marks": "1M", "level": "Basic", "prompt": "Compute the Wronskian:", "promptMath": "W(e^{2x},\\; x e^{2x})", "hint": "W = y₁y₂′ − y₂y₁′.", "steps": [{"text": "Expand determinant:", "math": "e^{2x}(e^{2x} + 2xe^{2x}) - (xe^{2x})(2e^{2x}) = e^{4x}"}], "answer": "e^{4x}"}]}, {"id": "t4_2", "code": "4.2", "title": "Euler–Cauchy Equations & Reduction of Order (Sec. 2.1 & 2.5)", "summary": "Variable-coefficient x²y″ + axy′ + by = 0 via y = x^m and deriving y₂ from known y₁.", "formulas": [{"id": "f4_2_1", "name": "Euler–Cauchy Auxiliary Equation", "math": "x^2 y'' + axy' + by = 0 \\xrightarrow{y=x^m} m^2 + (a - 1)m + b = 0", "note": "Distinct: c₁x^{m₁} + c₂x^{m₂}; Equal: (c₁ + c₂ ln x)x^m; Complex α±iβ: x^α[A cos(β ln x) + B sin(β ln x)].", "trick": "Don’t forget (a − 1) instead of a!", "trap": false}, {"id": "f4_2_2", "name": "Reduction of Order (Standard Form!)", "math": "y_2(x) = y_1(x)\\int \\frac{e^{-\\int p(x)\\,dx}}{[y_1(x)]^2}\\,dx", "note": "ALWAYS normalize to y″ + p(x)y′ + q(x)y = 0 (leading coeff = 1) before reading p(x)!", "trick": "Forgetting to divide by x² in Euler–Cauchy before Reduction of Order is the #1 exam trap!", "trap": true}], "steps": ["Euler–Cauchy: Solve m(m−1) + am + b = 0 and write powers of x (with ln x for repeated/complex roots).", "Reduction of Order: Divide by leading coeff of y″, find e^{−∫p dx}, and integrate e^{−∫p dx}/y₁²."], "questions": [{"id": "Q84", "tag": "Set 3 · Q.1(b) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find λ and μ if {x², x² ln x} is a basis of:", "promptMath": "x^2 y'' + 3\\lambda xy' + \\mu y = 0", "hint": "Double root m = 2 ⇒ (m − 2)² = m² − 4m + 4 = 0.", "steps": [{"text": "Match coefficients:", "math": "m^2 + (3\\lambda - 1)m + \\mu = m^2 - 4m + 4 \\implies \\lambda = -1,\\; \\mu = 4"}], "answer": "\\lambda = -1,\\quad \\mu = 4"}, {"id": "Q86", "tag": "Set 5 · Q.1(b) · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve the Euler–Cauchy equation (x > 0):", "promptMath": "x^2 y'' + x y' + 9y = 0", "hint": "m² + 9 = 0 ⇒ m = ±3i.", "steps": [{"text": "Complex roots α = 0, β = 3:", "math": "y(x) = c_1\\cos(3\\ln x) + c_2\\sin(3\\ln x)"}], "answer": "y(x) = c_1\\cos(3\\ln x) + c_2\\sin(3\\ln x)"}, {"id": "Q88", "tag": "Set 1 · Q.2(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Given y₁ = x, find y₂ by Reduction of Order and solve the IVP:", "promptMath": "x^2 y'' - xy' + y = 0, \\qquad y(1) = 2,\\; y'(1) = 3", "hint": "Standard form has p(x) = −1/x ⇒ e^{−∫p dx} = x.", "steps": [{"text": "Compute y₂:", "math": "y_2 = x\\int \\frac{x}{x^2}\\,dx = x\\ln x \\implies y = c_1 x + c_2 x\\ln x"}, {"text": "Apply y(1)=2, y′(1)=3:", "math": "c_1 = 2,\\quad c_1 + c_2 = 3 \\implies c_2 = 1"}], "answer": "y(x) = 2x + x\\ln x"}, {"id": "Q92", "tag": "Set 5 · Q.2(a) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Given y₁ = (cos x)/x, find the general solution via Reduction of Order:", "promptMath": "xy'' + 2y' + xy = 0", "hint": "Divide by x so p(x) = 2/x ⇒ e^{−∫p dx} = x^{−2}.", "steps": [{"text": "Normalize and integrate:", "math": "y_2 = \\frac{\\cos x}{x}\\int \\frac{x^{-2}}{(\\cos^2 x)/x^2}\\,dx = \\frac{\\cos x}{x}\\tan x = \\frac{\\sin x}{x}"}], "answer": "y(x) = \\frac{c_1\\cos x + c_2\\sin x}{x}"}, {"id": "Q87", "tag": "Set 6 · Q.1(c) · 1M", "marks": "1M", "level": "Basic", "prompt": "Write the general solution of the Euler–Cauchy equation:", "promptMath": "(x^2 D^2 - 3xD + 4I)y = 0", "hint": "m(m−1) − 3m + 4 = (m − 2)² = 0 (double root m = 2).", "steps": [{"text": "Double root m = 2 gives Case II:", "math": "y(x) = (c_1 + c_2\\ln x)x^2"}], "answer": "y(x) = (c_1 + c_2\\ln x)x^2"}, {"id": "Q87b", "tag": "Topic 4.2 · Euler–Cauchy · 1M", "marks": "1M", "level": "Basic", "prompt": "Solve the Euler–Cauchy equation (x > 0):", "promptMath": "x^2 y'' - 2xy' + 2y = 0", "hint": "m(m−1) − 2m + 2 = m² − 3m + 2 = (m−1)(m−2) = 0.", "steps": [{"text": "Distinct roots m = 1, 2:", "math": "y(x) = c_1 x + c_2 x^2"}], "answer": "y(x) = c_1 x + c_2 x^2"}, {"id": "Q90", "tag": "Topic 4.2 · Reduction of Order · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Given y₁ = e^x solves y″ − 2y′ + y = 0, derive y₂ using Reduction of Order.", "promptMath": "y'' - 2y' + y = 0, \\qquad y_1 = e^x", "hint": "p(x) = −2 ⇒ e^{−∫p dx} = e^{2x}.", "steps": [{"text": "Apply Reduction of Order formula:", "math": "y_2 = e^x\\int \\frac{e^{2x}}{(e^x)^2}\\,dx = e^x\\int 1\\,dx = x e^x"}], "answer": "y_2(x) = x e^x"}]}, {"id": "t4_3", "code": "4.3", "title": "Nonhomogeneous ODEs: Method of Undetermined Coefficients (Sec. 2.7)", "summary": "Kreyszig Table 2.1 trial forms, Sum Rule, and the Modification Rule for resonance/duplication.", "formulas": [{"id": "f4_3_1", "name": "General Solution & Modification Rule", "math": "y = y_h + y_p; \\qquad \\text{Duplicate simple root} \\to \\times x,\\quad \\text{duplicate double root} \\to \\times x^2", "note": "Works ONLY for constant-coeff ODEs with r(x) composed of e^{γx}, x^n, cos ωx, sin ωx.", "trick": "ALWAYS find y_h FIRST before writing your trial y_p, or you will miss resonance!", "trap": true}], "steps": ["Solve homogeneous ODE for y_h.", "Choose trial y_p from Kreyszig Table 2.1 for each term in r(x).", "Multiply by x or x² if any term duplicates y_h, substitute, and equate coefficients."], "questions": [{"id": "Q98", "tag": "Set 7 · Q.1(c) · 1M", "marks": "1M", "level": "Basic", "prompt": "Write the correct trial form of y_p for:", "promptMath": "y'' - 4y' + 4y = 3e^{2x} + xe^{2x}", "hint": "λ = 2 is a double root of the homogeneous ODE.", "steps": [{"text": "Since y_h = (c₁ + c₂x)e^{2x}, multiply basic trial (A₀ + A₁x)e^{2x} by x²:", "math": "y_p = x^2(A_0 + A_1 x)e^{2x}"}], "answer": "y_p = x^2(A_0 + A_1 x)e^{2x}"}, {"id": "Q101", "tag": "Set 3 · Q.2(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve by Undetermined Coefficients:", "promptMath": "y'' + 4y = \\cos 2x", "hint": "Resonance with y_h = A cos 2x + B sin 2x ⇒ multiply trial by x.", "steps": [{"text": "Plug y_p = x(K cos 2x + M sin 2x) into ODE:", "math": "-4K\\sin 2x + 4M\\cos 2x = \\cos 2x \\implies K = 0,\\; M = \\frac{1}{4}"}], "answer": "y = A\\cos 2x + B\\sin 2x + \\frac{1}{4}x\\sin 2x"}, {"id": "Q104", "tag": "Set 6 · Q.3(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve the initial value problem:", "promptMath": "y'' + 3y' + 2.25y = -10e^{-1.5x}, \\qquad y(0) = 1,\\; y'(0) = 0", "hint": "Double root λ = −1.5 ⇒ try y_p = C x² e^{−1.5x}.", "steps": [{"text": "Find y_h and y_p:", "math": "y_h = (c_1 + c_2 x)e^{-1.5x},\\qquad y_p = -5x^2 e^{-1.5x}"}, {"text": "Apply y(0) = 1, y′(0) = 0:", "math": "c_1 = 1,\\quad c_2 = 1.5"}], "answer": "y(x) = (1 + 1.5x - 5x^2)e^{-1.5x}"}, {"id": "Q107", "tag": "Set 9 · Q.3(a) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve using the Sum Rule of Undetermined Coefficients:", "promptMath": "(D^2 - 4D + 4I)y = 8(x^2 + e^{2x} + \\sin 2x)", "hint": "Solve for 8e^{2x} (double root!), 8 sin 2x, and 8x² separately.", "steps": [{"text": "Combine all three particular solutions:", "math": "y_{p1} = 4x^2 e^{2x},\\quad y_{p2} = 2\\cos 2x,\\quad y_{p3} = 2x^2 + 4x + 3"}], "answer": "y = (c_1 + c_2 x + 4x^2)e^{2x} + 2\\cos 2x + 2x^2 + 4x + 3"}, {"id": "Q105", "tag": "Set 7 · Q.3(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve by Undetermined Coefficients:", "promptMath": "(3D^2 + 27I)y = 3\\cos x + \\cos 3x", "hint": "Divide by 3: y″ + 9y = cos x + (1/3)cos 3x (note resonance on cos 3x!).", "steps": [{"text": "Homogeneous: y_h = A cos 3x + B sin 3x."}, {"text": "For cos x: y_{p1} = (1/8)cos x. For (1/3)cos 3x (resonant): y_{p2} = (1/18)x sin 3x."}], "answer": "y = A\\cos 3x + B\\sin 3x + \\frac{1}{8}\\cos x + \\frac{1}{18}x\\sin 3x"}, {"id": "Q108", "tag": "Set 10 · Q.3(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve by Undetermined Coefficients:", "promptMath": "(D^2 - 2D)y = 6e^{2x} - 4e^{-2x}", "hint": "Roots λ = 0, 2 ⇒ 6e^{2x} duplicates simple root λ = 2 (multiply by x!).", "steps": [{"text": "y_h = c₁ + c₂e^{2x}; try y_p = Axe^{2x} + Be^{−2x}:", "math": "2A = 6 \\implies A = 3;\\qquad 8B = -4 \\implies B = -\\frac{1}{2}"}], "answer": "y = c_1 + c_2 e^{2x} + 3x e^{2x} - \\frac{1}{2}e^{-2x}"}, {"id": "Q103", "tag": "Topic 4.3 · Undet. Coeffs · 4M", "marks": "4M", "level": "Basic", "prompt": "Solve the nonhomogeneous ODE:", "promptMath": "y'' + 2y' + 5y = 10e^{-x}", "hint": "Roots λ = −1 ± 2i (no duplication with e^{−x}) ⇒ try y_p = C e^{−x}.", "steps": [{"text": "Substitute y_p = C e^{−x} ⇒ (1 − 2 + 5)C = 10 ⇒ C = 2.5:", "math": "y = e^{-x}(A\\cos 2x + B\\sin 2x) + \\frac{5}{2}e^{-x}"}], "answer": "y = e^{-x}\\!\\left(A\\cos 2x + B\\sin 2x + \\frac{5}{2}\\right)"}]}, {"id": "t4_4", "code": "4.4", "title": "Method of Variation of Parameters (Sec. 2.10)", "summary": "Universal formula for any continuous r(x) such as sec x, tan x, sec³x, or e^x/x³.", "formulas": [{"id": "f4_4_1", "name": "Variation of Parameters Formula", "math": "y_p(x) = -y_1\\int\\frac{y_2 r}{W}\\,dx + y_2\\int\\frac{y_1 r}{W}\\,dx", "note": "Leading coefficient of y″ MUST be 1 before plugging r(x) into the integrals!", "trick": "EXAM TRAP: For (x²D² + axD + bI)y = R(x), divide by x² first so r(x) = R(x)/x²!", "trap": true}], "steps": ["Normalize to y″ + py′ + qy = r(x) and find basis {y₁, y₂}.", "Compute Wronskian W = y₁y₂′ − y₂y₁′.", "Integrate u₁ = −∫(y₂r/W)dx and u₂ = ∫(y₁r/W)dx to form y = y_h + u₁y₁ + u₂y₂."], "questions": [{"id": "Q113", "tag": "Set 4 · Q.4(b) · 4M", "marks": "4M", "level": "Basic", "prompt": "Solve by Variation of Parameters:", "promptMath": "y'' + 9y = \\sec 3x", "hint": "y₁ = cos 3x, y₂ = sin 3x, W = 3.", "steps": [{"text": "Compute u₁ and u₂:", "math": "u_1 = -\\frac{1}{3}\\int \\tan 3x\\,dx = \\frac{1}{9}\\ln|\\cos 3x|,\\qquad u_2 = \\frac{x}{3}"}], "answer": "y = A\\cos 3x + B\\sin 3x + \\frac{1}{9}\\cos 3x\\ln|\\cos 3x| + \\frac{1}{3}x\\sin 3x"}, {"id": "Q115", "tag": "Set 6 · Q.4(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve on (−π/2, π/2) by Variation of Parameters:", "promptMath": "y'' + y = \\tan x", "hint": "y₁ = cos x, y₂ = sin x, W = 1; write sin²x/cos x = sec x − cos x.", "steps": [{"text": "Compute u₁ and u₂:", "math": "u_1 = -\\ln|\\sec x + \\tan x| + \\sin x,\\qquad u_2 = -\\cos x"}], "answer": "y = A\\cos x + B\\sin x - \\cos x\\ln|\\sec x + \\tan x|"}, {"id": "Q117", "tag": "Set 8 · Q.4(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve by Variation of Parameters:", "promptMath": "y'' - 2y' + y = \\frac{e^x}{x^3}", "hint": "y₁ = e^x, y₂ = xe^x, W = e^{2x}.", "steps": [{"text": "Integrate u₁ = 1/x and u₂ = −1/(2x²):", "math": "y_p = \\frac{e^x}{x} - \\frac{xe^x}{2x^2} = \\frac{e^x}{2x}"}], "answer": "y = \\left(c_1 + c_2 x + \\frac{1}{2x}\\right)e^x"}, {"id": "Q110", "tag": "Set 1 · Q.4(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve by Variation of Parameters:", "promptMath": "(D^2 + 2D + 2I)y = e^{-x}\\sec^3 x", "hint": "y₁ = e^{−x} cos x, y₂ = e^{−x} sin x, W = e^{−2x}.", "steps": [{"text": "Compute u₁ = −½ sec²x and u₂ = tan x:", "math": "y_p = e^{-x}\\!\\left(-\\frac{1}{2}\\sec x + \\sin x\\tan x\\right) \\to \\frac{1}{2}e^{-x}\\sec x"}], "answer": "y = e^{-x}\\!\\left(A\\cos x + B\\sin x + \\frac{1}{2}\\sec x\\right)"}, {"id": "Q116", "tag": "Set 7 · Q.4(b) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve by Variation of Parameters:", "promptMath": "(D^2 + 4I)y = 4\\sec^2(2x)", "hint": "y₁ = cos 2x, y₂ = sin 2x, W = 2.", "steps": [{"text": "u₁ = −2∫ sin 2x sec²(2x) dx = −sec 2x; u₂ = 2∫ sec 2x dx = ln|sec 2x + tan 2x|.", "math": "y_p = -1 + \\sin 2x\\,\\ln|\\sec 2x + \\tan 2x|"}], "answer": "y = A\\cos 2x + B\\sin 2x - 1 + \\sin 2x\\,\\ln|\\sec 2x + \\tan 2x|"}, {"id": "Q114", "tag": "Topic 4.4 · VoP csc x · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve on (0, π) by Variation of Parameters:", "promptMath": "y'' + y = \\csc x", "hint": "y₁ = cos x, y₂ = sin x, W = 1.", "steps": [{"text": "u₁ = −∫ 1 dx = −x; u₂ = ∫ cot x dx = ln|sin x|:", "math": "y_p = -x\\cos x + \\sin x\\,\\ln|\\sin x|"}], "answer": "y = A\\cos x + B\\sin x - x\\cos x + \\sin x\\,\\ln|\\sin x|"}, {"id": "Q111", "tag": "Set 2 · Q.4(b) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve the nonhomogeneous Euler–Cauchy ODE by Variation of Parameters:", "promptMath": "x^2 y'' - 2xy' + 2y = x^3 \\ln x", "hint": "EXAM TRAP: Divide by x² FIRST so r(x) = x ln x! Basis {x, x²}, W = x².", "s n/a_{n+1}| = lim [n²/(n+1)²] · 2.", "steps": [{"text": "Evaluate Ratio Test limit:", "math": "R = \\lim_{n\\to\\infty}\\frac{n^2}{(n+1)^2}\\cdot 2 = 2"}], "answer": "R = 2"}, {"id": "Q140", "tag": "Set 10 · Q.1(f) · 1M", "marks": "1M", "level": "Basic", "prompt": "Define an ordinary point x = x₀ of y″ + p(x)y′ + q(x)y = 0.", "promptMath": "", "hint": "Both coefficient functions must be analytic at x₀.", "steps": [{"text": "x₀ is an ordinary point iff both p(x) and q(x) are analytic (expandable in convergent Taylor series) in a neighborhood of x₀."}], "answer": "p(x) \\text{ and } q(x) \\text{ are both analytic at } x = x_0"}, {"id": "Q136", "tag": "Topic 5.1 · Complex Distance · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Find the guaranteed minimum radius of convergence about x₀ = 1 for:", "promptMath": "(x^2 - 2x + 5)y'' + y = 0", "hint": "Complete the square: (x − 1)² + 4 = 0 ⇒ poles at 1 ± 2i.", "steps": [{"text": "Distance from x₀ = 1 to 1 ± 2i in ℂ:", "math": "R_{\\min} = |(1 \\pm 2i) - 1| = 2"}], "answer": "R_{\\min} = 2"}]}, {"id": "t5_2", "code": "5.2", "title": "Power Series Solutions, Legendre’s & Airy’s Equations", "summary": "Index-shifted recurrence relations, Legendre polynomials P_n(x), Airy’s ODE, and closed-form recognition.", "formulas": [{"id": "f5_2_1", "name": "Legendre’s ODE & Recurrence", "math": "(1-x^2)y'' - 2xy' + n(n+1)y = 0 \\implies c_{k+2} = -\\frac{(n-k)(n+k+1)}{(k+2)(k+1)}c_k", "note": "Normalized with P_n(1) = 1: P₀ = 1, P₁ = x, P₂ = ½(3x² − 1), P₃ = ½(5x³ − 3x).", "trick": "When k = n, the (n − k) factor hits 0—automatically terminating the polynomial solution!", "trap": false}], "steps": ["Assume y = ∑ c_n x^n, substitute y, y′, y″ into ODE, and align all sums to x^k.", "Pull out standalone low-power terms and solve for c_{k+2} in terms of earlier c_k.", "Group into c₀ y₁(x) + c₁ y₂(x)."], "questions": [{"id": "Q142", "tag": "Set 1 · Q.5(a) · 4M", "marks": "4M", "level": "Basic", "prompt": "Solve Legendre’s equation for n = 1 by power series:", "promptMath": "(1 - x^2)y'' - 2xy' + 2y = 0", "hint": "c_{k+2} = [(k−1)/(k+1)] c_k ⇒ c₃ = 0.", "steps": [{"text": "Odd branch terminates at c₃ = 0; even branch gives c₂ = −c₀, c₄ = −c₀/3, c₆ = −c₀/5."}], "answer": "y = c_0\\!\\left(1 - x^2 - \\frac{x^4}{3} - \\frac{x^6}{5} - \\cdots\\right) + c_1 x"}, {"id": "Q143", "tag": "Set 2 · Q.5(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Solve Legendre’s ODE of order 3 and derive P₃(x) with P₃(1) = 1:", "promptMath": "(1 - x^2)y'' - 2xy' + 12y = 0", "hint": "c_{k+2} = [(k−3)(k+4)/((k+1)(k+2))] c_k ⇒ c₃ = −(5/3)c₁, c₅ = 0.", "steps": [{"text": "Odd polynomial branch:", "math": "y_{\\text{poly}} = c_1\\!\\left(x - \\frac{5}{3}x^3\\right) \\xrightarrow{P_3(1)=1} c_1 = -\\frac{3}{2}"}], "answer": "P_3(x) = \\frac{1}{2}(5x^3 - 3x)"}, {"id": "Q144", "tag": "Set 3 · Q.5(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the power series solution of Airy’s equation about x₀ = 0:", "promptMath": "y'' - xy = 0", "hint": "c₂ = 0 and c_{k+2} = c_{k−1}/[(k+1)(k+2)] (step of 3!).", "steps": [{"text": "Recurrence relation:", "math": "c_2 = 0,\\qquad c_{k+2} = \\frac{c_{k-1}}{(k+1)(k+2)} \\;\\; (k \\ge 1)"}], "answer": "y = c_0\\!\\left(1 + \\frac{x^3}{6} + \\frac{x^6}{180} + \\cdots\\right) + c_1\\!\\left(x + \\frac{x^4}{12} + \\frac{x^7}{504} + \\cdots\\right)"}, {"id": "Q147", "tag": "Set 6 · Q.5(a) · 4M", "marks": "4M", "level": "Advanced", "prompt": "Solve about x₀ = 0 and identify the closed form:", "promptMath": "y'' - 4xy' + (4x^2 - 2)y = 0", "hint": "c_{2k} = c₀/k! and c_{2k+1} = c₁/k! ⇒ (c₀ + c₁x)e^{x²}.", "steps": [{"text": "Evaluate coefficients from recurrence:", "math": "c_{2k} = \\frac{c_0}{k!},\\; c_{2k+1} = \\frac{c_1}{k!} \\implies y = (c_0 + c_1 x)e^{x^2}"}], "answer": "y(x) = (c_0 + c_1 x)e^{x^2}"}, {"id": "Q148", "tag": "Set 7 · Q.5(a) · 4M", "marks": "4M", "level": "Intermediate", "prompt": "Find the polynomial solution of Chebyshev’s equation for n = 2:", "promptMath": "(1 - x^2)y'' - xy' + 4y = 0", "hint": "Recurrence: c_{k+2} = [(k² − 4)/((k+1)(k+2))] c_k ⇒ c₄ = 0!", "steps": [{"text": "Even branch: c₂ = −2c₀ and c₄ = 0:", "math": "y_{\\text{poly}} = c_0(1 - 2x^2) \\xrightarrow{T_2(1)=1} T_2(x) = 2x^2 - 1"}], "answer": "T_2(x) = 2x^2 - 1"}, {"id": "Q145", "tag": "Topic 5.2 · Legendre n=2 · 4M", "marks": "4M", "level": "Basic", "prompt": "Derive the second Legendre polynomial P₂(x) with P₂(1) = 1 from:", "promptMath": "(1 - x^2)y'' - 2xy' + 6y = 0", "hint": "c_{k+2} = [(k−2)(k+3)/((k+1)(k+2))] c_k ⇒ c₂ = −3c₀, c₄ = 0.", "steps": [{"text": "Normalize c₀(1 − 3x²) at x = 1 ⇒ c₀(−2) = 1 ⇒ c₀ = −1/2:", "math": "P_2(x) = \\frac{1}{2}(3x^2 - 1)"}], "answer": "P_2(x) = \\frac{1}{2}(3x^2 - 1)"}, {"id": "Q141", "tag": "Topic 5.2 · Power Series 1st-Order · 4M", "marks": "4M", "level": "Basic", "prompt": "Solve y′ = 2xy by the power series method about x₀ = 0 and identify the closed form.", "promptMath": "y' - 2xy = 0", "hint": "c₁ = 0 and c_{k+1} = 2 c_{k−1}/(k+1) ⇒ c_{2m} = c₀/m!.", "steps": [{"text": "All odd coeffs vanish; even coeffs give c_{2m} = c₀/m!:", "math": "y(x) = c_0\\sum_{m=0}^{\\infty}\\frac{x^{2m}}{m!} = c_0 e^{x^2}"}], "answer": "y(x) = c_0 e^{x^2}"}]}]}, {"id": "co6", "co": "CO6", "number": 6, "weightage": "15–18 Marks · Highest Yield", "weightPct": 96, "title": "Laplace Transforms & Applications", "shortTitle": "Laplace Transforms", "lectures": "Lectures 43–60", "refs": "T1 (Kreyszig): Sec. 6.1–6.3, 6.5–6.6, Tables 6.8–6.9", "accent": "magenta", "accentHex": "#c026d3", "gradCss": "linear-gradient(135deg, #701a75 0%, #a21caf 50%, #db2777 100%)", "labTitle": "Convolution Sliding-Window & Heaviside Lab", "labDesc": "Watch g(t − τ) flip and glide across f(τ) while tracing (f * g)(t), or slide u(t − a) live.", "topics": [{"id": "t6_1", "code": "6.1", "title": "Base Pairs, Improper Integrals & First Shifting Theorem (s-Shifting)", "summary": "Laplace integral definition, improper integrals via F(a), and First Shifting Theorem for e^{at}f(t).", "formulas": [{"id": "f6_1_1", "name": "Laplace Definition & Improper Integral Trick", "math": "\\mathcal{L}\\{f(t)\\} = F(s) = \\int_0^\\infty e^{-st}f(t)\\,dt \\quad\\Rightarrow\\quad \\int_0^\\infty e^{-at}f(t)\\,dt = F(a)", "note": "Gamma identity: L{t^p} = Γ(p+1)/s^{p+1} with Γ(1/2) = √π.", "trick": "Evaluate ∫₀^∞ t e^{−2t} sin 3t dt by finding L{t sin 3t} and plugging in s = 2!", "trap": false}, {"id": "f6_1_2", "name": "First Shifting Theorem (s-Shifting)", "math": "\\mathcal{L}\\{e^{at}f(t)\\} = F(s - a) \\iff \\mathcal{L}^{-1}\\{F(s - a)\\} = e^{at}f(t)", "note": "Complete the square (s − a)² ± ω² AND rewrite numerator s = (s − a) + a before pulling out e^{at}!", "trick": "For cosh(at)cos(at), expand cosh(at) = ½(e^{at} + e^{−at}) and apply First Shifting twice.", "trap": false}], "steps": ["Spot e^{at} multiplying f(t): transform f(t) first, then replace s → s − a.", "For inverse Laplace with quadratic denominator, complete the square and align numerator to (s − a)."], "questions": [{"id": "Q153", "tag": "Set 1 · Q.1(g) · 1M", "marks": "1M", "level": "Basic", "prompt": "Evaluate the Laplace integral:", "promptMath": "\\int_0^\\infty x^{-1/2} e^{-2x}\\,dx", "hint": "Use L{x^{−1/2}} = Γ(1/2)/s^{1/2} at s = 2.", "steps": [{"text": "Substitute s = 2:", "math": "\\frac{\\Gamma(1/2)}{\\sqrt{2}} = \\sqrt{\\frac{\\pi}{2}}"}], "answer": "\\sqrt{\\frac{\\pi}{2}}"}, {"id": "Q154", "tag": "Set 1 · Q.1(j) · 1M", "marks": "1M", "level": "Basic", "prompt": "Find the inverse Laplace transform:", "promptMath": "\\mathcal{L}^{-1}\\!\\left\\{\\frac{s + 2}{s^2 + 4s + 20}\\right\\}", "hint": "s² + 4s + 20 = (s + 2)² + 4².", "steps": [{"text": "Complete the square and apply First Shifting:", "math": "\\frac{s+2}{(s+2)^2 + 4^2} \\to e^{-2t}\\cos 4t"}], "answer": "e^{-2t}\\cos 4t"}, {"id": "Q159", "tag": "Set 5 · Q.1(g) · 1M", "marks": "1M", "level": "Intermediate", "prompt": "Evaluate using Laplace transforms:", "promptMath": "\\int_0^\\infty t e^{-2t}\
